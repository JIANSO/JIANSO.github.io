   n("dde","DDE (Dynamic Data Exchange)",["DDE는 매크로 없이도 문서를 여는 것만으로 악성 명령을 실행시킬 수 있어 악성 문서 공격에 쓰였으며, 14회에 출제되었다.","DDE(Dynamic Data Exchange)는 윈도우에서 프로그램끼리 데이터를 주고받는 오래된 기술이다.","정상적으로는 워드 문서가 엑셀 표의 값을 실시간으로 끌어와 보여 주는 데 쓴다.","공격자는 문서 안의 DDE 필드에 \"cmd.exe를 실행해서 값을 가져와\"라는 내용을 넣는다. 문서를 열면 업데이트 확인 창이 뜨고, 사용자가 허용하면 명령이 실행된다. 매크로 없이도 악성 코드가 실행되는 셈이다.","대응은 오피스 보안 업데이트, DDE 자동 업데이트 비활성화, 모르는 문서의 연결 확인 창에서 거부하기이다."],[],1),
   n("supply","공급망 공격 (Supply Chain Attack)",["공급망 공격은 한 번 성공하면 정상 업데이트를 통해 수많은 사용자가 한꺼번에 감염되므로 피해 규모가 매우 크며, 11회에 출제되었다.","정상적으로 사용자는 믿을 수 있는 개발사의 배포 서버에서 소프트웨어와 업데이트를 받는다.","공급망 공격(Supply Chain Attack)은 사용자를 직접 노리지 않고, 사용자가 믿는 소프트웨어 개발사나 배포 서버를 먼저 침투하는 공격이다.","소스 코드에 악성 코드를 넣거나 배포 파일을 바꿔치기하면, 정상 업데이트를 통해 수많은 사용자가 한꺼번에 감염된다.","대표 사례로 SolarWinds(2020), CCleaner(2017), XZ Utils 백도어(2024)가 있다.","대응은 코드 서명 검증, 빌드·배포 서버 접근 통제, SBOM(소프트웨어 구성표) 관리이다."],[],1),
   n("apt","APT (Advanced Persistent Threat)",["APT는 한 번에 끝나는 공격이 아니라 오랫동안 숨어서 진행되기 때문에 일반적인 방어로는 발견하기 어렵다. 21회에 출제되었다.","APT(Advanced Persistent Threat)는 지능적(Advanced)이고 지속적(Persistent)인 위협(Threat)을 뜻한다.","특정 대상 하나를 정해 오랫동안 숨어 지내며 정보를 빼 가는 맞춤형 공격이다.","진행 단계는 사이버 킬 체인으로 분석한다."],[],1),
   n("killchain","사이버 킬 체인 (Cyber Kill Chain)",["APT 공격은 여러 단계로 진행되므로 단계를 나눠 보아야 어디서 끊을지 계획할 수 있으며, 7회에 출제되었다.","사이버 킬 체인(Cyber Kill Chain)은 록히드 마틴이 군사 개념을 가져와 APT 공격 과정을 7단계로 나눈 분석 모델이다.","7단계는 정찰, 무기화, 전달, 익스플로잇, 설치, 명령 및 제어(C&C), 목표 달성 순이다.","사슬 구조라서 어느 한 단계만 끊어도 공격이 완성되지 않는다. 그래서 단계별로 막을 수단을 준비한다."]),
   n("attck","MITRE ATT&CK (Adversarial Tactics, Techniques, and Common Knowledge)",["공격자가 실제로 어떤 행동을 하는지 공통 언어로 정리해 두어야 탐지와 대응을 체계적으로 할 수 있으며, 17회에 출제되었다.","MITRE ATT&CK은 실제 공격 사례를 관찰해 공격자의 행위를 전술·기술 관점으로 정리한 프레임워크이다. 비유하면 공격 기법 백과사전과 같다.","핵심 요소는 TTP로, 전술(Tactics)은 왜·무엇을 노리는지, 기술(Techniques)은 어떻게 하는지, 절차(Procedures)는 구체적인 단계를 뜻한다.","사이버 킬 체인이 공격 흐름을 7단계로 나눈 것이라면, ATT&CK은 단계마다 쓰이는 기술을 표(매트릭스)로 자세히 정리한 것이다.","MITRE는 CVE를 운영하는 바로 그 기관이다."],[],1),
   n("tempest","TEMPEST (Telecommunications Electronics Material Protected from Emanating Spurious Transmissions)",["네트워크에 연결하지 않아도 기기에서 새어 나오는 전자파만으로 정보가 도청될 수 있어서, 이를 막는 표준과 기술이 필요하며 25회에 출제되었다.","TEMPEST는 전자기기에서 새어 나오는 전자파로 정보가 도청되는 것을 막는 표준과 기술을 말한다.","정상적으로 모니터, 키보드, 케이블은 작동하면서 약한 전자파를 내보낸다.","공격자는 그 전자파를 멀리서 받아 화면이나 입력 내용을 복원한다. 대응은 차폐와 차폐실 같은 차단 설비이다.","부채널 공격의 한 종류이며, 같은 무리로 전력 소모량 차이를 분석해 암호 키를 찾는 DPA가 있다."],[],1)
  ]),
  n("s3c4","4장 취약점 점검",["설정을 잘못해 생기는 취약점은 실기에서 설정 파일과 값을 직접 쓰게 하는 문제로 자주 나오므로, 정확한 설정 문법을 익혀 두어야 한다.","4장은 웹 서버·메일·DNS 설정 점검, 쿠키·세션 보안 설정, 그리고 데이터 마스킹을 다룬다."],[
   n("axfr","존 전송 제한 (allow-transfer)",["존 전송을 제한하지 않으면 공격자가 도메인의 전체 호스트 목록을 한 번에 받아 공격 대상을 정찰할 수 있으므로, 설정 문법까지 알아야 하며 11회에 출제되었다.","정상적으로는 부 DNS 서버가 주 DNS 서버의 존 파일을 통째로 복사해 간다. 이것을 존 전송이라 하며 TCP 53번을 쓴다.","제한이 없으면 아무나 `dig axfr`로 전체 호스트 목록을 받아 가 정찰에 쓸 수 있다.","설정 위치는 `/etc/named.conf`의 `options` 안이며, 정답 형태는 `allow-transfer { 192.168.0.1; };`이다."],[],1),
   n("mailaccess","메일 릴레이 제한 (/etc/mail/access)",["아무 메일이나 대신 전달해 주는 오픈 릴레이는 스팸 발송에 악용되므로, 메일 서버의 릴레이 범위를 제한해야 하며 25회에 출제되었다.","sendmail에서는 `access` 파일에 \"도메인·IP  동작\" 형식으로 규칙을 적는다.","동작에는 `RELAY`(릴레이 허용), `OK`(조건 없이 허용), `REJECT`(거부하고 보낸 사람에게 알림), `DISCARD`(알리지 않고 조용히 폐기)가 있다.","파일을 수정한 뒤에는 `makemap hash /etc/mail/access.db < /etc/mail/access` 명령으로 DB를 다시 만들어야 적용된다."],[],1),
   n("indexes","디렉터리 리스팅 제거 (Indexes)",["디렉터리 리스팅이 켜져 있으면 백업 파일이나 설정 파일 같은 숨겨야 할 파일 목록이 그대로 노출되므로 꺼야 하며, 20회에 출제되었다.","정상적으로는 폴더에 `index.html`이 있으면 웹 서버가 그 페이지를 보여 준다.","그런데 `index.html`이 없고 `Indexes` 옵션이 켜져 있으면 폴더 안의 파일 목록이 그대로 보여 백업 파일, 설정 파일이 노출된다.","조치는 `httpd.conf`의 `Options`에서 `Indexes`를 지우거나 `-Indexes`로 바꾸는 것이다.","같은 줄에 있는 `FollowSymLinks`는 심볼릭 링크를 따라가도록 허용하는 옵션으로, 이것도 끄는 것이 안전하다."],[],1),
   n("cookiesess","쿠키 · 세션",["HTTP는 요청마다 사용자를 기억하지 못하기 때문에, 로그인 상태를 이어 가려면 사용자를 알아보는 표시가 필요하다.","세션 ID를 담은 쿠키가 그 표시이며, 비유하면 로그인 출입증과 같다. 이것을 훔치면 비밀번호 없이도 그 사람으로 로그인할 수 있으므로 보호가 중요하다."],[
    n("ckflow","로그인 흐름",["쿠키를 노리는 공격과 보안 속성을 이해하려면 먼저 정상적인 로그인 흐름을 알아야 한다.","사용자가 로그인하면 서버가 세션을 만들어 저장하고, `Set-Cookie` 헤더로 세션 ID를 보낸다.","브라우저는 이 세션 ID를 쿠키로 저장하고, 이후 요청마다 `Cookie` 헤더에 담아 자동으로 보낸다."]),
    n("cksvs","쿠키 vs 세션",["쿠키와 세션은 저장 위치가 달라서 보안 강도도 다르므로, 둘의 차이를 정확히 알아야 한다.","쿠키는 브라우저(사용자 PC)에 저장된다. 사용자가 보고 바꿀 수 있어서 보안에 약하다.","세션은 서버에 저장되며 실제 로그인 정보를 담는다.","세션 ID는 추측할 수 없도록 랜덤하게 만들어야 하며, 이 내용은 21회에 출제되었다."]),
    n("ckattack","쿠키를 노리는 공격",["쿠키는 로그인 출입증이어서 공격자가 가장 노리기 좋은 대상이다.","쿠키를 노리는 공격은 쿠키를 훔치거나(XSS, XST), 바꾸거나(쿠키 변조), 자동 전송을 악용하는 방식으로 나뉜다."],[
     n("xsssteal","XSS로 탈취",["XSS로 쿠키를 빼 가면 공격자가 비밀번호 없이 피해자로 로그인할 수 있으므로, 쿠키 공격 가운데 가장 대표적이다.","공격자가 게시판에 심은 스크립트가 글을 읽는 사람의 `document.cookie`를 읽어 공격자에게 보낸다.","점검할 때는 `<script>alert(document.cookie)<\/script>`를 넣어 쿠키가 화면에 뜨는지 확인한다.","대응은 HttpOnly 속성과 입력값 필터링이다."]),
     n("xst","XST (Cross-Site Tracing)",["XST는 HttpOnly로 막아 둔 쿠키도 빼낼 수 있는 우회 기법이어서 따로 알아 두어야 한다.","정상적으로 TRACE 메서드는 받은 요청을 그대로 돌려주는 진단용 기능이다.","XST(Cross-Site Tracing)는 이 점을 이용해, 요청에 붙은 쿠키를 응답에서 읽어 내는 공격이다. 그래서 HttpOnly를 우회할 수 있다.","대응은 TRACE 메서드를 비활성화하는 것이다."]),
     n("cktamper","쿠키 변조",["쿠키는 사용자 PC에 저장되어 사용자가 마음대로 바꿀 수 있으므로, 권한 같은 중요한 값을 담으면 안 된다.","쿠키에 권한 값(`role=user`)을 담아 두면 사용자가 이를 `role=admin`으로 바꿔 관리자 권한을 얻을 수 있다.","대응은 중요한 정보를 서버 쪽 세션에 저장하는 것이다."])
    ]),
    n("ckattr","쿠키 보안 속성",["쿠키는 로그인 출입증 역할을 하므로 전송 범위와 접근을 옵션으로 제한해야 하며, 16·22·28회에 출제되었다.","쿠키 보안 속성은 `Set-Cookie` 헤더에 붙이는 옵션이다. 예를 들면 `Set-Cookie: ID=abc; Secure; HttpOnly`처럼 쓴다."],[
     n("expires","Expires",["쿠키가 오래 유효하면 탈취당했을 때 피해 기간도 길어지므로 유효 기간을 정해 두어야 한다.","Expires 속성은 쿠키의 만료 시간을 정한다.","만료 시간을 짧게 두면 탈취당해도 금방 무효가 된다."],[],1),
     n("secure","Secure",["쿠키가 평문 HTTP로 전송되면 중간에서 엿볼 수 있으므로, 암호화된 연결에서만 보내도록 제한해야 한다.","Secure 속성은 쿠키가 HTTPS 연결에서만 전송되도록 제한한다.","이 속성으로 스니핑과 중간자 공격(MITM)을 막는다."],[],1),
     n("httponly","HttpOnly",["XSS로 심은 스크립트가 쿠키를 읽어 가지 못하게 하려면 자바스크립트의 쿠키 접근을 막아야 한다.","HttpOnly 속성은 자바스크립트(`document.cookie`)로 쿠키에 접근하지 못하게 한다.","이 속성으로 XSS를 이용한 쿠키 탈취를 막는다.","Java에서는 `cookie.setHttpOnly(true)`로 설정한다."],[],1),
     n("samesite","SameSite",["브라우저가 다른 사이트에서 시작된 요청에도 쿠키를 자동으로 붙이는 것이 CSRF의 원인이므로, 이를 제한하는 속성이 필요하다.","SameSite 속성은 다른 사이트에서 시작된 요청에 쿠키를 붙일지 말지를 정한다.","이 속성으로 CSRF를 막는다. 아직 기출에는 나오지 않았다."])
    ],1)
   ],1),
   n("masking","데이터 마스킹 (30회)",["개발·상담 등 업무에서 민감 정보를 다뤄야 하더라도 전체 값을 보여 줄 필요는 없으므로 가리는 기술이 필요하며, 30회에 출제되었다.","데이터 마스킹은 민감 정보를 `*` 등으로 가리는 기술로, 언제 가리느냐에 따라 정적 마스킹과 동적 마스킹 두 가지로 나뉜다."],[
    n("sdm","정적 데이터 마스킹 (Static Data Masking)",["운영 데이터를 개발·테스트용으로 복사할 때 원본 개인정보가 그대로 퍼지지 않도록 쓰는 방식이다.","정적 데이터 마스킹(Static Data Masking)은 저장할 때 값을 아예 바꿔 버리는 방식이어서 원본을 복구할 수 없다.","예를 들어 운영 DB를 개발 DB로 옮기면서 주민번호 뒷자리를 `*******`로 영구 변환한다."]),
    n("ddm","동적 데이터 마스킹 (Dynamic Data Masking)",["원본 데이터는 그대로 두어야 하지만 화면에 보이는 값은 가려야 할 때 쓰는 방식이다.","동적 데이터 마스킹(Dynamic Data Masking)은 DB 원본은 그대로 두고, 조회할 때만 실시간으로 가려서 보여 주는 방식이다. SQL을 자동으로 바꿔서 처리한다.","예를 들어 상담원 화면에는 `010-****-5678`로 보이고, DB에는 전체 번호가 저장되어 있다."])
   ],1)
  ])
 ]),
 n("s4","4과목 보안관제 · 침해대응",["보안관제와 침해사고 대응은 공격을 실제로 찾아내고 막는 현장 업무이기 때문에, 실기에서는 탐지 룰을 직접 쓰거나 로그를 읽고 공격을 판별하는 문제로 자주 나온다.","이 과목은 Snort·YARA·수리카타·ModSecurity 같은 보안 도구를 다루는 1장과, netstat 결과·웹 로그·Shellshock 흔적을 분석하는 2장 로그 및 침해사고 분석으로 이루어진다."],[
  n("s4c1","1장 보안 도구",["공격을 탐지하려면 패킷이나 파일을 어떤 규칙으로 검사할지 정해야 하므로, 탐지 룰의 문법과 도구의 특징을 아는 것이 관제 업무의 기본이다.","이 장은 패킷을 검사하는 룰과 도구를 다루며, Snort 룰 구조·threshold·검색 위치(offset·depth), 그리고 YARA·수리카타·ModSecurity가 포함된다."],[
   n("snort","Snort 룰 구조",["Snort는 실기에서 탐지 룰을 직접 써 보라는 문제로 나오기 때문에(3회), 룰을 이루는 각 부분의 순서와 뜻을 정확히 알아야 한다.","Snort 룰은 괄호 밖에 쓰는 헤더와 괄호 안에 쓰는 옵션, 두 부분으로 이루어진다.","헤더는 동작, 프로토콜, 출발지 IP, 출발지 포트, `->`, 목적지 IP, 목적지 포트 순서로 쓴다. 예를 들면 `alert tcp any any -> 10.0.0.25 80`과 같다.","옵션에는 `msg:\"로그에 남길 메시지\";`, `content:\"찾을 문자열\";`, `sid:룰 번호;`처럼 항목을 세미콜론으로 끝내며 쓴다.","웹(HTTP) 공격을 탐지하는 룰이라면 목적지 포트는 80이 된다.","msg는 로그에 남길 설명일 뿐 탐지 결과에는 영향을 주지 않으며, content는 기본적으로 대소문자를 구분한다."],[],1),
   n("snortpos","Snort 검색 위치 (offset · depth)",["content를 패킷 전체에서 찾으면 엉뚱한 곳에서 걸리는 오탐이 생기고 속도도 느려지므로, 찾을 위치와 범위를 정해 줄 필요가 있다. 7회에 출제되었다.","offset과 depth는 content가 페이로드의 어디서부터 얼마나 찾을지 정하는 옵션이다.","offset은 페이로드 맨 앞에서 몇 바이트 떨어진 곳부터 찾기 시작할지, 즉 시작 위치를 정한다.","depth는 그 시작 위치부터 몇 바이트까지만 찾을지, 즉 범위의 길이를 정한다.","앞의 content에 이어서 찾을 때는 시작 위치에 distance, 범위에 within을 쓴다. nocase는 대소문자를 무시하게 하는 옵션이다."],[],1),
   n("threshold","Snort threshold (22회)",["같은 공격이 수천 번 들어오면 경고도 수천 개가 쌓여 관제 요원이 진짜 위험을 놓치게 된다. 그래서 경고 횟수를 조절하는 기능이 필요하며, 22회에 출제되었다.","threshold 옵션의 형식은 `threshold: type 종류, track by_src|by_dst, count 횟수, seconds 시간;`이다.","type이 limit이면 정한 시간 안에 처음 N번까지만 경고를 낸다.","type이 threshold이면 N번 쌓일 때마다 경고를 1번씩 낸다.","type이 both이면 정한 시간 안에 N번을 넘었을 때 경고를 1번만 낸다."],[],1),
   n("suricata","수리카타 (Suricata)",["트래픽이 많아지면 한 번에 하나씩 처리하는 탐지 도구로는 분석이 밀리기 때문에, 대용량 트래픽을 빠르게 처리하는 도구가 필요해졌다. 15회에 출제되었다.","수리카타(Suricata)는 OISF(Open Information Security Foundation)가 만든 오픈소스 IDS/IPS이다.","수리카타는 Snort를 참고해 만들어졌다. Snort가 단일 스레드로 동작하는 반면, 수리카타는 멀티 코어·멀티 스레드로 동작해 대용량 트래픽을 빠르게 분석한다.","Snort 룰을 그대로 쓸 수 있고, Lua 스크립트로 기능을 확장할 수 있다."],[],1),
   n("yara","YARA",["악성코드는 네트워크를 지나간 뒤 파일 형태로 시스템에 남기 때문에, 패킷이 아니라 파일 자체를 검사하는 규칙이 따로 필요하다. 18회에 출제되었다.","YARA는 VirusTotal이 만든 악성코드 분류·탐지 도구이다.","악성코드에 들어 있는 문자열이나 바이너리 패턴을 규칙(rule)으로 적어 두고, 검사할 파일이 그 규칙에 맞는지 확인하는 방식으로 동작한다.","Snort가 네트워크 패킷을 위한 규칙이라면 YARA는 파일(악성코드)을 위한 규칙이라고 구분하면 된다.","YARA는 정적 분석, 포렌식, 침해대응에 쓰인다."],[],1),
   n("modsec","ModSecurity",["일반 방화벽은 IP와 포트만 보기 때문에, 정상 포트(80)로 들어오는 SQL 삽입이나 XSS 같은 웹 공격은 걸러 내지 못한다. 그래서 HTTP 요청 내용까지 들여다보는 웹 방화벽이 필요하다. 9회에 출제되었다.","ModSecurity는 Trustwave가 만든 오픈소스 웹 방화벽(WAF, Web Application Firewall)으로, Apache 같은 웹 서버에 모듈로 붙여 쓴다.","일반 방화벽이 IP·포트만 확인하는 것과 달리, 웹 방화벽은 HTTP 요청 내용에 SQL 삽입이나 XSS 패턴이 있는지까지 확인한다.","`SecRuleEngine` 설정값은 On(차단), Off, DetectionOnly(탐지만 함) 세 가지이다.","`SecAuditEngine` 설정값은 On(모두 기록), Off, RelevantOnly(에러·경고만 기록) 세 가지이다."],[],1)
  ]),
  n("s4c2","2장 로그 및 침해사고 분석",["침해사고가 나면 서버의 연결 상태와 로그에 공격 흔적이 남기 때문에, 이를 읽고 어떤 공격인지 판별하는 능력이 실기에서 자주 요구된다.","이 장은 netstat 결과로 공격을 판별하는 방법, 웹 로그의 URL 디코딩, Shellshock 공격 흔적 분석을 다룬다."],[
   n("netstat","netstat로 공격 판별 (3회)",["서버가 느려지거나 이상할 때 가장 먼저 지금의 연결 상태를 보고 어떤 공격인지 판단해야 한다. 3회에 netstat 결과를 보고 공격을 판별하는 문제가 나왔다.","`netstat -na`는 지금 내 서버의 연결 상태 목록을 보여 주는 명령이다.","Local Address는 내 서버의 IP와 포트이고, Foreign Address는 접속해 온 상대방의 IP와 포트이다.","SYN-RECEIVED(SYN_RECV)는 SYN을 받고 SYN+ACK를 보냈지만 마지막 ACK를 아직 받지 못한 상태이다.","같은 내 포트(:21)에 SYN-RECEIVED 상태가 줄줄이 찍혀 있으면 SYN Flooding 공격으로 판단한다.","반대로 포트 스캔이라면 내 포트 번호가 여러 개로 바뀌며 찍힌다."],[],1),
   n("urldec","웹 로그 URL 디코딩 (5회)",["웹 공격의 흔적은 웹 로그에 남지만 특수문자가 인코딩되어 있어 그대로는 읽기 어렵다. 그래서 디코딩해서 공격 문장을 복원할 줄 알아야 하며, 5회에 출제되었다.","로그에 기록되는 주소는 특수문자가 `%숫자` 형태로 바뀌어 기록되는데, 이를 URL 인코딩이라고 한다.","자주 나오는 값은 `%27` = `'`(작은따옴표), `%3D` = `=`, `%20` = 공백, `%22` = `\"`, `%3C`·`%3E` = `<`·`>`이다.","디코딩한 결과가 `id='user' and pw='1' or 1=1`이면 조건이 항상 참이 되어 로그인이 우회되므로 SQL Injection으로 판단한다.","`%3C script %3E`가 보이면 XSS를 의심한다."],[],1),
   n("shellshock","Shellshock (29회)",["Shellshock는 웹 서버가 Bash를 거쳐 프로그램을 실행하는 구조를 악용해 원격에서 명령을 실행시키는 취약점이라, 로그에 남은 흔적으로 공격을 알아보는 문제가 29회에 나왔다.","Shellshock는 Bash가 환경변수 안의 함수 정의 `() { :; };` 뒤에 붙은 명령까지 실행해 버리는 취약점이다.","정상적인 경우 환경변수는 프로그램에 넘기는 설정 메모일 뿐이므로 읽기만 해야 한다.","공격자는 `env VAR='() { :; }; 명령' bash -c ...` 형태로 환경변수에 명령을 끼워 넣어 실행시킨다.","예를 들어 `echo \"<?php system($_GET[cmd]); ?>\" > /var/www/html/shell.php` 명령을 실행시키면 웹 루트에 웹 셸이 만들어진다.","그 뒤 `shell.php?cmd=ls`로 접속하면 서버에서 원하는 명령을 실행할 수 있다."])
  ])
 ]),
 n("s5","5과목 정보보안 일반",["정보보안 일반은 암호, 인증, 접근통제처럼 다른 모든 과목의 바탕이 되는 개념과 새로운 보안 기술을 다루기 때문에 범위가 넓고 용어 문제가 많이 나온다.","이 과목은 1장 암호학, 2장 인증·접근통제, 3장 기타(리버싱·익스플로잇, 보안 솔루션, 신기술, 디지털 포렌식)로 이루어진다."],[
  n("s5c1","1장 암호학",["암호학은 기밀성과 무결성을 지키는 핵심 기술이라 시험에서 기본 개념 문제로 자주 나온다.","이 장은 대칭키·공개키 암호, 해시, 전자서명 같은 암호 기술을 다루는 영역이며, 문제를 풀면서 내용을 채워 갈 예정이다."]),
  n("s5c2","2장 인증 · 접근통제",["누가 시스템에 들어올 수 있고 들어온 뒤 무엇을 할 수 있는지 정하는 것이 보안의 기본이므로, 인증과 접근통제는 시험에 꾸준히 나온다.","이 장은 사용자 인증 방식과 접근통제 모델(MAC·DAC·RBAC)을 다룬다."],[
   n("acmodel","접근통제 모델 MAC·DAC·RBAC (3·27회)",["누가 어떤 자료를 볼 수 있는지 정하는 규칙에는 세 가지 방식이 있고, 권한을 누가 주는지와 무엇을 기준으로 판단하는지가 3회와 27회에 출제되었다.","MAC(Mandatory, 강제적 접근통제)는 자료와 사람 모두에 등급표(보안 레이블)를 붙이고 시스템이 두 등급을 비교해 접근을 허용하는 방식이다. 군대의 기밀 등급과 같으며, 권한을 부여하는 주체는 시스템이다.","DAC(Discretionary, 임의적 접근통제)는 자료의 주인이 상대의 신분(ID)을 보고 직접 접근을 허용하는 방식이다. ACL을 사용하며, 내 구글 드라이브 파일을 공유하는 것과 같다. 권한을 부여하는 주체는 소유자이다.","RBAC(Role-Based, 역할 기반 접근통제)는 사람이 아니라 역할(직무)에 권한을 주고 사람을 역할에 배정하는 방식이다. 권한을 부여하는 주체는 중앙 관리자이며, MAC과 DAC의 단점을 보완한다.","접근을 결정하는 기준은 MAC이 Security Label, DAC가 Identity, RBAC가 Role이다.","MAC·DAC·RBAC는 모두 네트워크·시스템 안에서 권한으로 막는 논리적 접근 통제에 속하며, 6과목의 예방 통제와 연결된다."],[],1)
  ]),
  n("s5c3","3장 기타",["암호학이나 접근통제로 묶이지 않는 공격 기법, 보안 솔루션, 신기술도 실기에 단골로 나오기 때문에 따로 정리해 둘 필요가 있다.","이 장은 리버싱·익스플로잇, 보안 솔루션(EDR·DLP), 신기술(클라우드·블록체인), 디지털 포렌식을 다룬다."],[
   n("g5rev","리버싱 · 익스플로잇",["버퍼 오버플로로 복귀 주소를 바꾼 다음 단계는 쉘 코드를 어디에 두고 어떻게 실행시키느냐이며, 이 부분이 리버싱·익스플로잇 문제의 핵심이다.","CPU 레지스터, 함수 호출 규약, 외부 함수 주소(PLT·GOT) 순서로 공부하면 흐름이 이어진다."],[
    n("regs64","64비트 함수 인자 레지스터 (23회)",["리버싱이나 익스플로잇을 분석할 때 함수에 어떤 값이 넘어갔는지는 레지스터를 보고 확인하기 때문에, 인자가 담기는 순서를 알아야 한다. 23회에 출제되었다.","레지스터는 CPU 안에 있는 아주 빠르고 작은 메모 칸이다.","32비트 레지스터는 이름이 E로 시작하고(EIP·ESP), 64비트 레지스터는 R로 시작한다(RIP·RSP).","64비트 리눅스는 함수 인자를 RDI, RSI, RDX, RCX, R8, R9 순서로 담는다.","주의할 점은 printf의 첫 인자가 서식 문자열 `\"%c %c %c\"`라서 RDI에 들어간다는 것이다. 그래서 'A'는 RSI, 'B'는 RDX, 'C'는 RCX에 담긴다."],[],1),
    n("shellcode","쉘 코드·NOP·RET (7회)",["버퍼 오버플로로 복귀 주소를 바꾼 뒤 실행 흐름을 어디로 보내서 무엇을 실행할지가 이 내용이며, 7회에 출제되었다.","EIP는 CPU가 다음에 실행할 명령의 위치를 가리키는 책갈피와 같은 레지스터이고, ESP는 스택 맨 위 위치를 가리키는 레지스터이다.","정상적인 경우 함수를 호출(CALL)할 때 돌아올 주소를 스택에 적어 두고, 함수가 끝나면 RET가 스택 맨 위(ESP)의 값을 EIP로 옮겨 원래 자리로 복귀한다.","쉘 코드는 쉘을 띄우는 등 특정 명령을 실행하는 작은 기계어 프로그램이다.","NOP은 아무것도 하지 않는 명령으로 값은 `0x90`이다. 쉘 코드 앞에 NOP을 길게 깔아 두면 정확한 주소를 몰라도 미끄러져 쉘 코드에 도착하게 되며, 이를 NOP Sled라고 한다.","주요 기계어 값은 NOP `0x90`, RET `0xC3`, JMP `0xEB`, CALL `0xE8`이다.","ESP 값을 EIP로 옮기는 명령은 RET이다."],[],1),
    n("pltgot","동적 링킹·PLT·GOT (23회)",["printf 같은 외부 함수의 주소는 실행 중에 찾아오는 구조라서, 공격자가 이 주소록(GOT)을 덮어써 실행 흐름을 빼앗는 공격이 있다. 23회에 출제되었다.","정적 링킹은 라이브러리 코드를 실행 파일 안에 통째로 복사하는 방식으로, 파일이 크고 주소가 고정된다.","동적 링킹은 실행할 때(런타임) 공용 라이브러리(libc.so)에 연결하는 방식으로, 파일이 작고 주소는 실행할 때 결정된다.","PLT(Procedure Linkage Table)는 외부 함수를 호출할 때 먼저 들르는 안내 데스크 역할을 한다.","GOT(Global Offset Table)는 외부 함수의 실제 주소를 적어 둔 주소록이다.","호출 흐름은 printf 호출, PLT, GOT에서 실제 주소 확인, libc의 printf로 이동 순이다.","주소록을 바꿔치기하는 공격을 GOT Overwrite라고 하며, GOT를 읽기 전용으로 만드는 RELRO로 막는다."],[],1)
   ]),
   n("g5sol","보안 솔루션",["방화벽과 백신만으로는 단말 안의 새로운 악성 행위나 내부에서 밖으로 나가는 정보 유출을 막기 어려워서, 이를 보완하는 솔루션이 시험에 나온다.","EDR은 단말 안의 악성 행위를 감시하고, DLP는 중요 정보의 유출을 감시한다."],[
    n("edr","EDR (Endpoint Detection and Response) (16회)",["백신은 이미 알려진 악성코드 목록(시그니처)에 있는 것만 잡기 때문에 제로데이 공격을 놓친다. 이를 보완하려고 행위를 감시하는 EDR이 등장했으며, 16회에 출제되었다.","EDR(Endpoint Detection and Response)에서 Endpoint는 PC·모바일·서버 같은 단말을 뜻하며, 네트워크 길목이 아니라 각 기기 안에서 감시한다.","파일 생성, 레지스트리 변경, 프로세스 실행 같은 행위를 실시간으로 기록·분석하기 때문에 처음 보는 공격도 이상 행동으로 탐지할 수 있다.","EDR의 기능은 탐지, 통제(격리), 분석, 치료(감염 전 상태로 복구) 순으로 이어진다.","IPS는 네트워크 길목에서 패킷을 차단하고, EDR은 단말 안에서 행위를 감시한다는 점으로 구분한다."],[],1),
    n("dlp","DLP (Data Loss Prevention) (24회)",["방화벽과 IPS는 밖에서 들어오는 공격을 막지만, 내부자 유출이나 실수로 안에서 밖으로 나가는 중요 자료는 막지 못한다. 이를 막는 것이 DLP이며, 24회에 출제되었다.","DLP(Data Loss Prevention)는 중요 정보가 조직 밖으로 유출되는 것을 탐지·차단하는 솔루션이다. 비유하면 회사 출입문에서 하는 반출물 검사와 같다.","주민번호, 카드번호, 기밀 키워드 같은 규칙을 정해 두고, 메일·USB·출력·업로드로 나가는 자료를 검사해 탐지·차단·기록한다.","EDR은 악성 행위를 감시하고, DLP는 중요 정보 유출을 감시한다는 점으로 구분한다.","문제에 '데이터 유출 방지'나 '외부로 빠져나가는 것을 탐지·차단'이라는 표현이 나오면 DLP를 떠올리면 된다."],[],1)
   ]),
   n("forensic","디지털 포렌식 (30회)",["해킹이나 범죄가 일어나면 PC·휴대폰 속 기록이 증거가 되는데, 함부로 다루면 법정에서 증거로 인정받지 못한다. 그래서 정해진 절차가 필요하며, 30회에 출제되었다.","디지털 포렌식은 디지털 매체에서 자료를 수집·분석·보존해 법적 증거로 제출할 수 있게 하는 절차와 방법이다.","비유하면 범죄 현장에서 지문을 채취하는 과학 수사를 컴퓨터에 하는 것과 같다."]),
   n("g5new","신기술",["새로운 기술이 널리 쓰이면 그에 맞는 보안 개념도 함께 시험에 나오기 때문에, 기본 구조와 용어를 알아 두어야 한다.","이 묶음은 클라우드 서비스 모델과 블록체인을 다룬다."],[
    n("cloud","클라우드 IaaS·PaaS·SaaS (12회)",["클라우드 서비스는 클라우드 회사가 어디까지 대신 준비해 주느냐에 따라 세 단계로 나뉘며, 이 구분이 12회에 출제되었다.","피자에 비유하면 IaaS는 주방과 오븐만 빌리는 것, PaaS는 도우와 오븐까지 받고 토핑만 내가 올리는 것, SaaS는 완성된 피자를 배달받는 것과 같다.","IaaS(Infrastructure as a Service)는 서버·스토리지·네트워크 같은 하드웨어 자원을 제공한다. 예로 AWS EC2가 있다.","PaaS(Platform as a Service)는 개발·실행 환경을 제공해, 인프라를 관리하지 않고 앱만 올리면 된다. 예로 Heroku, Vercel이 있다.","SaaS(Software as a Service)는 완성된 소프트웨어를 제공한다. 예로 Gmail, 구글 드라이브가 있다.","철자를 쓸 때는 끝이 모두 aaS, 즉 as a Service라는 점을 기억하면 된다."],[],1),
    n("blockchain","비트코인·블록체인·채굴 (20회)",["블록체인은 은행 같은 중앙 관리자 없이도 거래를 믿을 수 있게 만드는 방법이며, 20회에 출제되었다.","기존 방식에서는 은행 한 곳이 장부를 보관하기 때문에 그 은행이 해킹되면 장부 전체가 위험해진다.","블록체인은 거래 기록 묶음(블록)을 해시로 사슬처럼 연결하고, 모든 참여자가 같은 장부를 나눠 보관하는 분산 원장 방식이다. 한 곳의 기록을 고쳐도 나머지와 달라지므로 위조가 들통난다.","채굴(마이닝)은 해시 계산 문제를 먼저 풀어 새 블록을 만들고(작업 증명, PoW) 그 대가로 코인을 받는 것이다.","비트코인은 사토시 나카모토가 만든 첫 블록체인 암호화폐이고, 이더리움은 조건이 맞으면 자동으로 실행되는 스마트 계약을 지원한다.","대표적인 합의 알고리즘에는 PoW(작업 증명)와 PoS(지분 증명)가 있다."],[],1)
   ])
  ])
 ]),
 n("s6","6과목 위험분석 · 관리",["보안은 기술만으로 완성되지 않고, 무엇을 얼마나 지킬지 정하고 사고가 나도 업무를 이어 가는 관리 체계가 있어야 한다. 그래서 이 과목은 정의와 절차 순서를 묻는 문제가 많다.","이 과목은 1장 정보보호 및 위험관리(정책·목표, 위험 관리 흐름), 2장 업무연속성·사이버 위협(BCP·BIA·재해복구, ISAC·경보·침해사고 대응), 3장 인증제도(ISMS·ISMS-P)로 이루어진다."],[
  n("s6c1","1장 정보보호 및 위험관리",["한정된 예산으로 모든 위험을 막을 수는 없으므로, 보안의 방향을 정하고 위험을 분석해 우선순위대로 대응하는 과정이 정보보호 관리의 중심이다.","이 장은 정보보호 관리(거버넌스·정책 문서·보안 목표)와 위험 관리 전체 흐름(자산 파악, 위험 분석, 위험평가, 위험 처리)을 다룬다."],[
   n("mgmtgrp","정보보호 관리 (정책·목표)",["보안 활동은 경영진의 방향에서 시작해 실무 문서로 구체화되어야 실제로 지켜지므로, 이 위계와 지키려는 목표를 먼저 알아야 한다.","위에서 아래로 거버넌스(경영진의 방향), 정책(최상위 문서), 표준·지침·절차(실행) 순으로 내려간다.","지키려는 목표는 CIA(기밀성·무결성·가용성)에 부인방지·인증·책임 추적성을 더한 것이다."],[
    n("governance","정보보호 거버넌스 (18회)",["보안을 IT팀의 일로만 두면 경영 목표와 따로 놀고 예산과 지원이 따라오지 않기 때문에, 경영진이 직접 보안을 챙기는 체계가 필요하다. 18회에 출제되었다.","정보보호 거버넌스는 기업 거버넌스(회사 전체의 운영·감독 체계)의 부분집합으로, 경영진이 보안의 전략 방향을 정하고 위험 관리와 자원 활용을 지원하며 보안 활동을 계속 모니터링하는 체계이다.","비유하면 회사 이사회가 보안을 경영 과제로 직접 챙기는 체계와 같다.","문제에 '기업 거버넌스의 부분집합', '전략적 방향', '지속적 모니터링'이라는 표현이 나오면 정보보호 거버넌스를 떠올리면 된다."],[],1),
    n("policydoc","정보보호 정책 문서 체계 (1회)",["보안은 규칙으로 굴러가는데, 큰 방향(정책)만 있으면 직원이 실제로 무엇을 해야 할지 모르므로 아래 단계의 문서로 구체화한다. 1회에 출제되었다.","정책은 목적과 기본 방향을 담은 최상위 문서이며, 나라로 치면 헌법과 같다.","표준(Standards)은 반드시 지켜야 하는 세부 기준으로 의무이자 강제 사항이다. 예를 들어 '비밀번호는 8자 이상'이 표준이다.","지침(Guideline)은 도움이 되는 권고로 선택해서 적용한다. 예를 들어 '문장형 비밀번호 권장'이 지침이다.","절차(Procedure)는 단계별 실행 방법이다. 예를 들어 비밀번호를 1, 2, 3단계 순서로 바꾸는 방법이 절차이다.","문제에 의무·강제가 나오면 표준, 권고가 나오면 지침, 단계·방법이 나오면 절차로 구별하면 된다."],[],1),
    n("policyreq","정보보호 정책 구성 요건 (2회)",["정책 문서에 꼭 들어가야 할 항목이 빠지면 무엇을, 어디까지, 누가 지킬지가 불분명해지기 때문에 구성 요건이 정해져 있다. 2회에 출제되었다.","목적은 무엇(중요 자산)을 왜 보호하는지 선언하는 부분이다.","적용 범위는 정책이 어떤 업무·서비스·조직·사람·자산에 적용되는지 밝히는 부분이다.","내용은 누구나 알기 쉽게 간단하고 명료하게 써야 한다.","책임은 경영진, 정보보호 조직, 일반 직원이 각자 할 일을 정하는 부분이다.","문서화는 최고경영자가 공식 문서로 승인하는 것으로, 이를 통해 경영진의 의지를 확인한다.","흐름은 왜(목적), 어디까지(범위), 무엇을(내용), 누가(책임), 공식 승인(문서) 순으로 기억하면 된다."],[],1),
    n("cia","보안 3요소 CIA (2회)",["보안 대책은 결국 정보의 기밀성·무결성·가용성을 지키기 위한 것이므로, 각 요소가 무엇이고 어떤 기술로 지키는지 연결해 알아야 한다. 2회에 출제되었다.","기밀성(Confidentiality)은 허가된 사람만 정보를 볼 수 있게 하는 것으로, 암호화와 접근 통제로 지킨다.","무결성(Integrity)은 정보가 허가 없이 바뀌지 않게 하는 것으로, 해시와 전자서명으로 지킨다.","가용성(Availability)은 필요할 때 정보를 쓸 수 있게 하는 것으로, 백업·RAID·DRS로 지킨다. 가용성을 깨뜨리는 대표 공격은 DoS이다."]),
    n("ciaplus","CIA 외 보안 목표 (8회)",["CIA만으로는 거래를 발뺌하거나 신원을 속이는 문제, 누가 무엇을 했는지 추적하는 문제를 다룰 수 없어서 추가 보안 목표가 있다. 8회에 출제되었다.","부인방지(Non-Repudiation)는 보내 놓고 안 보냈다거나 받아 놓고 안 받았다고 발뺌하지 못하게 하는 것으로, 전자서명으로 보장한다.","인증(Authentication)은 상대가 진짜 그 사람(시스템)인지 신원을 확인하는 것으로, 비밀번호·OTP·인증서를 쓴다.","책임 추적성(Accountability)은 누가 무엇을 했는지 기록으로 추적할 수 있게 하는 것으로, 로그로 보장한다."],[],1)
   ]),
   n("riskflow","위험 관리 전체 흐름",["위험 관리는 용어가 여러 층으로 겹쳐 있어 헷갈리기 쉽기 때문에, 전체 흐름과 각 층의 단계를 한 번에 정리해 두어야 문제에서 무엇을 묻는지 구별할 수 있다.","위험 관리는 가장 큰 틀로, 분석부터 대책까지의 전체 과정이며 비용 대비 효과적으로 위험을 감수 가능한 수준으로 유지하는 것이다.","큰 흐름은 ① 자산 파악, ② 위험 분석, ③ 위험평가, ④ 위험 처리(수용·완화·회피·전가) 순이다.","④ 위험 처리 가운데 완화 대책의 종류로 예방·탐지·교정 통제가 있다.","3층 구조로 보면 가장 큰 3층은 전체 과정인 위험 관리이다.","2층은 큰 단계이다. 교재에서는 자산 파악, 위험 분석, 위험평가, 위험 처리 순이고, ISO 31000에서는 위험 식별, 위험 분석, 위험 수준 평가, 위험 처리 순이다.","가장 잘게 나눈 1층은 위험 분석 절차 7단계로, 순서는 범위, 자산 식별, 자산 가치 평가, 위협 평가, 취약성 평가, 대책 평가, 위험 정도 평가 순이다.","문제에 ISO 31000이 보이면 식별·분석·수준 평가를, 절차와 함께 자산·위협·취약성이 하나씩 나오면 7단계를, DoA와 비교하는 내용이면 위험평가를 떠올리면 된다."],[
    n("riskmgmt","위험평가·위험 관리·위험 관리계획 (1회)",["위험 평가, 위험 관리, 위험 관리계획은 이름이 비슷해 혼동하기 쉬우므로, 각각이 과정인지 문서인지와 범위를 구별해야 한다. 1회에 출제되었다.","위험 평가는 위협의 종류, 영향, 발생 가능성을 평가해 어디가 얼마나 위험한지 알아내는 것이다.","위험 관리는 평가 결과를 바탕으로 적절한 비용 안에서 통제 방안을 골라 위험을 감수 가능한 수준으로 유지하는 전체 과정이다.","위험 관리계획은 위험 식별·평가·대응 방안·실행 절차를 담은 종합 전략 문서로, 통제를 누가·언제·어디서·어떻게 적용할지 기술한다.","문제에 '평가하는 과정'이 나오면 위험 평가, '적절한 비용 내에서 통제하는 과정'이 나오면 위험 관리, '전략 문서'나 '누가 언제 어디서 어떻게'가 나오면 위험 관리계획을 떠올리면 된다."],[],1),
    n("iso31000","ISO 31000 위험 관리 프레임워크 (17회)",["ISO 31000은 국제 표준이 정한 위험 관리 단계 이름인데, 국내 교재 용어와 이름이 조금 달라 헷갈리기 쉽다. 17회에 출제되었다.","전체 순서는 환경 설정(범위·기준 정의), 위험 평가(Risk Assessment), 위험 처리, 수용 순이다.","위험 평가는 묶음 이름이며, 그 안에 위험 식별(Identification), 위험 분석(Analysis), 위험 수준 평가(Evaluation)의 3단계가 순서대로 들어 있다.","위험 식별은 자산·위협·현재 통제·취약점을 찾아내는 단계이고, 위험 분석은 원인·발생 가능성·영향을 분석하는 단계이며, 위험 수준 평가는 기준과 비교해 우선순위를 정하는 단계이다.","의사소통 및 협의, 모니터링 및 검토는 전 과정에 걸쳐 이루어진다.","Assessment는 큰 묶음이고 Evaluation은 그 안의 마지막 단계라는 점에 주의해야 한다."],[],1),
    n("riskproc","위험 분석 절차 7단계 (18회)",["위험 분석을 실제로 할 때의 세부 순서이며, 단계 이름이 '무엇을 평가하나'로 붙어 있어 순서를 묻는 문제가 나온다. 18회에 출제되었다.","순서는 1 범위 결정, 2 자산 식별(자산목록), 3 자산 가치 평가(CIA 관점의 중요도), 4 위협 및 발생 가능성 평가, 5 취약성 평가, 6 기설치된 보안대책 평가, 7 위험 정도 평가(상·중·하) 순이다.","흐름은 범위를 정하고, 자산을 찾아 값을 매기고, 위협과 취약성을 본 뒤, 이미 있는 대책을 확인하고, 최종 위험 등급을 매기는 순서로 기억하면 된다.","결국 위험 구성요소(자산·위협·취약성·대책)를 순서대로 하나씩 평가하는 과정이다."],[],1),
    n("rf1","① 자산 파악",["무엇을 지킬지 먼저 정해야 위험을 따질 수 있으므로, 위험 관리는 자산 파악에서 시작한다.","자산 파악은 자산목록을 만든 뒤 자산분석을 하는 순서로 진행된다.","위험의 재료는 자산 × 취약성 × 위협 − 대책으로 표현된다."],[
     n("asset","자산목록·자산분석 (1회)",["무엇을 가졌는지 모르면 무엇을 지킬지도 정할 수 없으므로, 자산목록과 자산분석은 위험 관리의 출발점이다. 1회에 출제되었다.","자산목록은 조직의 모든 정보자산을 빠짐없이 식별해 위치·유형·소유자·용도를 적은 목록이다.","자산분석은 목록을 바탕으로 중요도·용도·피해 영향·사용 환경을 평가해 자산의 가치와 보호 수준을 판단하는 것이다.","순서는 자산목록 작성, 자산분석(가치 평가), 위험 분석 순이다.","28회에 나온 자산 분석 3단계는 자산 식별, 자산 평가, 자산 그룹핑 순이다. 자산 평가는 CIA 관점에서 정량적 점수나 정성적 등급(낮음·보통·높음)으로 하며, 자산 그룹핑은 유형과 중요도가 비슷한 자산을 묶어 중복 분석을 줄이는 것이다."],[],1),
     n("riskelem","위험 구성요소 (2회)",["위험은 자산 × 위협 × 취약성으로 생기므로 셋 중 하나라도 없으면 위험도 없다. 그래서 각 요소를 구별할 줄 알아야 하며, 2회에 출제되었다.","자산(Assets)은 지켜야 할 대상이자 피해 규모를 계산하는 기준이다. 정보, 하드웨어, 소프트웨어, 시설, 인력, 기업 이미지가 모두 자산이다.","위협(Threats)은 자산에 손실을 줄 수 있는 원인이나 행위자로, 해커·내부자·자연재해·장비 고장 등이 있다.","취약성(Vulnerability, 취약점)은 자산의 약점, 즉 위협이 이용하는 구멍이며, 보호 대책으로 줄일 수 있다.","보호 대책(Safeguard)에는 관리적·물리적·기술적 대책이 있다.","9회에 나온 4요소 공식은 위험 = 자산 × 취약성 × 위협 − 정보보호 대책이며, 대책을 적용한 뒤에도 남는 위험을 잔여 위험이라고 한다.","비유하면 집이 자산, 도둑이 위협, 잠기지 않은 창문이 취약성, 자물쇠가 대책이다."],[],1)
    ]),
    n("rf2","② 위험 분석",["자산을 파악했으면 그 자산에 어떤 위험이 얼마나 있는지 진단해야 대응 여부를 판단할 수 있다.","위험 분석은 위협·취약성·영향을 파악해 위험의 내용과 정도를 결정하는 진단 단계이다.","얼마나 깊게 할지는 4가지 접근법 중에서 고르고, 어떻게 매길지는 말로 표현하는 정성적 방법과 돈으로 계산하는 정량적 방법 중에서 고른다."],[
     n("riskappr","위험 분석 접근법 4가지 (4회)",["회사 전체를 꼼꼼히 분석하면 돈과 시간이 너무 들고 대충 하면 위험을 놓치기 때문에, 얼마나 깊게 분석할지 고르는 큰 틀이 필요하다. 4회에 출제되었다.","기준선(Baseline) 접근법은 표준 체크리스트에 있는 대책이 갖춰져 있는지 확인하고, 없으면 구현하는 방식이다. 빠르고 싸지만 조직의 특성을 반영하지 못한다.","비정형(Informal) 접근법은 정해진 모델 없이 수행자의 경험으로 중요한 위험 위주로 분석하는 방식이다. 빠르지만 수행하는 사람에 따라 결과가 달라진다.","상세 위험 분석 접근법은 정립된 모델로 자산·위협·취약성 분석을 모두 상세히 하는 방식이다. 정확하지만 비용이 많이 들고 오래 걸린다.","통합(복합) 접근법은 위험이 높은 영역은 상세 분석을 하고 나머지는 기준선 접근법을 적용하는 방식이다. 가장 비용 효율적이어서 가장 권장된다.","델파이법은 전문가 집단 토론을 이용하는 기법이고, 비정형 접근법은 수행자의 경험에 의존하는 접근법이므로 서로 구분해야 한다."],[],1),
     n("qualrisk","정성적 위험 분석 기법 (2회)",["피해를 돈(숫자)으로 정확히 계산하기 어려울 때는 높음·중간·낮음 같은 말과 판단으로 위험을 매겨야 하므로 정성적 기법이 쓰인다. 2회에 출제되었다.","델파이법은 전문가 집단이 토론하고 의견을 모아 분석하는 기법으로, 빠르고 싸지만 정확도가 낮다.","시나리오법은 일이 기대대로 되지 않는다는 전제로 조건별로 발생 가능한 결과를 추정하는 기법이다.","순위 결정법은 비교우위 순위결정표를 이용해 위협끼리 서로 비교하여 우선순위를 도출하는 기법이다.","퍼지 행렬법은 높음·낮음 같은 말로 표현한 값을 수학적으로 계산해 기대손실을 평가하는 기법이다.","문제에 '전문가 집단'이 나오면 델파이법, '기대대로 발생하지 않는다'가 나오면 시나리오법, '비교우위 순위결정표'가 나오면 순위 결정법을 떠올리면 된다."],[],1),
     n("quantrisk","정량적 위험 분석 공식 (11회)",["위험을 돈으로 계산해야 대책에 얼마까지 써도 되는지 경영진에게 설명할 수 있기 때문에 정량적 공식이 중요하다. 11회에 출제되었다.","AV(Asset Value)는 자산 가치이다.","EF(Exposure Factor, 노출계수)는 사고 한 번에 자산이 잃는 비율로, 0~100% 사이 값이다.","SLE(Single Loss Expectancy, 단일 예상 손실액)는 SLE = AV × EF로 계산한다.","ARO(Annual Rate of Occurrence, 연간 발생률)는 사고가 1년에 몇 번 일어나는지를 나타낸다.","ALE(Annual Loss Expectancy, 연간 예상 손실액)는 ALE = SLE × ARO로 계산한다.","예를 들어 1억 원짜리 서버의 EF가 30%이면 SLE는 3천만 원이고, 1년에 2번 일어나면 ALE는 6천만 원이다. 대책 비용이 연 6천만 원보다 싸면 도입한다."],[],1)
    ]),
    n("rf3","③ 위험평가",["분석으로 위험의 크기를 알았더라도 모든 위험을 막을 수는 없으므로, 어떤 위험에 대응할지 판단하는 단계가 필요하다.","위험평가는 분석 결과를 DoA와 비교해 우선순위와 대응 여부를 결정하는 판단 단계이다."],[
     n("riskeval","위험평가·DoA (5회)",["위험을 0으로 만드는 것은 불가능하고 돈도 한정되어 있으므로, 어떤 위험부터 어디까지 막을지 정해야 한다. 5회에 출제되었다.","위험 분석은 위험이 얼마나 큰지 계산하는 진단 단계이다.","위험 평가는 그 결과를 기준선과 비교해 우선순위와 대응 여부를 결정하는 판단 단계이다.","DoA(Degree of Assurance, 수용 가능한 목표 위험 수준)는 경영진이 정하는 '이 정도는 감수한다'는 기준선이다.","DoA를 넘는 위험에 대해서만 보호 대책을 세운다.","21회 O/X 문제에서 '위험이 낮으면 단순히 비용 절감을 이유로 아무 조치도 하지 않는다'는 X였다. 위험을 수용하려면 근거, 경영진 승인, 문서화, 모니터링이 있어야 하기 때문이다."],[],1)
    ]),
    n("rf4","④ 위험 처리",["평가에서 대응하기로 한 위험은 어떤 방식으로 다룰지 정해야 실제 대책으로 이어진다.","위험 처리는 수용, 완화(감소), 회피, 전가 중에서 방식을 선택하는 단계이다.","완화 대책은 곧 통제이며, 언제 작동하느냐에 따라 예방·탐지·교정으로 나뉘고, 예방 통제는 다시 물리적·논리적 접근 통제로 나뉜다."],[
     n("risktreat","위험 처리 방식 4가지 (3회)",["모든 위험을 같은 방식으로 다룰 수는 없으므로, 위험의 크기와 비용에 맞게 처리 방식을 고른다. 3회에 출제되었다.","위험 수용은 위험을 그대로 받아들이고 손실을 감수하는 것으로, 위험이 DoA 이하일 때 선택한다.","위험 감소(완화)는 대책을 도입해 위험을 허용 범위로 낮추는 것으로, 방화벽 설치가 그 예이다.","위험 회피는 위험한 사업이나 프로세스 자체를 포기하는 것이다.","위험 전가(전이)는 보험이나 외주를 통해 손실 책임을 제3자에게 넘기는 것이다."]),
     n("ctltime","통제 시점: 예방·탐지·교정 (7회)",["아무리 막아도 뚫리는 경우가 있으므로, 사고 전·중·후로 대책을 겹겹이 두어야 한다. 7회에 출제되었다.","예방 통제(Preventive)는 사고가 나기 전에 미리 막는 통제로, 출입카드·방화벽·교육이 해당한다.","탐지 통제(Detective)는 예방을 우회해 생긴 문제를 찾아내는 통제로, CCTV·IDS·로그 감사가 해당한다.","교정 통제(Corrective)는 사고를 확인한 뒤 대처하고 피해를 최소화하며 복구하는 통제로, 백업 복구·패치가 해당한다.","비유하면 자물쇠가 예방, 도난 경보기가 탐지, 경찰 신고와 문 수리가 교정이다."],[],1),
     n("prevctl","예방 통제·물리적/논리적 접근 통제 (6회)",["사고가 난 뒤 수습하는 것보다 미리 막는 것이 가장 싸기 때문에 예방 통제가 중요하다. 6회에 출제되었다.","예방 통제(Preventive Control)는 위험 요소를 사전에 제거해 사고를 미리 막는 선제적·능동적 통제이다.","물리적 접근 통제는 관계자가 아닌 사람이 시설·설비에 들어오지 못하게 하는 것으로, 출입카드·잠금장치·경비가 해당한다.","논리적 접근 통제는 승인되지 않은 사람이 네트워크를 통해 자산에 접근하지 못하게 하는 것으로, 로그인·방화벽·권한·MAC·DAC·RBAC가 해당한다.","문제에 '예방할 목적'이 나오면 예방 통제, '시설·설비'가 나오면 물리적 접근 통제, '네트워크를 통해'가 나오면 논리적 접근 통제를 떠올리면 된다."],[],1)
    ])
   ])
  ]),
  n("s6c2","2장 업무연속성 · 사이버 위협",["재해나 사이버 공격으로 업무가 멈추면 큰 손실이 나기 때문에, 미리 복구 계획을 세우고 위협 정보를 나누며 정해진 절차로 대응하는 체계가 필요하다.","이 장은 업무연속성(BCP·BIA·RTO·RPO·재해복구 사이트)과 사이버 위협 대응(ISAC·사이버위기경보·침해사고 대응 7단계)을 다룬다."],[
   n("g6bc","업무연속성",["재해가 나도 핵심 업무를 이어 가려면 전체 계획, 복구 우선순위, 예비 센터 선택이 서로 연결되어 있어야 한다.","흐름은 BCP라는 전체 계획 안에서 BIA로 무엇부터 얼마나 빨리 살릴지(RTO·RPO) 정하고, 그 결과에 따라 재해복구 사이트(미러·핫·웜·콜드)를 고르는 순서이다."],[
    n("bcp","BCP (Business Continuity Planning, 업무 연속성 계획) (13회)",["재해가 나도 회사의 핵심 업무가 멈추지 않도록 미리 계획을 짜 두어야 하며, 이 계획이 BCP이다. 13회에 출제되었다.","BCP는 재난·재해에 대비해 핵심 시스템의 가용성과 신뢰성을 회복하고 비즈니스 연속성을 유지하기 위한 계획과 절차이다.","DRS(재해복구 시스템)와 DRP는 IT 시스템 복구에 집중하지만, BCP는 사람·장소·절차를 포함한 업무 전체를 다룬다.","문제에 '비즈니스(업무)의 연속성 유지'나 '계획과 절차'라는 표현이 나오면 BCP를 떠올리면 된다.","21회에 나온 BCP 5단계의 순서는 범위 설정 및 기획, 사업 영향평가(BIA), 복구 전략 개발, 복구계획 수립, 수행 테스트 및 유지보수 순이다.","5단계는 어디까지 할지 정하고, 무엇이 중요한지 보고, 어떻게 살릴지 전략을 세우고, 구체적 계획서를 만들고, 훈련·점검하는 흐름으로 기억하면 된다."],[],1),
    n("bia","BIA (Business Impact Analysis, 업무 영향 분석)·RTO·RPO (19회)",["모든 업무를 한 번에 복구할 수는 없으므로, 무엇부터 얼마나 빨리 살릴지 정해야 BCP를 짤 수 있다. 19회에 출제되었다.","BIA(Business Impact Analysis, 업무 영향 분석)는 주요 업무를 찾고 그 업무가 멈추면 얼마나 손해인지 평가해 중요도와 복구 우선순위를 정하는 것이며, 그 결과로 RTO와 RPO를 도출한다.","RTO(Recovery Time Objective, 복구 목표 시간)는 서비스가 멈춘 뒤 몇 시간 안에 다시 살려야 하는지를 뜻한다.","RPO(Recovery Point Objective, 복구 목표 시점)는 데이터를 어느 시점까지 잃어도 되는지를 뜻하며, 백업 주기와 연결된다.","비유하면 은행 앱은 RTO 1시간 안에 서비스를 재개해야 하고, RPO로는 마지막 1분 전 거래까지는 살려야 한다.","Time은 얼마나 빨리 복구하느냐(시간)이고, Point는 어느 시점의 데이터까지 복구하느냐(손실 허용)라고 구별하면 된다."],[],1),
    n("drs","재해복구 사이트 4유형 (10회)",["화재·지진·정전으로 주 센터가 멈추면 서비스도 멈추기 때문에, 가용성을 지키려고 다른 곳에 예비 센터를 둔다. 10회에 출제되었다.","비용이 비싼 순서와 복구가 빠른 순서는 같으며, 미러, 핫, 웜, 콜드 순이다.","미러 사이트(Mirror)는 똑같은 센터를 하나 더 두고 두 곳이 동시에 서비스하는(Active-Active) 방식으로, RTO는 0이다.","핫 사이트(Hot)는 똑같은 장비를 대기 상태로 두고 실시간으로 미러링하다가 재해 시 전환하는 방식으로, RTO는 수 시간(약 4시간)이다.","웜 사이트(Warm)는 중요한 장비만 일부 갖추고 실시간 미러링은 하지 않는 방식으로, RTO는 수일에서 수주이다.","콜드 사이트(Cold)는 데이터만 보관하고 장비는 재해가 난 뒤 조달하는 방식으로, RTO는 수주에서 수개월이다.","이사에 대비한 집에 비유하면 미러는 똑같은 집 두 채에서 동시에 생활하는 것, 핫은 가구를 다 들여 놓은 빈집, 웜은 침대만 있는 집, 콜드는 짐만 맡겨 둔 창고와 같다."],[],1)

   n("g6cy","사이버 위협 대응",["사이버 공격은 한 기관만의 문제가 아니므로, 정보를 나누고 국가 차원의 경보에 맞춰 조직이 정해진 절차로 대응하는 체계가 필요하다.","흐름은 분야별 정보 공유(ISAC), 국가 경보 단계, 조직의 침해사고 대응 절차 순으로 이어진다."],[
    n("isac","ISAC (Information Sharing and Analysis Center, 정보공유·분석센터) (13회)",["금융·통신처럼 같은 분야의 기관들은 같은 공격을 받기 때문에, 한 곳이 당한 정보를 빨리 나눠야 다른 곳이 막을 수 있다. 13회에 출제되었다.","ISAC(Information Sharing and Analysis Center, 정보공유·분석센터)은 금융·통신 등 분야별 정보통신기반시설을 보호하기 위해 구축·운영하는 기관이다.","ISAC은 취약점과 침해 요인, 그 대응 방안에 관한 정보를 제공하고, 침해 사고가 나면 실시간 경보·분석체계를 운영한다.","예로 금융보안원(금융 ISAC)이 있다.","CERT(침해사고대응팀)는 조직의 사고 대응 팀이고, ISAC은 분야별 정보 공유 기관이라는 점으로 구분한다."],[],1),
    n("cyberalert","사이버위기경보 5단계 (14회)",["공격 규모에 맞게 대응 수준을 단계적으로 올려야 과잉 대응이나 늑장 대응을 막을 수 있다. 14회에 출제되었다.","사이버위기경보의 순서는 정상, 관심, 주의, 경계, 심각 순이다.","관심은 징후가 있어 지켜보는 단계, 주의는 일부 피해가 생길 수 있는 단계, 경계는 여러 곳에 피해가 생길 수 있는 단계, 심각은 국가적으로 큰 피해가 생기는 단계이다.","근거 규정은 사이버안보업무규정 제15조이다.","감염병·재난 위기경보도 관심, 주의, 경계, 심각의 같은 순서를 쓰므로 함께 기억하면 쉽다."],[],1),
    n("irsteps","침해사고 대응 7단계 (17회)",["사고가 나면 당황해서 증거를 지우거나 피해를 키우기 쉬우므로, 정해진 순서대로 움직여야 한다. 17회에 출제되었다.","순서는 1 사고 전 준비, 2 사고 탐지, 3 초기 대응, 4 대응 전략 체계화, 5 사고 조사, 6 보고서 작성, 7 해결 순이다.","초기 대응은 탐지 직후 피해 확산을 막고, 사고 정보를 기록하고, 관련자에게 알리는 단계로, 화재로 치면 초기 진화에 해당한다.","화재에 비유하면 소화기 비치, 화재 감지, 초기 진화, 진압 작전, 원인 조사, 보고, 재발 방지 순서와 같다."],[],1)

  n("s6c3","3장 인증제도",["조직이 보안을 잘하고 있다는 것을 객관적으로 보여 주려면 공인된 기준과 기관의 확인이 필요하므로, 인증제도가 시험에 나온다.","이 장은 ISMS와 ISMS-P 인증을 다룬다."],[
   n("isms","ISMS·ISMS-P 인증 (3회)",["회사가 보안을 잘하고 있다고 말만 하는 것이 아니라, 정해진 기준에 맞는지 공인기관이 확인해 주는 제도가 필요하다. 3회에 출제되었다.","ISMS(Information Security Management System, 정보보호 관리체계) 인증은 관리적·기술적·물리적 보호조치를 포함한 관리체계가 인증 기준에 맞는지 KISA(한국인터넷진흥원) 또는 인증기관이 증명하는 제도이다.","ISMS-P는 ISMS에 개인정보보호(P = Personal information)까지 함께 인증하는 제도이다.","비유하면 ISMS는 식당의 위생 인증 마크이고, ISMS-P는 위생에 개인정보 관리까지 인증하는 마크와 같다.","CA(인증기관)는 전자서명 인증서를 발급하는 기관이므로 ISMS 인증과 구분해야 한다."],[],1)

function isMiss(t){return !!t.m;}
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('map'),box=document.getElementById('mapbox');
var byId={},rel={},open={},view={},edges=[],bounds,zoom=1,selId=null;
(function walk(t,p,depth,side){
  t.parent=p;t.depth=depth;t.side=side;byId[t.id]=t;
  t.k.forEach(function(c){walk(c,t,depth+1,depth===0?(LEFT.indexOf(c.id)>=0?-1:1):side);});
})(TREE,null,0,0);
LINKS.forEach(function(l){(rel[l[0]]=rel[l[0]]||[]).push(l[1]);(rel[l[1]]=rel[l[1]]||[]).push(l[0]);});

var OKEY='concept-map-open3';
function defaultOpen(){open={center:1};TREE.k.forEach(function(h){open[h.id]=1;});}
try{var saved=JSON.parse(localStorage.getItem(OKEY)||'null');if(saved&&saved.center)open=saved;else defaultOpen();}catch(e){defaultOpen();}
function saveOpen(){try{localStorage.setItem(OKEY,JSON.stringify(open));}catch(e){}}

var cv=document.createElement('canvas').getContext('2d');
var BODY='"Noto Sans KR",system-ui,sans-serif',DISP='"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif';
function tw(t,size,weight,fam){cv.font=weight+' '+size+'px '+fam;return cv.measureText(t).width;}
function el(nm,a,p){var e=document.createElementNS(NS,nm);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function style(t){
  if(t.depth===0)return {fs:17,fw:700,fam:DISP,h:46,kind:'center'};
  if(t.depth===1)return {fs:15,fw:700,fam:DISP,h:36,kind:'hub'};
  if(t.k.length)return {fs:14,fw:700,fam:BODY,h:30,kind:'group'};
  return {fs:13.5,fw:500,fam:BODY,h:28,kind:'leaf'};
}
function short(t){var s=t.label.replace(/\s*\([^)]*\)/g,'').trim();return s||t.label;}
function badge(t){return t.k.length&&t.depth>0?(open[t.id]?'  −':'  +'+t.k.length):'';}
function isVisible(t){for(var p=t.parent;p;p=p.parent)if(!open[p.id])return false;return true;}

function layout(){
  svg.innerHTML='';view={};edges=[];
  var gE=el('g',{},svg);el('g',{id:'xl'},svg);var gN=el('g',{},svg);
  var ROW=36,HUBGAP=26,SUBGAP=6,GAPX=46;
  var c=style(TREE);
  view.center={t:TREE,x:0,y:0,w:tw(TREE.label,c.fs,c.fw,c.fam)+44,h:c.h,s:c};
  var minX=-view.center.w/2,maxX=view.center.w/2,minY=-40,maxY=40;
  [-1,1].forEach(function(side){
    var hubs=TREE.k.filter(function(h){return h.side===side;});
    var maxW={};
    function measure(t){
      var s=style(t),w=tw(short(t),s.fs,s.fw,s.fam)+(badge(t)?tw(badge(t),12,500,BODY):0)+28;
      view[t.id]={t:t,w:w,h:s.h,s:s};
      maxW[t.depth]=Math.max(maxW[t.depth]||0,w);
      if(open[t.id])t.k.forEach(measure);
    }
    hubs.forEach(measure);
    var col={1:view.center.w/2+64};
    for(var d=2;maxW[d];d++)col[d]=col[d-1]+maxW[d-1]+GAPX;
    var cur=0;
    function place(t){
      var v=view[t.id],kids=open[t.id]?t.k:[];
      if(kids.length){
        kids.forEach(place);
        v.y=(view[kids[0].id].y+view[kids[kids.length-1].id].y)/2;
        if(t.depth>=2)cur+=SUBGAP;
      }else{v.y=cur+ROW/2;cur+=ROW;}
      v.x=side*(col[t.depth]+v.w/2);
    }
    hubs.forEach(function(h,i){if(i)cur+=HUBGAP;place(h);});
    var off=-cur/2;
    Object.keys(view).forEach(function(id){var v=view[id];if(v.t.side===side&&v.t.depth>0){v.y+=off;
      minX=Math.min(minX,v.x-v.w/2);maxX=Math.max(maxX,v.x+v.w/2);}});
    minY=Math.min(minY,off);maxY=Math.max(maxY,-off);
  });
  var pad=36;bounds={x:minX-pad,y:minY-pad,w:maxX-minX+pad*2,h:maxY-minY+pad*2};
  svg.setAttribute('viewBox',[bounds.x,bounds.y,bounds.w,bounds.h].join(' '));

  function curve(x1,y1,x2,y2){var k=(x2-x1)*.5;return 'M'+x1+' '+y1+' C'+(x1+k)+' '+y1+' '+(x2-k)+' '+y2+' '+x2+' '+y2;}
  Object.keys(view).forEach(function(id){
    var v=view[id],t=v.t;if(!t.parent)return;
    var p=view[t.parent.id],s=t.side;
    var px=t.parent.depth===0?s*p.w/2:p.x+s*p.w/2;
    var e=el('path',{class:'edge',d:curve(px,p.y,v.x-s*v.w/2,v.y)},gE);
    edges.push({el:e,a:t.parent.id,b:id});
  });
  Object.keys(view).forEach(function(id){
    var v=view[id],t=v.t,s=v.s;
    var g=el('g',{class:'node '+s.kind+(isMiss(t)?' miss':''),tabindex:'0',role:'button','aria-label':t.label+(t.k.length&&t.depth>0?(open[id]?', 펼쳐짐':', 접힘'):''),'data-id':id},gN);
    el('rect',{x:v.x-v.w/2,y:v.y-v.h/2,width:v.w,height:v.h,rx:v.h/2},g);
    var tx=el('text',{x:v.x,y:v.y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':s.fs,'font-weight':s.fw},g);
    tx.appendChild(document.createTextNode(short(t)));
    var b=badge(t);
    if(b){var ts=el('tspan',{class:'badge','font-size':12},tx);ts.textContent=b;}
    v.g=g;
    g.addEventListener('click',function(ev){ev.stopPropagation();activate(id);});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();activate(id);}});
  });
  applyZoom();
}
svg.addEventListener('click',function(){clear();});

function applyZoom(){svg.setAttribute('width',Math.round(bounds.w*zoom));svg.setAttribute('height',Math.round(bounds.h*zoom));}
function fitZoom(){return Math.min(1.1,(box.clientWidth-4)/bounds.w);}
function centerView(){box.scrollLeft=((0-bounds.x)*zoom)-box.clientWidth/2;box.scrollTop=((0-bounds.y)*zoom)-box.clientHeight/2;}
function setZoom(z,keep){
  var cx=(box.scrollLeft+box.clientWidth/2)/zoom,cy=(box.scrollTop+box.clientHeight/2)/zoom;
  zoom=Math.max(.35,Math.min(1.8,z));applyZoom();
  if(keep){box.scrollLeft=cx*zoom-box.clientWidth/2;box.scrollTop=cy*zoom-box.clientHeight/2;}else centerView();
}
function screenPos(id){var v=view[id];return {x:(v.x-bounds.x)*zoom-box.scrollLeft,y:(v.y-bounds.y)*zoom-box.scrollTop};}
function relayoutKeeping(id){
  var before=view[id]?screenPos(id):null;
  layout();
  if(before&&view[id]){var v=view[id];box.scrollLeft=(v.x-bounds.x)*zoom-before.x;box.scrollTop=(v.y-bounds.y)*zoom-before.y;}
}

var panel=document.getElementById('panel');
function clear(){
  selId=null;svg.classList.remove('focus');
  svg.querySelectorAll('.on,.sel,.rel').forEach(function(e){e.classList.remove('on','sel','rel');});
  var xl=document.getElementById('xl');if(xl)xl.innerHTML='';
  panel.hidden=true;
}
function xlink(a,b){
  var A=view[a],B=view[b],gx=document.getElementById('xl'),d;
  if(A.t.side===B.t.side){
    var s=A.t.side,ax=A.x+s*A.w/2,bx=B.x+s*B.w/2,ox=s*Math.max(Math.abs(ax),Math.abs(bx))+s*60;
    d='M'+ax+' '+A.y+' C'+ox+' '+A.y+' '+ox+' '+B.y+' '+bx+' '+B.y;
  }else{
    var ax2=A.x-A.t.side*A.w/2,bx2=B.x-B.t.side*B.w/2;
    d='M'+ax2+' '+A.y+' C'+(ax2-A.t.side*160)+' '+A.y+' '+(bx2-B.t.side*160)+' '+B.y+' '+bx2+' '+B.y;
  }
  el('path',{class:'xlink',d:d},gx);
}
function markPath(id){for(var t=byId[id];t;t=t.parent)if(view[t.id])view[t.id].g.classList.add('on');}
function highlight(id){
  svg.classList.add('focus');
  var t=byId[id];markPath(id);view[id].g.classList.add('sel');
  if(open[id])t.k.forEach(function(c){view[c.id].g.classList.add('on');});
  (rel[id]||[]).forEach(function(r){if(view[r]){markPath(r);view[r].g.classList.add('rel');xlink(id,r);}});
  edges.forEach(function(e){if(view[e.a].g.classList.contains('on')&&view[e.b].g.classList.contains('on'))e.el.classList.add('on');});
}
function showPanel(id){
  var t=byId[id],path=[];
  for(var p=t.parent;p&&p.depth>0;p=p.parent)path.unshift(p.label);
  document.getElementById('p-where').textContent=path.length?path.join(' › '):'갈래';
  document.getElementById('p-title').textContent=t.label;
  var desc=document.getElementById('p-desc');desc.innerHTML='';
  t.d.forEach(function(s){var li=document.createElement('li');li.textContent=s;desc.appendChild(li);});
  var rb=document.getElementById('p-rel');rb.innerHTML='';
  (rel[id]||[]).forEach(function(r){
    var b=document.createElement('button');b.type='button';b.textContent=byId[r].label;
    b.addEventListener('click',function(){goTo(r);});rb.appendChild(b);
  });
  document.getElementById('p-relwrap').hidden=!(rel[id]||[]).length;
  panel.hidden=false;panel.scrollTop=0;
}
function activate(id){
  if(id==='center'){clear();return;}
  var t=byId[id];
  if(t.k.length){
    if(open[id]){(function shut(n){delete open[n.id];n.k.forEach(shut);})(t);}else open[id]=1;
    saveOpen();relayoutKeeping(id);
  }else clear();
  clear();selId=id;highlight(id);showPanel(id);
}
function goTo(id){
  for(var p=byId[id].parent;p;p=p.parent)open[p.id]=1;
  saveOpen();layout();clear();selId=id;highlight(id);showPanel(id);
  var v=view[id];
  box.scrollTo({left:(v.x-bounds.x)*zoom-box.clientWidth/2,top:(v.y-bounds.y)*zoom-box.clientHeight/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
document.getElementById('p-close').addEventListener('click',clear);
document.addEventListener('keydown',function(e){if(e.key==='Escape')clear();});

document.getElementById('open-all').addEventListener('click',function(){
  Object.keys(byId).forEach(function(id){if(byId[id].k.length)open[id]=1;});saveOpen();clear();layout();setZoom(fitZoom(),false);
});
document.getElementById('close-all').addEventListener('click',function(){
  defaultOpen();saveOpen();clear();layout();setZoom(Math.max(.62,fitZoom()),false);
});
var mb=document.getElementById('toggle-miss'),KEY='concept-map-miss';
function setMiss(on){document.body.classList.toggle('show-miss',on);mb.setAttribute('aria-pressed',on?'true':'false');}
try{if(localStorage.getItem(KEY)==='1')setMiss(true);}catch(e){}
mb.addEventListener('click',function(){var on=mb.getAttribute('aria-pressed')!=='true';setMiss(on);try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}});
document.getElementById('zoom-in').addEventListener('click',function(){setZoom(zoom*1.2,true);});
document.getElementById('zoom-out').addEventListener('click',function(){setZoom(zoom/1.2,true);});
document.getElementById('zoom-fit').addEventListener('click',function(){setZoom(fitZoom(),false);});

function init(){layout();zoom=Math.max(.62,fitZoom());applyZoom();centerView();}
/* 마우스로 끌어서 화면 이동 (터치는 기본 스크롤 그대로) */
(function(){var drag=null,moved=false;
box.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,l:box.scrollLeft,t:box.scrollTop};moved=false;});
window.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.abs(dx)+Math.abs(dy)<5)return;moved=true;box.classList.add('dragging');box.scrollLeft=drag.l-dx;box.scrollTop=drag.t-dy;e.preventDefault();});
window.addEventListener('pointerup',function(){drag=null;box.classList.remove('dragging');});
box.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
})();

var done=false,ready=false;function once(){if(!done&&ready&&!document.getElementById('view-map').hidden){done=true;init();}}
function fontsOk(){ready=true;once();}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fontsOk);setTimeout(fontsOk,1200);}else fontsOk();
})();
</script>
