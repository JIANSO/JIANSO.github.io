<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>실기 개념 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 가운데 주제 → 갈래 → 묶음 → 개념으로 펼쳐지는 트리형 마인드맵. +N을 누르면 하위가 펼쳐지고, 개념을 누르면 설명 패널이 뜬다 */
:root{
  --bg:#f2ebdf;
  --band:#e9dfcf;
  --node:#faf6ee;
  --fg:#3a3027;
  --muted:#7b6c5b;
  --line:#c9b9a2;
  --accent:#86664a;
  --miss:#e0cfb3;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211c17;--band:#2a241e;--node:#2f2822;--fg:#e9e0d2;--muted:#a8977f;--line:#4d4238;--accent:#c7a57f;--miss:#4a3d30;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211c17;--band:#2a241e;--node:#2f2822;--fg:#e9e0d2;--muted:#a8977f;--line:#4d4238;--accent:#c7a57f;--miss:#4a3d30;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;
}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.6vw,32px);line-height:1.2;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools button{
  font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:4px 13px;cursor:pointer;line-height:1.6;
}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools .sp{flex:1}
button:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mapbox{background:var(--band);border-radius:12px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 170px);min-height:340px}
#map{display:block}
#map text{font-family:var(--font-body);fill:var(--fg);pointer-events:none}
#map text .badge{fill:var(--muted);font-weight:500}
.edge{fill:none;stroke:var(--line);stroke-width:1.4;transition:opacity .2s}
.xlink{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4}
.node{cursor:pointer;transition:opacity .2s}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1}
.node:hover rect{stroke:var(--accent)}
.node.hub rect{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.node.hub text{font-family:var(--font-display);font-weight:700}
.node.group rect{fill:var(--bg);stroke:var(--muted)}
.node.center rect{fill:var(--fg);stroke:var(--fg)}
#map .node.center text{fill:var(--bg);font-family:var(--font-display);font-weight:700}
body.show-miss .node.miss rect{fill:var(--miss);stroke:var(--accent)}
#map.focus .node:not(.on),#map.focus .edge:not(.on){opacity:.22}
.node.sel rect{stroke:var(--accent);stroke-width:2.4}
.node.rel rect{stroke:var(--accent);stroke-width:1.6}

.panel{
  position:fixed;z-index:5;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));max-height:min(60vh,520px);overflow:auto;
  background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(40,30,20,.16);padding:16px 18px 18px;
}
.panel .top{display:flex;align-items:flex-start;gap:10px}
.panel .where{font-size:12px;color:var(--muted);letter-spacing:.02em}
.panel h2{font-family:var(--font-display);font-size:19px;margin:2px 0 0;line-height:1.35}
.panel .x{margin-left:auto;font:inherit;font-size:20px;line-height:1;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:2px 4px}
.panel ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.panel .rel-title{margin:14px 0 6px;font-size:12px;color:var(--muted)}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px}
.panel .chips button{font:inherit;font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 11px;cursor:pointer}
.panel .chips button:hover{border-color:var(--accent)}
@media (max-width:640px){
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:48vh}
}
footer{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:700;font-family:var(--font-display);color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 14px;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qbar select{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:100%}
.qbar button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 13px;cursor:pointer;line-height:1.6}
.qbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qstat{font-size:13px;color:var(--muted);margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--node);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.miss{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card .path{font-size:12px;color:var(--muted)}
.card .clue{font-size:15px;line-height:1.65}
.card .ans{border-top:1px dashed var(--line);padding-top:8px}
.card .ans b{font-family:var(--font-display);font-size:16px;display:block}
.card .ans ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--fg);display:flex;flex-direction:column;gap:3px}
.card .act{display:flex;gap:6px;flex-wrap:wrap}
.card .act button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.card .act button.reveal{border-color:var(--fg)}
.card .act button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:24px 0}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">정보보안기사 실기 · 과목 → 교재 장 → 개념 · 풀면서 채우는 지도</span>
    <h1>실기 개념 지도</h1>
    <p class="lede">가리기: 기출 단서만 보고 답을 떠올린 뒤 확인한다. 지도: +숫자를 누르면 하위 개념이 펼쳐진다.</p>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-quiz" aria-selected="true" aria-controls="view-quiz">가리기</button>
    <button type="button" role="tab" id="tab-map" aria-selected="false" aria-controls="view-map">지도</button>
  </div>
  <section class="view" id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz">
    <div class="qbar">
      <select id="q-ch" aria-label="장 선택"></select>
      <button type="button" id="q-missonly" aria-pressed="false">틀린 것만</button>
      <button type="button" id="q-shuffle">섞기</button>
      <button type="button" id="q-hideall">답 모두 가리기</button>
      <span class="qstat" id="q-stat"></span>
    </div>
    <div class="cards" id="q-cards"></div>
  </section>
  <section class="view" id="view-map" role="tabpanel" aria-labelledby="tab-map" hidden>
  <div class="tools">
    <button type="button" id="open-all">모두 펼치기</button>
    <button type="button" id="close-all">모두 접기</button>
    <button type="button" id="toggle-miss" aria-pressed="false">헷갈린 개념 표시</button>
    <span class="sp"></span>
    <button type="button" id="zoom-out" aria-label="축소">−</button>
    <button type="button" id="zoom-fit">전체 보기</button>
    <button type="button" id="zoom-in" aria-label="확대">+</button>
  </div>
  <div class="mapbox" id="mapbox">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="개념 지도"></svg>
  </div>
  </section>
  <footer>기출을 풀며 나온 개념을 교재 장 순서로 모았다. 빈 장은 풀면서 채운다.</footer>
</div>

<div class="panel" id="panel" hidden>
  <div class="top">
    <div>
      <div class="where" id="p-where"></div>
      <h2 id="p-title"></h2>
    </div>
    <button type="button" class="x" id="p-close" aria-label="닫기">×</button>
  </div>
  <ul id="p-desc"></ul>
  <div id="p-relwrap">
    <div class="rel-title">연결된 개념</div>
    <div class="chips" id="p-rel"></div>
  </div>
</div>

<script>
(function(){
/* n(id, 이름, 설명[], 하위[], 헷갈림) */
function n(id,label,d,k,m){return {id:id,label:label,d:d,k:k||[],m:m?1:0};}

var TREE=n("center","정보보안기사 실기",["과목 → 교재 장 → 개념 순서로 펼쳐진다.","풀면서 나온 개념을 계속 채운다."],[
 n("s1","1과목 운영체제 보안",["아직 지도에 정리하지 않은 과목. 오늘 저녁에 채운다."],[
  n("s1c1","1장 정보시스템",["윈도우·유닉스 구조, 로그, 계정, 권한."]),
  n("s1c2","2장 취약점 점검",["계정·파일·서비스 설정 점검."])
 ]),
 n("s2","2과목 네트워크 보안",["TCP/IP 정상 동작 → 공격 → 보안 기술 → 장비 설정 점검."],[
  n("s2c1","1장 네트워크 일반",["정상 동작을 계층별로 정리. 모든 공격은 이 정상 동작을 속이거나 과부하를 일으킨다.","보낼 때 계층을 내려가며 헤더를 한 겹씩 씌운다(캡슐화). 받을 때는 바깥부터 벗긴다: [MAC 헤더 [IP 헤더 [TCP 헤더 [데이터]]]]"],[
   n("l1","1계층 물리",["데이터 단위: 비트.","0과 1을 전기·빛·전파 신호로 바꿔 보낸다.","장비: 허브, 리피터 (받은 신호를 모든 포트로 그대로 보낸다)."]),
   n("l2","2계층 데이터링크",["데이터 단위: 프레임. MAC 주소가 붙는다.","장비: 스위치, 브리지 (MAC 주소까지만 본다).","이 계층을 노리는 공격: Switch Jamming, ARP 스푸핑."],[
    n("swmode","스위치 전송 방식",["스위치가 프레임을 어느 시점에 내보내는지로 나뉜다.","빠를수록 오류 검사가 적다."],[
     n("cut","Cut Through",["목적지 MAC 주소만 읽고 바로 내보낸다.","가장 빠르지만, 오류가 있는 프레임도 그대로 보낸다."]),
     n("ffree","Fragment Free",["프레임의 앞 64바이트까지 받고 내보낸다.","충돌로 깨진 짧은 프레임(64바이트 미만)을 걸러 낸다. 속도와 정확성이 중간."]),
     n("snf","Store and Forward",["프레임 전체를 받아 오류(CRC)를 검사한 뒤 내보낸다.","가장 느리지만 가장 정확하다."])
    ],1),
    n("swfunc","스위치 기능 5가지",["스위치: 같은 네트워크 안에서 MAC 주소를 보고 목적지 포트로만 프레임을 보내는 2계층 장비.","허브는 모든 포트로 복사해 보낸다."],[
     n("learning","Learning",["들어온 포트와 출발지 MAC을 MAC 주소 테이블에 저장한다."]),
     n("flooding","Flooding",["목적지 MAC이 테이블에 없으면, 들어온 포트를 뺀 모든 포트로 보낸다."]),
     n("forwarding","Forwarding",["목적지 MAC이 테이블에 있으면 그 포트로만 보낸다."]),
     n("filtering","Filtering",["목적지가 들어온 포트와 같은 쪽이면 다른 포트로 보내지 않는다."]),
     n("aging","Aging",["일정 시간 쓰이지 않은 테이블 항목을 지운다."])
    ],1),
    n("vlan","VLAN",["스위치 하나를 논리적으로 여러 네트워크로 나누는 기술."],[
     n("vlanwhy","VLAN 목적",["보안: 네트워크 자원 접근을 제한한다.","크기: 브로드캐스트 도메인의 크기를 줄인다.","성능: 브로드캐스트 트래픽이 줄어 전체 성능이 좋아진다.","흐름: 나누면 접근이 막히고(보안), 브로드캐스트 범위가 작아지고(크기), 그래서 빨라진다(성능)."],[],1),
     n("vlantype","VLAN 구성 방식",["무엇을 기준으로 VLAN을 정하는지로 나뉜다."],[
      n("vport","포트 기반",["스위치 포트별로 VLAN을 할당한다. 정적 VLAN, 가장 일반적."]),
      n("vmac","MAC 기반",["호스트 MAC 주소로 VLAN을 정한다. 동적 VLAN. 모든 MAC을 등록·관리하기 어렵다."]),
      n("vip","IP 기반",["네트워크 주소(IP)별로 VLAN을 구성한다."]),
      n("vproto","프로토콜 기반",["같은 통신 프로토콜끼리 통신하도록 구성한다."])
     ],1)
    ]),
    n("arp","ARP",["IP 주소로 MAC 주소를 알아낸다.","교재에 따라 3계층으로 보기도 한다. 이 지도는 MAC 주소를 다루므로 2계층에 둔다."],[
     n("arpreq","ARP Request",["목적지 MAC을 FF:FF:FF:FF:FF:FF(브로드캐스트)로 보내 네트워크 전체에 묻는다.","상대 MAC을 모르고, 2계층은 목적지 MAC 없이 프레임을 보낼 수 없기 때문이다."],[],1),
     n("arprep","ARP Reply",["찾는 IP를 가진 장비만 자기 MAC 주소로 답한다."]),
     n("arpcache","ARP 캐시 테이블",["알아낸 IP–MAC 쌍을 저장하는 표.","ARP 스푸핑이 이 표를 바꾼다."])
    ],1),
    n("rarp","RARP",["ARP의 반대. MAC 주소로 IP 주소를 알아낸다.","하드디스크가 없는 장비나 네트워크로 부팅하는 장비가 사용한다."],[],1),
    n("promisc","Promiscuous Mode",["네트워크 카드가 자기에게 오지 않은 프레임까지 받는 모드.","스니핑에 쓰이고, NIDS도 이 모드로 패킷을 수집한다."])
   ]),
   n("l3","3계층 네트워크",["데이터 단위: 패킷. IP 주소가 붙는다.","장비: 라우터 (IP 주소까지 본다).","이 계층을 노리는 공격: Smurf, Land, Teardrop. 이 계층 보안: IPSec."],[
    n("frag","프래그먼트 (IP 단편화)",["패킷이 MTU(이더넷은 보통 1500바이트)보다 크면 3계층에서 여러 조각으로 나눈다.","받는 쪽은 Fragment Offset을 보고 조각을 다시 합친다.","계층의 데이터 단위가 아니라, 패킷을 나눈 조각이다."],[],1),
    n("icmpg","ICMP",["네트워크 상태를 확인하고 오류를 알리는 3계층 프로토콜."],[
     n("echo","Echo Request · Reply",["ping이 쓰는 메시지.","Echo Request로 묻고 Echo Reply로 답한다."]),
     n("dbcast","Directed Broadcast",["외부 네트워크에서 특정 네트워크 전체로 보내는 브로드캐스트.","철자 주의: Directed."],[],1)
    ]),
    n("routing","라우팅 프로토콜",["라우터(3계층)끼리 목적지까지 가는 길 정보를 주고받는 규칙.","AS 안에서 쓰는지, AS 사이에서 쓰는지로 나뉜다."],[

hs:"TLS에서 서로 인증하고 암호 알고리즘과 키를 협상하는 상위 프로토콜은?",
ccs:"TLS에서 협상한 암호 방식으로 이제부터 바꾼다고 알리는 상위 프로토콜은?",
alert:"TLS에서 문제가 생기면 경고·오류를 알리는 상위 프로토콜은?"
};
var QKEY='concept-quiz-state',qs={};
try{qs=JSON.parse(localStorage.getItem(QKEY)||'{}')||{};}catch(e){qs={};}
function saveQ(){try{localStorage.setItem(QKEY,JSON.stringify(qs));}catch(e){}}
function isMiss(t){return qs[t.id]==='miss'||(t.m&&qs[t.id]!=='ok');}
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('map'),box=document.getElementById('mapbox');
var byId={},rel={},open={},view={},edges=[],bounds,zoom=1,selId=null;
(function walk(t,p,depth,side){
  t.parent=p;t.depth=depth;t.side=side;byId[t.id]=t;
  t.k.forEach(function(c){walk(c,t,depth+1,depth===0?(LEFT.indexOf(c.id)>=0?-1:1):side);});
})(TREE,null,0,0);
LINKS.forEach(function(l){(rel[l[0]]=rel[l[0]]||[]).push(l[1]);(rel[l[1]]=rel[l[1]]||[]).push(l[0]);});

var OKEY='concept-map-open3';
function defaultOpen(){open={center:1};TREE.k.forEach(function(h){open[h.id]=1;});}
try{var saved=JSON.parse(localStorage.getItem(OKEY)||'null');if(saved&&saved.center)open=saved;else defaultOpen();}catch(e){defaultOpen();}
function saveOpen(){try{localStorage.setItem(OKEY,JSON.stringify(open));}catch(e){}}

var cv=document.createElement('canvas').getContext('2d');
var BODY='"Noto Sans KR",system-ui,sans-serif',DISP='"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif';
function tw(t,size,weight,fam){cv.font=weight+' '+size+'px '+fam;return cv.measureText(t).width;}
function el(nm,a,p){var e=document.createElementNS(NS,nm);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function style(t){
  if(t.depth===0)return {fs:17,fw:700,fam:DISP,h:46,kind:'center'};
  if(t.depth===1)return {fs:15,fw:700,fam:DISP,h:36,kind:'hub'};
  if(t.k.length)return {fs:14,fw:700,fam:BODY,h:30,kind:'group'};
  return {fs:13.5,fw:500,fam:BODY,h:28,kind:'leaf'};
}
function badge(t){return t.k.length&&t.depth>0?(open[t.id]?'  −':'  +'+t.k.length):'';}
function isVisible(t){for(var p=t.parent;p;p=p.parent)if(!open[p.id])return false;return true;}

function layout(){
  svg.innerHTML='';view={};edges=[];
  var gE=el('g',{},svg);el('g',{id:'xl'},svg);var gN=el('g',{},svg);
  var ROW=36,HUBGAP=26,SUBGAP=6,GAPX=46;
  var c=style(TREE);
  view.center={t:TREE,x:0,y:0,w:tw(TREE.label,c.fs,c.fw,c.fam)+44,h:c.h,s:c};
  var minX=-view.center.w/2,maxX=view.center.w/2,minY=-40,maxY=40;
  [-1,1].forEach(function(side){
    var hubs=TREE.k.filter(function(h){return h.side===side;});
    var maxW={};
    function measure(t){
      var s=style(t),w=tw(t.label,s.fs,s.fw,s.fam)+(badge(t)?tw(badge(t),12,500,BODY):0)+28;
      view[t.id]={t:t,w:w,h:s.h,s:s};
      maxW[t.depth]=Math.max(maxW[t.depth]||0,w);
      if(open[t.id])t.k.forEach(measure);
    }
    hubs.forEach(measure);
    var col={1:view.center.w/2+64};
    for(var d=2;maxW[d];d++)col[d]=col[d-1]+maxW[d-1]+GAPX;
    var cur=0;
    function place(t){
      var v=view[t.id],kids=open[t.id]?t.k:[];
      if(kids.length){
        kids.forEach(place);
        v.y=(view[kids[0].id].y+view[kids[kids.length-1].id].y)/2;
        if(t.depth>=2)cur+=SUBGAP;
      }else{v.y=cur+ROW/2;cur+=ROW;}
      v.x=side*(col[t.depth]+v.w/2);
    }
    hubs.forEach(function(h,i){if(i)cur+=HUBGAP;place(h);});
    var off=-cur/2;
    Object.keys(view).forEach(function(id){var v=view[id];if(v.t.side===side&&v.t.depth>0){v.y+=off;
      minX=Math.min(minX,v.x-v.w/2);maxX=Math.max(maxX,v.x+v.w/2);}});
    minY=Math.min(minY,off);maxY=Math.max(maxY,-off);
  });
  var pad=36;bounds={x:minX-pad,y:minY-pad,w:maxX-minX+pad*2,h:maxY-minY+pad*2};
  svg.setAttribute('viewBox',[bounds.x,bounds.y,bounds.w,bounds.h].join(' '));

  function curve(x1,y1,x2,y2){var k=(x2-x1)*.5;return 'M'+x1+' '+y1+' C'+(x1+k)+' '+y1+' '+(x2-k)+' '+y2+' '+x2+' '+y2;}
  Object.keys(view).forEach(function(id){
    var v=view[id],t=v.t;if(!t.parent)return;
    var p=view[t.parent.id],s=t.side;
    var px=t.parent.depth===0?s*p.w/2:p.x+s*p.w/2;
    var e=el('path',{class:'edge',d:curve(px,p.y,v.x-s*v.w/2,v.y)},gE);
    edges.push({el:e,a:t.parent.id,b:id});
  });
  Object.keys(view).forEach(function(id){
    var v=view[id],t=v.t,s=v.s;
    var g=el('g',{class:'node '+s.kind+(isMiss(t)?' miss':''),tabindex:'0',role:'button','aria-label':t.label+(t.k.length&&t.depth>0?(open[id]?', 펼쳐짐':', 접힘'):''),'data-id':id},gN);
    el('rect',{x:v.x-v.w/2,y:v.y-v.h/2,width:v.w,height:v.h,rx:v.h/2},g);
    var tx=el('text',{x:v.x,y:v.y+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':s.fs,'font-weight':s.fw},g);
    tx.appendChild(document.createTextNode(t.label));
    var b=badge(t);
    if(b){var ts=el('tspan',{class:'badge','font-size':12},tx);ts.textContent=b;}
    v.g=g;
    g.addEventListener('click',function(ev){ev.stopPropagation();activate(id);});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();activate(id);}});
  });
  applyZoom();
}
svg.addEventListener('click',function(){clear();});

function applyZoom(){svg.setAttribute('width',Math.round(bounds.w*zoom));svg.setAttribute('height',Math.round(bounds.h*zoom));}
function fitZoom(){return Math.min(1.1,(box.clientWidth-4)/bounds.w);}
function centerView(){box.scrollLeft=((0-bounds.x)*zoom)-box.clientWidth/2;box.scrollTop=((0-bounds.y)*zoom)-box.clientHeight/2;}
function setZoom(z,keep){
  var cx=(box.scrollLeft+box.clientWidth/2)/zoom,cy=(box.scrollTop+box.clientHeight/2)/zoom;
  zoom=Math.max(.35,Math.min(1.8,z));applyZoom();
  if(keep){box.scrollLeft=cx*zoom-box.clientWidth/2;box.scrollTop=cy*zoom-box.clientHeight/2;}else centerView();
}
function screenPos(id){var v=view[id];return {x:(v.x-bounds.x)*zoom-box.scrollLeft,y:(v.y-bounds.y)*zoom-box.scrollTop};}
function relayoutKeeping(id){
  var before=view[id]?screenPos(id):null;
  layout();
  if(before&&view[id]){var v=view[id];box.scrollLeft=(v.x-bounds.x)*zoom-before.x;box.scrollTop=(v.y-bounds.y)*zoom-before.y;}
}

var panel=document.getElementById('panel');
function clear(){
  selId=null;svg.classList.remove('focus');
  svg.querySelectorAll('.on,.sel,.rel').forEach(function(e){e.classList.remove('on','sel','rel');});
  var xl=document.getElementById('xl');if(xl)xl.innerHTML='';
  panel.hidden=true;
}
function xlink(a,b){
  var A=view[a],B=view[b],gx=document.getElementById('xl'),d;
  if(A.t.side===B.t.side){
    var s=A.t.side,ax=A.x+s*A.w/2,bx=B.x+s*B.w/2,ox=s*Math.max(Math.abs(ax),Math.abs(bx))+s*60;
    d='M'+ax+' '+A.y+' C'+ox+' '+A.y+' '+ox+' '+B.y+' '+bx+' '+B.y;
  }else{
    var ax2=A.x-A.t.side*A.w/2,bx2=B.x-B.t.side*B.w/2;
    d='M'+ax2+' '+A.y+' C'+(ax2-A.t.side*160)+' '+A.y+' '+(bx2-B.t.side*160)+' '+B.y+' '+bx2+' '+B.y;
  }
  el('path',{class:'xlink',d:d},gx);
}
function markPath(id){for(var t=byId[id];t;t=t.parent)if(view[t.id])view[t.id].g.classList.add('on');}
function highlight(id){
  svg.classList.add('focus');
  var t=byId[id];markPath(id);view[id].g.classList.add('sel');
  if(open[id])t.k.forEach(function(c){view[c.id].g.classList.add('on');});
  (rel[id]||[]).forEach(function(r){if(view[r]){markPath(r);view[r].g.classList.add('rel');xlink(id,r);}});
  edges.forEach(function(e){if(view[e.a].g.classList.contains('on')&&view[e.b].g.classList.contains('on'))e.el.classList.add('on');});
}
function showPanel(id){
  var t=byId[id],path=[];
  for(var p=t.parent;p&&p.depth>0;p=p.parent)path.unshift(p.label);
  document.getElementById('p-where').textContent=path.length?path.join(' › '):'갈래';
  document.getElementById('p-title').textContent=t.label;
  var desc=document.getElementById('p-desc');desc.innerHTML='';
  t.d.forEach(function(s){var li=document.createElement('li');li.textContent=s;desc.appendChild(li);});
  var rb=document.getElementById('p-rel');rb.innerHTML='';
  (rel[id]||[]).forEach(function(r){
    var b=document.createElement('button');b.type='button';b.textContent=byId[r].label;
    b.addEventListener('click',function(){goTo(r);});rb.appendChild(b);
  });
  document.getElementById('p-relwrap').hidden=!(rel[id]||[]).length;
  panel.hidden=false;panel.scrollTop=0;
}
function activate(id){
  if(id==='center'){clear();return;}
  var t=byId[id];
  if(t.k.length){
    if(open[id]){(function shut(n){delete open[n.id];n.k.forEach(shut);})(t);}else open[id]=1;
    saveOpen();relayoutKeeping(id);
  }else clear();
  clear();selId=id;highlight(id);showPanel(id);
}
function goTo(id){
  for(var p=byId[id].parent;p;p=p.parent)open[p.id]=1;
  saveOpen();layout();clear();selId=id;highlight(id);showPanel(id);
  var v=view[id];
  box.scrollTo({left:(v.x-bounds.x)*zoom-box.clientWidth/2,top:(v.y-bounds.y)*zoom-box.clientHeight/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
document.getElementById('p-close').addEventListener('click',clear);
document.addEventListener('keydown',function(e){if(e.key==='Escape')clear();});

document.getElementById('open-all').addEventListener('click',function(){
  Object.keys(byId).forEach(function(id){if(byId[id].k.length)open[id]=1;});saveOpen();clear();layout();setZoom(fitZoom(),false);
});
document.getElementById('close-all').addEventListener('click',function(){
  defaultOpen();saveOpen();clear();layout();setZoom(Math.max(.62,fitZoom()),false);
});
var mb=document.getElementById('toggle-miss'),KEY='concept-map-miss';
function setMiss(on){document.body.classList.toggle('show-miss',on);mb.setAttribute('aria-pressed',on?'true':'false');}
try{if(localStorage.getItem(KEY)==='1')setMiss(true);}catch(e){}
mb.addEventListener('click',function(){var on=mb.getAttribute('aria-pressed')!=='true';setMiss(on);try{localStorage.setItem(KEY,on?'1':'0');}catch(e){}});
document.getElementById('zoom-in').addEventListener('click',function(){setZoom(zoom*1.2,true);});
document.getElementById('zoom-out').addEventListener('click',function(){setZoom(zoom/1.2,true);});
document.getElementById('zoom-fit').addEventListener('click',function(){setZoom(fitZoom(),false);});

function init(){layout();zoom=Math.max(.62,fitZoom());applyZoom();centerView();}
var done=false,ready=false;function once(){if(!done&&ready&&!document.getElementById('view-map').hidden){done=true;init();}}
function fontsOk(){ready=true;once();}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fontsOk);setTimeout(fontsOk,1200);}else fontsOk();

/* ── 탭 ── */
var TKEY='concept-tab';
function showTab(name){
  var q=name!=='map';
  document.getElementById('view-quiz').hidden=!q;document.getElementById('view-map').hidden=q;
  document.getElementById('tab-quiz').setAttribute('aria-selected',q?'true':'false');
  document.getElementById('tab-map').setAttribute('aria-selected',q?'false':'true');
  if(q)clear();else if(done)layout();else once();
  try{localStorage.setItem(TKEY,name);}catch(e){}
}
document.getElementById('tab-quiz').addEventListener('click',function(){showTab('quiz');renderQuiz();});
document.getElementById('tab-map').addEventListener('click',function(){showTab('map');});

/* ── 가리기 ── */
var chapters=[];
TREE.k.forEach(function(s){s.k.forEach(function(c){
  var items=[];(function w(t){if(CLUES[t.id])items.push(t);t.k.forEach(w);})(c);
  if(items.length)chapters.push({id:c.id,label:s.label.replace(/ .*/,'')+' '+c.label,items:items});
});});
var sel=document.getElementById('q-ch'),missOnly=false,order=null,shown={};
var opt=document.createElement('option');opt.value='all';opt.textContent='전체 장';sel.appendChild(opt);
chapters.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.label+' ('+c.items.length+')';sel.appendChild(o);});
try{var sc=localStorage.getItem('concept-quiz-ch');if(sc&&sel.querySelector('option[value="'+sc+'"]'))sel.value=sc;}catch(e){}
function pool(){var out=[];chapters.forEach(function(c){if(sel.value==='all'||sel.value===c.id)out=out.concat(c.items);});return out;}
function pathOf(t){var p=[];for(var x=t.parent;x&&x.depth>1;x=x.parent)p.unshift(x.label);return p.join(' › ');}
function renderQuiz(){
  var box=document.getElementById('q-cards');box.innerHTML='';
  var items=pool();if(order)items=order.filter(function(t){return items.indexOf(t)>=0;});
  var all=items.length,missN=items.filter(isMiss).length,okN=items.filter(function(t){return qs[t.id]==='ok';}).length;
  if(missOnly)items=items.filter(isMiss);
  document.getElementById('q-stat').textContent=all+'개 · 알았음 '+okN+' · 헷갈림 '+missN;
  if(!items.length){var e=document.createElement('div');e.className='empty';e.textContent=missOnly?'헷갈린 개념이 없어요.':'이 장에는 아직 카드가 없어요.';box.appendChild(e);return;}
  items.forEach(function(t){
    var c=document.createElement('article');c.className='card'+(isMiss(t)?' miss':'');
    var p=document.createElement('div');p.className='path';p.textContent=pathOf(t);c.appendChild(p);
    var q=document.createElement('div');q.className='clue';q.textContent=CLUES[t.id];c.appendChild(q);
    var ans=document.createElement('div');ans.className='ans';ans.hidden=!shown[t.id];
    var b=document.createElement('b');b.textContent=t.label;ans.appendChild(b);
    var ul=document.createElement('ul');t.d.forEach(function(s){var li=document.createElement('li');li.textContent=s;ul.appendChild(li);});ans.appendChild(ul);
    var act=document.createElement('div');act.className='act';
    var r=document.createElement('button');r.type='button';r.className='reveal';r.textContent=shown[t.id]?'답 가리기':'답 보기';
    r.addEventListener('click',function(){shown[t.id]=!shown[t.id];ans.hidden=!shown[t.id];r.textContent=shown[t.id]?'답 가리기':'답 보기';});
    var ok=document.createElement('button');ok.type='button';ok.textContent='알았음';if(qs[t.id]==='ok')ok.className='on';
    var no=document.createElement('button');no.type='button';no.textContent='몰랐음';if(qs[t.id]==='miss')no.className='on';
    ok.addEventListener('click',function(){qs[t.id]=qs[t.id]==='ok'?undefined:'ok';saveQ();renderQuiz();});
    no.addEventListener('click',function(){qs[t.id]=qs[t.id]==='miss'?undefined:'miss';saveQ();renderQuiz();});
    act.appendChild(r);act.appendChild(ok);act.appendChild(no);
    c.appendChild(act);c.appendChild(ans);box.appendChild(c);
  });
}
sel.addEventListener('change',function(){order=null;try{localStorage.setItem('concept-quiz-ch',sel.value);}catch(e){}renderQuiz();});
var mo=document.getElementById('q-missonly');
mo.addEventListener('click',function(){missOnly=!missOnly;mo.setAttribute('aria-pressed',missOnly?'true':'false');renderQuiz();});
document.getElementById('q-shuffle').addEventListener('click',function(){var a=pool().slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}order=a;shown={};renderQuiz();});
document.getElementById('q-hideall').addEventListener('click',function(){shown={};renderQuiz();});
var startTab='quiz';try{startTab=localStorage.getItem(TKEY)||'quiz';}catch(e){}
showTab(startTab);renderQuiz();
})();
</script>
